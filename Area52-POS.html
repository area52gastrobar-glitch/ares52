<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--panel:#0d0d18;--card:#13131f;--card2:#181828;
  --border:#22223a;--accent:#a855f7;--gold:#f5a623;
  --green:#22c55e;--red:#ef4444;--blue:#38bdf8;--cyan:#06b6d4;
  --text:#e8e8f5;--muted:#55558a;--dim:#2a2a45;
}
body{background:var(--bg);color:var(--text);font-family:'Trebuchet MS',sans-serif;min-height:100vh}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:99px}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--card2);border:1px solid #a855f733;border-radius:24px;padding:32px;width:370px;max-width:95vw;box-shadow:0 0 80px #a855f722}
.user-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.user-card:hover,.user-card.sel{border-color:var(--accent);background:#a855f712;box-shadow:0 0 12px #a855f733}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--dim);transition:background .15s}
.pin-dot.filled{background:var(--accent)}
.pin-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:20px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;width:100%}
.pin-btn:hover{background:var(--card2);border-color:var(--accent)}
.pin-btn:active{transform:scale(.93)}

/* ── LAYOUT ── */
#header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px;display:none;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50}
#tabs{background:var(--panel);border-bottom:1px solid var(--border);display:none;overflow-x:auto}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:11px 18px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
#content{padding:10px 12px;max-width:1340px;margin:0 auto}

/* ── LOGO ── */
.logo-title{font-weight:900;font-size:20px;background:linear-gradient(90deg,#a855f7,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;text-transform:uppercase;line-height:1}
.logo-sub{color:var(--muted);font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:600}

/* ── TAGS / PILLS ── */
.tag{border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700}
.pill{border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.pill.active{border-color:var(--accent);background:#a855f722;color:var(--accent)}

/* ── BUTTONS ── */
.btn{border:none;border-radius:9px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-full{width:100%;justify-content:center}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 0 12px #a855f744}
.btn-green{background:var(--green);color:#000;box-shadow:0 0 10px #22c55e44}
.btn-blue{background:var(--blue);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#000;box-shadow:0 0 10px #f5a62344}
.btn-dark{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn-outline{background:transparent;border:1.5px solid var(--muted);color:var(--muted)}
.btn:disabled{background:var(--dim);color:var(--muted);cursor:not-allowed;opacity:.5;box-shadow:none}

/* ── INPUTS ── */
.inp{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
.inp-sm{padding:5px 9px;font-size:12px}
select.inp{cursor:pointer}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:#000000cc;display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(6px)}
.modal-box{background:var(--card2);border:1px solid #a855f744;border-radius:20px;padding:26px;width:420px;max-width:95vw;box-shadow:0 0 60px #a855f722;max-height:90vh;overflow-y:auto}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.card2{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}
.section-title{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}

/* ── MAPA ── */
#mapa-wrap{position:relative;background:var(--bg);border-radius:14px;height:300px;user-select:none;overflow:scroll;overflow-x:scroll;overflow-y:scroll;border:1px solid var(--border);-webkit-overflow-scrolling:touch}@media(min-width:700px){#mapa-wrap{height:430px}}
.mesa-node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid;transition:box-shadow .2s;cursor:pointer}

/* ── PEDIDO ── */
.carta-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.carta-item{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 9px;cursor:pointer;transition:border-color .15s}
.carta-item:hover{border-color:var(--accent)}

/* ── INVENTARIO ── */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.inv-bar{height:4px;background:var(--dim);border-radius:99px;margin-bottom:8px}
.inv-fill{height:100%;border-radius:99px;transition:width .3s}

/* ── VENTAS / CAJA ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;text-align:center}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.full-col{grid-column:1/-1}

/* ── GASTOS ── */
.gasto-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);gap:8px}

/* ── CIERRE ── */
.cierre-card{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:18px;margin-bottom:14px}
.cierre-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.cierre-total{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:18px;font-weight:900}

/* ── HISTORIAL CIERRES ── */
.cierre-hist-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.cierre-hist-item:hover{border-color:var(--gold)}

/* ── ADMIN ── */
.user-row-admin{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.forma-btn{flex:1;background:transparent;border:2px solid var(--border);border-radius:10px;padding:9px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.forma-btn.sel{border-color:var(--accent);background:#a855f720}
.ori-btn{flex:1;background:transparent;border:2px solid var(--border);border-radius:9px;padding:7px 4px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.ori-btn.sel{border-color:var(--blue);background:#38bdf820;color:var(--blue)}

/* ── EMOJI PICKER ── */
.emoji-grid{display:flex;flex-wrap:wrap;gap:5px}
.emj-btn{font-size:22px;background:transparent;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:4px;transition:all .15s;line-height:1}
.emj-btn:hover{background:#a855f720}
.emj-btn.sel{background:#a855f722;border-color:var(--accent)}

/* ── SYNC ── */
#sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── MISC ── */
.alert-box{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px}
.alert-red{background:#ef444418;border:1px solid #ef444444;color:#ef4444}
.alert-green{background:#22c55e14;border:1px solid #22c55e33;color:#22c55e}
.alert-blue{background:#38bdf814;border:1px solid #38bdf833;color:#38bdf8}
.alert-gold{background:#f5a62314;border:1px solid #f5a62333;color:#f5a623}
.zona-btn{border-radius:10px;padding:7px 15px;font-weight:800;font-size:13px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:700px){.grid2{grid-template-columns:1fr 375px}}
.grid1{display:grid;grid-template-columns:1fr}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mb4{margin-bottom:4px}
.cat-title{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:5px;margin-top:14px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 13px;display:flex;gap:10px;transition:border-color .15s}
.prod-card:hover{border-color:var(--accent)}
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
</style>
</head>

/* ═══════════════ FIREBASE ═══════════════ */
// db is set by the dynamic loader in <head> once Firebase scripts load
function getDb(){return window._db||null;}
function ref(path){var d=getDb();return d?d.ref(path):null;}
function fbSet(path,val){var r=ref(path);if(r)r.set(val);}
function fbPush(path,val){var r=ref(path);if(r)r.push(val);}
function fbOn(path,cb){var r=ref(path);if(r)r.on('value',function(s){cb(s.val());});return r;}
function fbOff(path){var r=ref(path);if(r)r.off();}

/* ═══════════════ CONSTANTES ═══════════════ */

var fmt=function(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);};
// ── Formateo de miles en campos de dinero ──
function moneyFmt(s){var d=String(s==null?'':s).replace(/[^0-9]/g,'');if(!d)return'';return parseInt(d,10).toLocaleString('es-CO');}
function moneyVal(idOrEl){var el=(typeof idOrEl==='string')?document.getElementById(idOrEl):idOrEl;if(!el)return 0;return parseInt(String(el.value).replace(/[^0-9]/g,''),10)||0;}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains('money')){
    var digitsBefore=String(t.value).slice(0,t.selectionStart||0).replace(/[^0-9]/g,'').length;
    t.value=moneyFmt(t.value);
    // Reposicionar el cursor tras el dígito correspondiente
    var idx=0,seen=0;
    while(idx<t.value.length&&seen<digitsBefore){if(/[0-9]/.test(t.value[idx]))seen++;idx++;}
    try{t.setSelectionRange(idx,idx);}catch(err){}
  }
},true);
var fmtDate=function(ts){return new Date(ts).toLocaleDateString('es-CO');};
var fmtTime=function(ts){return new Date(ts).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});};
var fmtDT=function(ts){return fmtDate(ts)+' '+fmtTime(ts);};

var HORA_CIERRE_NEGOCIO=5;  // a las 5am cambia el día de negocio
function fechaNegocio(ts){var d=new Date(ts);d.setHours(d.getHours()-HORA_CIERRE_NEGOCIO);return d;}
function diaNegocioStr(ts){return fechaNegocio(ts).toLocaleDateString('es-CO');}
function hoyNegocioStr(){return diaNegocioStr(Date.now());}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function precioItem(it){
  if(it.isCombo) return it.comboPrecio||0;
  if(it.isCustom) return it.customPrecio||0;
  if(it.isCubetazoMix) return it.cubMixPrecio||0;
  // Variante con precio propio (ej: Pizza Personal/Mediana)
  if(it.variantePrecio) return it.variantePrecio;
  var p=menu.find(function(m){return m.id===it.pid;});if(!p)return 0;return it.cubeta?(p.cubeta||p.precio*5):p.precio;
}
function totalPedido(mid){return(pedidos[mid]||[]).reduce(function(a,it){return a+precioItem(it)*it.qty;},0);}
function ventasTurno(){return ventas.filter(function(v){return v.ts>=turnoInicio;});}
function gastosTurno(){return gastos.filter(function(g){return g.ts>=turnoInicio;});}
function totalVentasHoy(){return ventasTurno().reduce(function(a,v){return a+v.total;},0);}
function totalGastosHoy(){return gastosTurno().reduce(function(a,g){return a+g.valor;},0);}

    if(tabActual==='admin')render();
  });
}

/* ═══════════════ LOGIN ═══════════════ */
var pinBuffer='';
var usuarioSelLogin=null;
function renderLogin(){
  var ul=document.getElementById('user-list');
  if(!ul)return;
  ul.innerHTML=usuarios.filter(function(u){
    // Mostrar siempre el admin; los demás solo si están activos (de turno)
    return u.rol==='admin' || u.activo!==false;
  }).map(function(u){
    var roleInfo=ROLES[u.rol]||{};
    return '<div class="user-card" onclick="selUsuario(\''+u.id+'\')">'
      +'<span style="font-size:24px">'+u.emoji+'</span>'
      +'<div><div style="font-weight:700;font-size:14px">'+esc(u.nombre)+'</div>'
      +'<div style="font-size:11px;color:'+(roleInfo.color||'#fff')+'">'+esc(roleInfo.label||u.rol)+'</div></div>'
      +'</div>';
  }).join('')
  +'<div style="text-align:center;color:var(--dim);font-size:11px;margin-top:10px">Solo aparecen los usuarios de turno. El administrador activa los turnos.</div>';
}
function selUsuario(id){
  usuarioSelLogin=usuarios.find(function(u){return u.id===id;});
  if(!usuarioSelLogin)return;
  if(usuarioSelLogin.rol!=='admin' && usuarioSelLogin.activo===false){alert('Este usuario está fuera de turno. Pide al administrador que lo active.');usuarioSelLogin=null;return;}
  document.getElementById('login-step-user').style.display='none';
  document.getElementById('login-step-pin').style.display='block';
  document.getElementById('pin-username').textContent=usuarioSelLogin.emoji+' '+usuarioSelLogin.nombre;
  pinBuffer='';renderPinDots();renderPinKeypad();
}
function backToUsers(){
  usuarioSelLogin=null;pinBuffer='';
  document.getElementById('login-step-user').style.display='block';
  document.getElementById('login-step-pin').style.display='none';
  document.getElementById('pin-err').textContent='';
}
function renderPinDots(){
  var c=document.getElementById('pin-dots');
  if(!c)return;
  c.innerHTML=Array.from({length:4},function(_,i){
    return '<div class="pin-dot'+(i<pinBuffer.length?' filled':'')+'"></div>';
  }).join('');
}
function renderPinKeypad(){
  var kp=document.getElementById('pin-keypad');
  if(!kp)return;
  var keys=['1','2','3','4','5','6','7','8','9','','0','DEL'];
  kp.innerHTML=keys.map(function(k){
    if(k==='')return '<div></div>';
    return '<button class="pin-btn" onclick="pinKey(\''+k+'\')">'+(k==='DEL'?'&#9003;':k)+'</button>';
  }).join('');
}
function pinKey(k){
  if(k==='DEL'){pinBuffer=pinBuffer.slice(0,-1);renderPinDots();return;}
  if(pinBuffer.length>=4)return;
  pinBuffer+=k;renderPinDots();
  if(pinBuffer.length===4)setTimeout(verificarPin,120);
}
function verificarPin(){
  if(!usuarioSelLogin){backToUsers();return;}
  if(pinBuffer===usuarioSelLogin.pin){
    usuarioActivo=usuarioSelLogin;
  window._usuarioActivoGlobal=usuarioActivo;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('header').style.display='flex';
    document.getElementById('tabs').style.display='flex';
    document.getElementById('h-emoji').textContent=usuarioActivo.emoji;
    document.getElementById('h-nombre').textContent=usuarioActivo.nombre;
    document.getElementById('h-rol').textContent=(ROLES[usuarioActivo.rol]||{}).label||usuarioActivo.rol;
    iniciarSync();
    tabActual=(ROLES[usuarioActivo.rol].tabs||['mesas'])[0];
    renderTabs();render();
  } else {
    document.getElementById('pin-err').textContent='PIN incorrecto';
    pinBuffer='';renderPinDots();
    setTimeout(function(){document.getElementById('pin-err').textContent='';},2000);
  }
}
function cerrarSesion(){
  if(getDb())['pedidos','ventas','gastos','menu','mesas','paredes','cierres','cajaHoy','combos'].forEach(fbOff);
  usuarioActivo=null;mesaActiva=null;tabActual='mesas';
  document.getElementById('header').style.display='none';
  document.getElementById('tabs').style.display='none';
  document.getElementById('content').innerHTML='';
  document.getElementById('login-screen').style.display='flex';
  pinBuffer='';usuarioSelLogin=null;
  document.getElementById('login-step-user').style.display='block';
  document.getElementById('login-step-pin').style.display='none';
  renderLogin();
}

/* ═══════════════ TABS + RENDER ═══════════════ */
function renderTabs(){
  var tabs=ROLES[usuarioActivo&&usuarioActivo.rol]&&ROLES[usuarioActivo.rol].tabs||['mesas'];
  document.getElementById('tabs').innerHTML=tabs.map(function(t){
    return '<button class="tab-btn'+(t===tabActual?' active':'')+'" onclick="setTab(\''+t+'\')">'+(TAB_LABELS[t]||t)+'</button>';
  }).join('');
}
function setTab(t){tabActual=t;mesaActiva=null;editandoProd=null;renderTabs();render();}
function render(){
  if(!usuarioActivo)return;
  updateHeader();
  var c=document.getElementById('content');
  if(tabActual==='mesas'){
    c.innerHTML=renderMesas();
    var slot=document.getElementById('panel-pedido-slot');
    if(slot&&mesaActiva){
      slot.id='panel-pedido';
      slot.style.cssText='background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:85vh';
        slot.innerHTML=renderPanelPedido();
    }
  }
  if(tabActual==='inventario')c.innerHTML=renderInventario();
  if(tabActual==='carta'){c.innerHTML=renderCarta();setTimeout(bindEmojiPicker,50);}
  if(tabActual==='combos')    c.innerHTML=renderCombos();
  if(tabActual==='caja')      c.innerHTML=renderCaja();
  if(tabActual==='gastos')    c.innerHTML=renderGastos();
  if(tabActual==='ventas')    c.innerHTML=renderVentas();
  if(tabActual==='socios')    c.innerHTML=renderSocios();
  if(tabActual==='empleados') {c.innerHTML=renderEmpleados();}
  if(tabActual==='creditos')  {c.innerHTML=renderCreditos();}
  if(tabActual==='rappi')     {c.innerHTML=renderRappi();}
  if(tabActual==='saneamiento'){c.innerHTML=renderSaneamiento();}
  if(tabActual==='cocina')    {c.innerHTML=renderCocina();bindCocinaEvents();}
  if(tabActual==='admin')     c.innerHTML=renderAdmin();
  bindMapaEvents();
  setTimeout(bindComboEvents, 50);
  setTimeout(bindAdminEvents, 50);
}
function updateHeader(){
  if(!usuarioActivo)return;
  var lib=mesas.filter(function(m){return!(pedidos[m.id]&&pedidos[m.id].length>0);}).length;
  var ocp=mesas.length-lib;
  // Cobrado en el turno
  var cobrado=totalVentasHoy();
  // Por cobrar: suma de pedidos activos en todas las mesas
  var porCobrar=mesas.reduce(function(a,m){return a+totalPedido(m.id);},0);
  var totalGen=cobrado+porCobrar;
  document.getElementById('h-libres').textContent=lib+' libres';
  document.getElementById('h-ocup').textContent=ocp+' ocup.';
  var ec=document.getElementById('h-cobrado');
  var ep=document.getElementById('h-porcobrar');
  var et=document.getElementById('h-total');
  // Los meseros NO ven los totales de dinero del bar
  var ocultarDinero=(usuarioActivo.rol==='mesero');
  if(ec){ec.textContent='✅ '+fmt(cobrado);ec.style.display=ocultarDinero?'none':'';}
  if(ep){ep.textContent='⏳ '+fmt(porCobrar);ep.style.display=ocultarDinero?'none':'';}
  if(et){et.textContent='💰 '+fmt(totalGen);et.style.display=ocultarDinero?'none':'';}
}

/* ═══════════════ MESAS ═══════════════ */
function colorMesa(id){
  if(mesaActiva&&mesaActiva.id===id)return'#38bdf8';
  return(pedidos[id]&&pedidos[id].length>0)?'#f5a623':'#22c55e';
}
function menuFormas(){
  if(!modoEdicion){alert('Activa "✏️ Editar plano" primero para agregar y mover formas.');return;}
  modal1('<div style="color:var(--accent);font-weight:900;font-size:16px;margin-bottom:14px">🔷 Agregar forma</div>'
    +'<div style="color:var(--muted);font-size:12px;margin-bottom:12px">Se agregan al plano y las arrastras a su lugar. Toca la ✕ de cada forma para borrarla.</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +'<button class="btn btn-outline" onclick="agregarForma(\'rectangulo\')">▭ Rectángulo</button>'
    +'<button class="btn btn-outline" onclick="agregarForma(\'cuadrado\')">◻ Cuadrado</button>'
    +'<button class="btn btn-outline" onclick="agregarForma(\'circulo\')">⬭ Círculo</button>'
    +'<button class="btn btn-outline" onclick="agregarFormaTexto()">🔤 Texto</button>'
    +'</div>'
    +'<button class="btn btn-outline btn-full" style="margin-top:10px" onclick="closeModal1()">Cerrar</button>');
}

function agregarForma(tipo){
  var k=zonaKey(zonaActual);
  if(!formasData[k])formasData[k]=[];
  var nueva={tipo:(tipo==='cuadrado'?'cuadrado':tipo),x:40,y:40,
    w:tipo==='circulo'?90:(tipo==='cuadrado'?80:140),
    h:tipo==='circulo'?90:(tipo==='cuadrado'?80:70),
    color:'#38bdf8',relleno:'transparent',grosor:2,r:'8px'};
  formasData[k].push(nueva);
  guardarFormas(k);closeModal1();render();
}

function agregarFormaTexto(){
  var txt=prompt('Texto a mostrar (ej: BARRA, BAÑOS, COCINA, DJ):');
  if(!txt)return;
  var k=zonaKey(zonaActual);
  if(!formasData[k])formasData[k]=[];
  formasData[k].push({tipo:'texto',texto:txt,x:50,y:50,w:140,h:36,color:'#f5d676',fontSize:18});
  guardarFormas(k);closeModal1();render();
}

function guardarFormas(k){
  var rp=ref('formas/'+k);
  if(rp)rp.set(formasData[k]); else fbSet('formas',formasData);
}

function cambiarFuenteForma(idx,delta){
  var k=zonaKey(zonaActual);
  var fo=formasData[k]&&formasData[k][idx];
  if(fo){
    fo.fontSize=Math.max(8,(fo.fontSize||16)+delta*2);
    guardarFormas(k);render();
  }
}

function borrarForma(idx){
  var k=zonaKey(zonaActual);
  if(formasData[k]&&formasData[k][idx]!==undefined){
    formasData[k].splice(idx,1);
    guardarFormas(k);render();
  }
}

function dimMesa(forma,ori,sz){
  var s=sz||mesaSize;
  if(forma==='redonda')return{w:s,h:s,r:'50%'};
  if(forma==='cuadrada')return{w:s,h:s,r:'10px'};
  return ori==='vertical'?{w:Math.round(s*0.82),h:Math.round(s*1.27),r:'10px'}:{w:Math.round(s*1.34),h:Math.round(s*0.82),r:'10px'};
}
function renderMesas(){
  var zona=ZONAS.find(function(z){return z.id===zonaActual;});
  var ms=mesas.filter(function(m){return m.zona===zonaActual;});
  var puedeEditar=usuarioActivo&&(usuarioActivo.rol==='admin'||usuarioActivo.rol==='cajero');

  var zonaBtns=ZONAS.map(function(z){
    var ocp=mesas.filter(function(m){return m.zona===z.id&&pedidos[m.id]&&pedidos[m.id].length>0;}).length;

      +(act?' style="color:'+z.color+';border-color:'+z.color+';background:'+z.color+'20;box-shadow:0 0 12px '+z.color+'44"':'')+'>'

    if(fo.tipo==='texto'){
      var fontCtrl=editable?'<span class="forma-font" data-fidx="'+fi+'" data-d="-1" style="position:absolute;bottom:-9px;left:-9px;background:#a855f7;color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;z-index:6">−</span><span class="forma-font" data-fidx="'+fi+'" data-d="1" style="position:absolute;bottom:-9px;right:-9px;background:#22c55e;color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;z-index:6">+</span>':'';

  var mesaNodes=ms.map(function(m){
    var c=colorMesa(m.id);var dim=dimMesa(m.forma,m.ori,m.size);
    var its=(pedidos[m.id]||[]).reduce(function(a,b){return a+b.qty;},0);
    return '<div class="mesa-node" id="mn-'+m.id+'"'
      +' style="left:'+m.x+'px;top:'+m.y+'px;width:'+dim.w+'px;height:'+dim.h+'px;border-radius:'+dim.r
      +';background:'+c+'18;border-color:'+c
      +';box-shadow:'+(mesaActiva&&mesaActiva.id===m.id?'0 0 20px '+c+'99':'0 0 6px '+c+'33')
      +';z-index:3"'
      +' data-mesaid="'+m.id+'">'
      +'<div style="color:#fff;font-weight:800;font-size:11px;text-align:center;line-height:1.3;padding:0 4px;word-break:break-word">'
      +(m.nombre||('Mesa '+m.num))+'</div>'
      +'<div style="color:var(--muted);font-size:10px">👤'+m.cap+'</div>'
      +(its>0?'<div style="color:'+c+';font-size:10px;font-weight:700">'+its+' itm</div>':'')
      +'</div>';

  var paredesSvg='';

    }).join('');
    if(_paredDibujando){
      lines+='<line x1="'+_paredDibujando.x1+'" y1="'+_paredDibujando.y1+'" x2="'+(_paredDibujando.x2||_paredDibujando.x1)+'" y2="'+(_paredDibujando.y2||_paredDibujando.y1)+'" stroke="'+_colorPared+'" stroke-width="'+_grosorPared+'" stroke-linecap="round" stroke-dasharray="6,4" opacity="0.7"/>';

    +Array.from({length:8},function(_,i){return'<g opacity="0.025"><line x1="'+(i*120)+'" y1="0" x2="'+(i*120)+'" y2="500" stroke="'+(zona?zona.color:'#fff')+'" stroke-width="1"/><line x1="0" y1="'+(i*70)+'" x2="1400" y2="'+(i*70)+'" stroke="'+(zona?zona.color:'#fff')+'" stroke-width="1"/></g>';}).join('')

  // VISTA LISTA: mesas agrupadas por zona, ordenadas por número

    var listaHtml=ZONAS.map(function(z){
      var msz=mesas.filter(function(m){return m.zona===z.id;}).sort(function(a,b){return (a.num||0)-(b.num||0);});
      if(!msz.length)return'';
      var cards=msz.map(function(m){

        var its=(pedidos[m.id]||[]).reduce(function(a,b){return a+b.qty;},0);
        var tot=totalPedido(m.id);
        var activa=mesaActiva&&mesaActiva.id===m.id;

// Productos más pedidos (por unidades vendidas en el histórico de ventas)
function topProductosMesa(n){
  var cnt={};
  (ventas||[]).forEach(function(v){
    var its=v.items?(Array.isArray(v.items)?v.items:Object.values(v.items)):[];
    its.forEach(function(it){
      if(it.isCustom||it.isCombo||it.isCubetazoMix)return;
      if(it.pid==null)return;
      var q=(it.qty||1)*(it.cubeta?5:1);
      cnt[it.pid]=(cnt[it.pid]||0)+q;
    });
  });
  var arr=Object.keys(cnt).map(function(pid){
    var p=menu.find(function(m){return String(m.id)===String(pid);});
    return p?{p:p,qty:cnt[pid]}:null;
  }).filter(Boolean);
  arr.sort(function(a,b){return b.qty-a.qty;});
  return arr.slice(0,n||6).map(function(x){return x.p;});
}

/* ═══════════════ MAPA EVENTS ═══════════════ */
function bindMapaEvents(){
  var el=document.getElementById('mapa-wrap');
  if(!el)return;
  var newEl=el.cloneNode(true);
  el.parentNode.replaceChild(newEl,el);
  el=newEl;

  function getCoords(e){
    var r=el.getBoundingClientRect();
    var src=e.touches?e.touches[0]:e;
    return{x:src.clientX-r.left, y:src.clientY-r.top};
  }
  function savePared(x2,y2){
    var k2=zonaKey(zonaActual);
    if(!paredesData[k2])paredesData[k2]=[];
    var dx=x2-_paredDibujando.x1, dy=y2-_paredDibujando.y1;
    if(Math.sqrt(dx*dx+dy*dy)>8){
      paredesData[k2].push({x1:_paredDibujando.x1,y1:_paredDibujando.y1,x2:x2,y2:y2,color:_colorPared,grosor:_grosorPared});
      var rp=ref('paredes/'+k2);
      if(rp)rp.set(paredesData[k2]); else fbSet('paredes',paredesData);
    }
    _paredDibujando=null;
    render();
  }
  function updatePreview(x2,y2){
    if(!_paredDibujando)return;
    _paredDibujando.x2=x2; _paredDibujando.y2=y2;
    var svgs=el.querySelectorAll('svg');
    var last=svgs[svgs.length-1];
    if(last){var ls=last.querySelectorAll('line');var ll=ls[ls.length-1];
      if(ll&&ll.getAttribute('stroke-dasharray')){ll.setAttribute('x2',x2);ll.setAttribute('y2',y2);}}
  }

  // ── TOUCH EVENTS (mobile - no delay) ──────────────────────────────────────
  el.addEventListener('touchstart',function(e){
    var fdel=e.target.closest('.forma-del');
    if(fdel&&modoEdicion){e.preventDefault();borrarForma(parseInt(fdel.getAttribute('data-fidx')));return;}
    var ffont=e.target.closest('.forma-font');
    if(ffont&&modoEdicion){e.preventDefault();cambiarFuenteForma(parseInt(ffont.getAttribute('data-fidx')),parseInt(ffont.getAttribute('data-d')));return;}
    var fres=e.target.closest('.forma-resize');
    if(fres&&modoEdicion){var tr=e.touches[0];var k=zonaKey(zonaActual);var fo0=formasData[k][parseInt(fres.getAttribute('data-fidx'))];_formaResizeState={idx:parseInt(fres.getAttribute('data-fidx')),sx:tr.clientX,sy:tr.clientY,w0:fo0.w,h0:fo0.h};e.preventDefault();return;}
    var fn=e.target.closest('.forma-node');
    if(fn&&modoEdicion){var t0=e.touches[0];_formaDragState={idx:parseInt(fn.getAttribute('data-fidx')),sx:t0.clientX,sy:t0.clientY};e.preventDefault();return;}
    var mn=e.target.closest('.mesa-node');
    if(mn&&modoEdicion){
      var t=e.touches[0];
      dragState={id:parseInt(mn.getAttribute('data-mesaid')),sx:t.clientX,sy:t.clientY};
    }
  },{passive:false});

  el.addEventListener('touchmove',function(e){
    if(_formaResizeState){
      var tr=e.touches[0];var k=zonaKey(zonaActual);var fo=formasData[k]&&formasData[k][_formaResizeState.idx];
      if(fo){fo.w=Math.max(20,_formaResizeState.w0+(tr.clientX-_formaResizeState.sx));fo.h=Math.max(20,_formaResizeState.h0+(tr.clientY-_formaResizeState.sy));
        var node=el.querySelector('.forma-node[data-fidx="'+_formaResizeState.idx+'"]');if(node){node.style.width=fo.w+'px';node.style.height=fo.h+'px';}}
      e.preventDefault();return;
    }
    if(_formaDragState){
      var t0=e.touches[0];var dx0=t0.clientX-_formaDragState.sx,dy0=t0.clientY-_formaDragState.sy;
      _formaDragState.sx=t0.clientX;_formaDragState.sy=t0.clientY;
      var k=zonaKey(zonaActual);var fo=formasData[k]&&formasData[k][_formaDragState.idx];
      if(fo){fo.x=Math.max(0,fo.x+dx0);fo.y=Math.max(0,fo.y+dy0);
        var node=el.querySelector('.forma-node[data-fidx="'+_formaDragState.idx+'"]');
        if(node){node.style.left=fo.x+'px';node.style.top=fo.y+'px';}}
      e.preventDefault();return;
    }
    if(dragState){
      var t=e.touches[0];
      var dx=t.clientX-dragState.sx, dy=t.clientY-dragState.sy;
      dragState.sx=t.clientX; dragState.sy=t.clientY;
      var m=mesas.find(function(m){return m.id===dragState.id;});
      if(m){m.x=Math.max(0,m.x+dx);m.y=Math.max(0,m.y+dy);}
      var node=document.getElementById('mn-'+dragState.id);
      if(node&&m){node.style.left=m.x+'px';node.style.top=m.y+'px';}
      e.preventDefault();
    }
  },{passive:false});

  el.addEventListener('touchend',function(e){
    if(_formaResizeState){guardarFormas(zonaKey(zonaActual));_formaResizeState=null;return;}
    if(_formaDragState){guardarFormas(zonaKey(zonaActual));_formaDragState=null;return;}
    if(dragState){fbSet('mesas',mesasObj());dragState=null;return;}
    // Mesa click (touchend = tap)
    var mn=e.target.closest('.mesa-node');
    if(mn){
      e.preventDefault();
      var mid=parseInt(mn.getAttribute('data-mesaid'));
      if(modoEdicion){abrirEditorMesa(mid);}else{clickMesa(mid);}
    }
  },{passive:false});

  // ── MOUSE EVENTS (desktop) ────────────────────────────────────────────────
  el.addEventListener('mousedown',function(e){
    if(modoParedes){
      if(e.target.closest('.mesa-node')||e.target.closest('#paredes-ui'))return;
      var c=getCoords(e);
      _paredDibujando={x1:c.x,y1:c.y,x2:c.x,y2:c.y};
      e.preventDefault();return;
    }
    var fdel=e.target.closest('.forma-del');
    if(fdel&&modoEdicion){e.preventDefault();borrarForma(parseInt(fdel.getAttribute('data-fidx')));return;}
    var ffont=e.target.closest('.forma-font');
    if(ffont&&modoEdicion){e.preventDefault();cambiarFuenteForma(parseInt(ffont.getAttribute('data-fidx')),parseInt(ffont.getAttribute('data-d')));return;}
    var fres=e.target.closest('.forma-resize');
    if(fres&&modoEdicion){var k=zonaKey(zonaActual);var fo0=formasData[k][parseInt(fres.getAttribute('data-fidx'))];_formaResizeState={idx:parseInt(fres.getAttribute('data-fidx')),sx:e.clientX,sy:e.clientY,w0:fo0.w,h0:fo0.h};e.preventDefault();return;}
    var fn=e.target.closest('.forma-node');
    if(fn&&modoEdicion){_formaDragState={idx:parseInt(fn.getAttribute('data-fidx')),sx:e.clientX,sy:e.clientY};e.preventDefault();return;}
    var mn=e.target.closest('.mesa-node');
    if(mn&&modoEdicion){
      dragState={id:parseInt(mn.getAttribute('data-mesaid')),sx:e.clientX,sy:e.clientY};
      e.preventDefault();
    }
  });
  el.addEventListener('mousemove',function(e){
    if(_formaResizeState){
      var k=zonaKey(zonaActual);var fo=formasData[k]&&formasData[k][_formaResizeState.idx];
      if(fo){fo.w=Math.max(20,_formaResizeState.w0+(e.clientX-_formaResizeState.sx));fo.h=Math.max(20,_formaResizeState.h0+(e.clientY-_formaResizeState.sy));
        var node=el.querySelector('.forma-node[data-fidx="'+_formaResizeState.idx+'"]');if(node){node.style.width=fo.w+'px';node.style.height=fo.h+'px';}}
      return;
    }
    if(_formaDragState){
      var dx0=e.clientX-_formaDragState.sx,dy0=e.clientY-_formaDragState.sy;
      _formaDragState.sx=e.clientX;_formaDragState.sy=e.clientY;
      var k=zonaKey(zonaActual);var fo=formasData[k]&&formasData[k][_formaDragState.idx];
      if(fo){fo.x=Math.max(0,fo.x+dx0);fo.y=Math.max(0,fo.y+dy0);
        var node=el.querySelector('.forma-node[data-fidx="'+_formaDragState.idx+'"]');
        if(node){node.style.left=fo.x+'px';node.style.top=fo.y+'px';}}
      return;
    }
    if(modoParedes&&_paredDibujando){var c=getCoords(e);updatePreview(c.x,c.y);return;}
    if(dragState){
      var dx=e.clientX-dragState.sx, dy=e.clientY-dragState.sy;
      dragState.sx=e.clientX; dragState.sy=e.clientY;
      var m=mesas.find(function(m){return m.id===dragState.id;});
      if(m){m.x=Math.max(0,m.x+dx);m.y=Math.max(0,m.y+dy);}
      var node=document.getElementById('mn-'+dragState.id);
      if(node&&m){node.style.left=m.x+'px';node.style.top=m.y+'px';}
    }
  });
  el.addEventListener('mouseup',function(e){
    if(_formaResizeState){guardarFormas(zonaKey(zonaActual));_formaResizeState=null;return;}
    if(_formaDragState){guardarFormas(zonaKey(zonaActual));_formaDragState=null;return;}
    if(modoParedes&&_paredDibujando){var c=getCoords(e);savePared(c.x,c.y);return;}
    if(dragState){fbSet('mesas',mesasObj());dragState=null;}
  });
  el.addEventListener('mouseleave',function(){
    if(dragState){fbSet('mesas',mesasObj());dragState=null;}
    _paredDibujando=null;
  });
  el.addEventListener('click',function(e){
    // Mesa click only - paredes handled by document listener
    if(modoParedes)return;
    var mn=e.target.closest('.mesa-node');
    if(!mn)return;
    var mid=parseInt(mn.getAttribute('data-mesaid'));
    if(modoEdicion){abrirEditorMesa(mid);}else{clickMesa(mid);}
  });
}

    +'<div style="font-weight:800;font-size:16px">Trasladar mesa</div>'

    +'<div style="margin-bottom:16px">'
      +'<div style="color:var(--muted);font-size:12px;margin-bottom:6px">Mover pedido a:</div>'

    +'</div>'
    +'<div style="background:#f5a62318;border:1px solid #f5a62333;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:#f5a623">'
      +'⚠️ Si la mesa destino ya tiene pedido, los items se fusionan.'
    +'</div>'

      +'<button class="btn btn-outline btn-full" onclick="closeModal2()">Cancelar</button>'
      +'<button class="btn btn-green btn-full" onclick="confirmarTrasladoMesa()">✅ Trasladar</button>'
    +'</div>');
}

function confirmarTrasladoMesa(){
  if(!mesaActiva)return;
  var destId=parseInt((document.getElementById('traslado-dest')||{}).value);
  if(!destId){alert('Selecciona la mesa destino.');return;}
  var destMesa=mesas.find(function(m){return m.id===destId;});
  if(!destMesa){alert('Mesa no encontrada.');return;}
  var origenId=mesaActiva.id;
  // Merge pedidos
  var pedOrigen=pedidos[origenId]||[];
  var pedDest=pedidos[destId]||[];
  // Combine: solo fusionar productos simples idénticos (mismo producto, cubeta y variante).
  // Combos, cubetazos mixtos y personalizados se pasan como líneas aparte.
  pedOrigen.forEach(function(it){
    var esEspecial=it.isCombo||it.isCubetazoMix||it.isCustom;
    var existe=esEspecial?-1:pedDest.findIndex(function(d){
      return !d.isCombo&&!d.isCubetazoMix&&!d.isCustom
        &&d.pid===it.pid&&d.cubeta===it.cubeta
        &&(d.varianteNombre||'')===(it.varianteNombre||'');
    });
    if(existe>=0) pedDest[existe].qty+=it.qty;
    else pedDest.push(it);
  });
  // Save dest pedido, clear origen
  pedidos[destId]=pedDest;
  pedidos[origenId]=[];
  var r1=ref('pedidos/'+destId); if(r1)r1.set(pedDest);
  var r2=ref('pedidos/'+origenId); if(r2)r2.set(null);
  // Trasladar también los ABONOS de la mesa origen
  if(abonosMesa[origenId]&&abonosMesa[origenId].length){
    if(!Array.isArray(abonosMesa[destId]))abonosMesa[destId]=abonosMesa[destId]?Object.values(abonosMesa[destId]):[];
    abonosMesa[destId]=abonosMesa[destId].concat(abonosMesa[origenId]);
    delete abonosMesa[origenId];
    fbSet('abonosMesa',abonosMesa);
  }
  // Trasladar el HISTORIAL de pedido y registrar el traslado
  if(!Array.isArray(pedidoLog[destId]))pedidoLog[destId]=pedidoLog[destId]?Object.values(pedidoLog[destId]):[];
  if(Array.isArray(pedidoLog[origenId])&&pedidoLog[origenId].length){
    pedidoLog[destId]=pedidoLog[destId].concat(pedidoLog[origenId]);
    delete pedidoLog[origenId];
    fbSet('pedidoLog/'+origenId,null);
  }
  fbSet('pedidoLog/'+destId,pedidoLog[destId]);
  logPedido(destId,'🔀 Traslado desde '+(mesaActiva.nombre||'Mesa '+mesaActiva.num),null);
  // Migrar marcas de cocina (entregados) de la mesa origen a la destino por ID de item
  var cambioCocina=false;
  pedOrigen.forEach(function(it){
    if(!it.uidItem)return;
    var kOld=origenId+'_'+it.uidItem;
    if(cocinaEntregados[kOld]!=null){
      var kNew=destId+'_'+it.uidItem;
      cocinaEntregados[kNew]=(cocinaEntregados[kNew]||0)+cocinaEntregados[kOld];
      delete cocinaEntregados[kOld];
      cambioCocina=true;
    }
  });
  // Limpiar cualquier marca vieja restante de la mesa origen (items sin uidItem)
  Object.keys(cocinaEntregados||{}).forEach(function(k){
    if(k.indexOf(origenId+'_')===0){delete cocinaEntregados[k];cambioCocina=true;}
  });
  if(cambioCocina)fbSet('cocinaEntregados',cocinaEntregados);
  // Switch active mesa to destination
  mesaActiva=destMesa;
  closeModal2();
  render();
  actualizarColorMesas();
  updateHeader();
}

function _aplicarNuevaCantidad(idx,nueva){
  if(!mesaActiva)return;
  var pped=pedidos[mesaActiva.id]||[];

  if(isNaN(nueva)||nueva<0){alert('Cantidad no válida.');return;}
  var dif=nueva-it.qty;
  if(dif!==0){
    var nomLog=it.isCustom?it.customNombre:(it.isCombo?it.comboNombre:(it.cubMixNombre||((menu.find(function(m){return m.id===it.pid;})||{}).nombre)||'Producto'))+(it.varianteNombre?' ('+it.varianteNombre+')':'')+(it.cubeta?' 🪣':'');
    ajustarStockItem(it,-dif);  // sube -> descuenta; baja -> devuelve
    if(nueva===0){logPedido(mesaActiva.id,'Quitado: '+nomLog,-it.qty);pped.splice(idx,1);}
    else{logPedido(mesaActiva.id,(dif>0?'+':'')+dif+' '+nomLog+' (queda en '+nueva+')',dif);it.qty=nueva;}
    var pr=ref('pedidos/'+mesaActiva.id);
    if(pr)pr.set(pped.length?pped:null);
  }
  closeModal2();
  renderSoloPedido();updateHeader();actualizarColorMesas();
}

/* ═══════════ STOCK CENTRAL: escritura atómica + KARDEX ═══════════
   Todo cambio de stock pasa por cambiarStock():
   1. Actualiza el valor local.
   2. Escribe en Firebase con TRANSACCIÓN (menu/{id}/stock) para que dos
      equipos vendiendo a la vez no se pisen el descuento.
   3. Registra el movimiento en el kardex (libro de inventario).           */
function cambiarStock(tipo,id,delta,motivo){
  delta=parseInt(delta)||0;
  if(!delta)return;
  var col=(tipo==='p')?menu:ingredientes;
  var it=col.find(function(x){return String(x.id)===String(id);});
  if(it){var a=parseInt(it.stock);if(isNaN(a))a=0;it.stock=a+delta;}
  var d=getDb();
  if(d){
    d.ref((tipo==='p'?'menu/':'ingredientes/')+id+'/stock').transaction(function(cur){
      var c=parseInt(cur);if(isNaN(c))c=0;return c+delta;
    });
  }
  logKardex(tipo,id,it?it.nombre:'',delta,motivo);
}
function logKardex(tipo,id,nombre,delta,motivo){
  fbPush('kardex',{
    ts:Date.now(),t:tipo,id:id,nombre:nombre||'',delta:delta,motivo:motivo||'',
    uid:usuarioActivo?usuarioActivo.id:'',uidNombre:usuarioActivo?usuarioActivo.nombre:''
  });
}
// Visor del kardex: carga bajo demanda los últimos movimientos
var _kardexCache=[];var _kardexFiltro='';
function abrirKardex(){
  var d=getDb();
  if(!d){alert('El kardex necesita conexión a Firebase.');return;}
  modal1('<div style="font-weight:800;font-size:16px;margin-bottom:8px">📒 Kardex de inventario</div><div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">Cargando movimientos...</div>');
  d.ref('kardex').limitToLast(400).once('value',function(s){
    var v=s.val();
    _kardexCache=v?Object.values(v).sort(function(a,b){return b.ts-a.ts;}):[];
    _kardexFiltro='';
    renderKardexModal();
  });
}
function renderKardexModal(){
  var f=(_kardexFiltro||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var lista=_kardexCache.filter(function(e){
    if(!f)return true;
    var n=(e.nombre||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    var mm=(e.motivo||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return n.indexOf(f)>=0||mm.indexOf(f)>=0;
  }).slice(0,250);
  var rows=lista.length?lista.map(function(e){
    var pos=e.delta>0;
    return'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border)">'
      +'<div style="flex:1"><span style="font-weight:700">'+(e.t==='i'?'🧂 ':'')+esc(e.nombre||('#'+e.id))+'</span>'
        +'<div style="color:var(--muted);font-size:10px;margin-top:1px">'+esc(e.motivo||'')+'</div>'
        +'<div style="color:var(--muted);font-size:10px">'+fmtFechaCorta(e.ts)+(e.uidNombre?' · '+esc(e.uidNombre):'')+'</div></div>'
      +'<span style="color:'+(pos?'#22c55e':'#ef4444')+';font-weight:900;white-space:nowrap;font-size:14px">'+(pos?'+':'')+e.delta+'</span>'
    +'</div>';
  }).join(''):'<div style="color:var(--muted);text-align:center;padding:18px;font-size:13px">Sin movimientos'+(f?' que coincidan con la búsqueda':'')+'.</div>';
  modal1('<div style="font-weight:800;font-size:16px;margin-bottom:8px">📒 Kardex de inventario</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-bottom:10px">Últimos '+_kardexCache.length+' movimientos · quién, cuánto y por qué cambió cada stock</div>'
    +'<input class="inp" id="kardex-busq" placeholder="🔍 Filtrar por producto o motivo..." value="'+esc(_kardexFiltro)+'" oninput="_kardexFiltro=this.value;renderKardexModal();setTimeout(function(){var el=document.getElementById(\'kardex-busq\');if(el){el.focus();var n=el.value.length;el.setSelectionRange(n,n);}},0);" style="margin-bottom:10px"/>'
    +'<div style="max-height:55vh;overflow-y:auto">'+rows+'</div>');
}

function ajustarStockItem(item,delta,motivo){
  // delta: cantidad a sumar al stock (negativo al agregar pedido, positivo al quitar)
  if(item.isCustom)return;
  var mot=motivo||(delta<0?'Mesa: agregado a pedido':'Mesa: devuelto de pedido');
  if(item.isCubetazoMix){
    var signoM=delta<0?-1:1;
    (item.cubMixDetalle||[]).forEach(function(dd){
      cambiarStock('p',dd.prodId,dd.cantidad*Math.abs(delta)*signoM,mot+' (cubetazo mixto)');
    });
    return;
  }
  if(item.isCombo){
    // Usar los ingredientes YA RESUELTOS guardados en el item (con las elecciones del cliente)
    var ingsCombo=item.comboIngredientes||[];
    if(!ingsCombo.length){
      var cId=item.comboId||item.pid;
      var cc=combos.find(function(x){return String(x.id)===String(cId);});
      if(cc)ingsCombo=cc.ingredientes||[];
    }
    var signoC=delta<0?-1:1;
    ingsCombo.forEach(function(ing){
      var cant=(ing.cantidad||1)*Math.abs(delta);
      if(ing.prodId!=null)cambiarStock('p',ing.prodId,cant*signoC,mot+' (combo '+(item.comboNombre||'')+')');
      if(ing.ingId!=null)cambiarStock('i',ing.ingId,cant*signoC,mot+' (combo '+(item.comboNombre||'')+')');
    });
    return;
  }
  var p=menu.find(function(m){return Number(m.id)===Number(item.pid);});
  if(!p)return;
  var c2=item.cubeta?Math.abs(delta)*5:Math.abs(delta);
  var s=delta<0?-1:1;
  cambiarStock('p',p.id,c2*s,mot+(item.cubeta?' (cubetazo)':''));
  // Receta
  if(p.receta&&p.receta.length){
    p.receta.forEach(function(ri){
      var enMenu=menu.some(function(m){return Number(m.id)===Number(ri.pid);});
      cambiarStock(enMenu?'p':'i',ri.pid,ri.cantidad*Math.abs(delta)*s,mot+' (receta de '+p.nombre+')');
    });
  }
}

// Registra un movimiento del pedido de una mesa con su hora, para el historial
function logPedido(mesaId,texto,delta){
  if(mesaId==null)return;
  if(!Array.isArray(pedidoLog[mesaId]))pedidoLog[mesaId]=[];
  pedidoLog[mesaId].push({
    ts:Date.now(),
    texto:String(texto||''),
    delta:(typeof delta==='number')?delta:null,
    uidNombre:(usuarioActivo?usuarioActivo.nombre:'')
  });
  // Guardar solo los últimos 120 movimientos por mesa
  if(pedidoLog[mesaId].length>120)pedidoLog[mesaId]=pedidoLog[mesaId].slice(-120);
  fbSet('pedidoLog/'+mesaId,pedidoLog[mesaId]);
}

function agregarItemQty(pid,cubeta,cantidad,varianteNombre,variantePrecio){
  if(!mesaActiva)return;
  var p=menu.find(function(m){return m.id===pid;});
  var id=mesaActiva.id;
  if(!pedidos[id])pedidos[id]=[];
  var idx=pedidos[id].findIndex(function(it){
    return it.pid===pid&&it.cubeta===cubeta&&(it.varianteNombre||'')===(varianteNombre||'');
  });
  if(idx>=0)pedidos[id][idx].qty+=cantidad;
  else pedidos[id].push({
    pid:pid,cubeta:cubeta,qty:cantidad,
    varianteNombre:varianteNombre||'',
    variantePrecio:variantePrecio||0,
    uidItem:'it'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36),
  });
  var r=ref('pedidos/'+id);if(r)r.set(pedidos[id]);
  // Descontar stock en tiempo real
  ajustarStockItem({pid:pid,cubeta:cubeta,isCustom:false,isCombo:false},-cantidad);
  var totMesa=totalPedido(id);
  var nItems=pedidos[id].reduce(function(a,b){return a+b.qty;},0);
  var nombreP=(p?p.emoji+' '+p.nombre:'Producto')+(varianteNombre?' ('+varianteNombre+')':'')+(cubeta?' 🪣':'');
  logPedido(id,cantidad+'× '+nombreP,cantidad);
  showToast('✅ '+cantidad+'× '+esc(nombreP)+'<br><span style="font-size:12px;opacity:.85">'+(mesaActiva.nombre||'Mesa '+mesaActiva.num)+' · '+nItems+' ítems · '+fmt(totMesa)+'</span>','#22c55e');
  renderSoloPedido();updateHeader();actualizarColorMesas();
}

function agregarItem(pid,cubeta,varianteNombre,variantePrecio){
  if(!mesaActiva)return;
  var p=menu.find(function(m){return m.id===pid;});
  // If product has variantes and no variant specified, show selector
  if(p&&p.variantes&&p.variantes.length>0&&!varianteNombre&&!cubeta){
    abrirSelectorVariante(pid);
    return;
  }
  var id=mesaActiva.id;
  if(!pedidos[id])pedidos[id]=[];
  // For variante items, match by pid + varianteNombre
  var idx=pedidos[id].findIndex(function(it){
    return it.pid===pid&&it.cubeta===cubeta&&(it.varianteNombre||'')===(varianteNombre||'');
  });
  var precio=variantePrecio||(p?p.precio:0);
  if(idx>=0)pedidos[id][idx].qty++;
  else pedidos[id].push({
    pid:pid,cubeta:cubeta,qty:1,
    varianteNombre:varianteNombre||'',
    variantePrecio:variantePrecio||0,
    uidItem:'it'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36),
  });
  var r=ref('pedidos/'+id);if(r)r.set(pedidos[id]);
  // Toast feedback
  var totMesa=totalPedido(id);

function abrirCubetazoNacional(){

  if(!cervezas.length){alert('No hay cervezas disponibles para el cubetazo nacional.'+(CUBE_NAC_SUBCAT?' (subcategoría: '+CUBE_NAC_SUBCAT+')':''));return;}

      confirmarCubetazoMixto(cantidades,CUBE_MIX_TAM,CUBE_NAC_PRECIO,'Cubetazo nacional');

function abrirCubetazoMixto(){
  if(!mesaActiva)return;

  var cervezas=menu.filter(function(m){
    var match;
    if(CUBE_MIX_SUBCAT){match=(m.subcat===CUBE_MIX_SUBCAT);}

    return match&&(ventaSinStock||m.stock>0);
  });
  if(!cervezas.length){alert('No hay cervezas disponibles para el cubetazo mixto.'+(CUBE_MIX_SUBCAT?' (subcategoría: '+CUBE_MIX_SUBCAT+')':''));return;}
  // Precio por unidad en cubeta = cubeta/5 de cada cerveza

function confirmarCubetazoMixto(cantidades,tam,precioFijo,nombreCub){
  if(!mesaActiva)return;
  var id=mesaActiva.id;
  if(!pedidos[id])pedidos[id]=[];
  var precioBalde=(precioFijo!=null)?precioFijo:CUBE_MIX_PRECIO;
  var etiqueta=nombreCub||'Cubetazo mixto';
  // Construir lista de cervezas elegidas
  var detalle=[];
  Object.keys(cantidades).forEach(function(pid){
    var q=cantidades[pid];if(!q)return;
    var p=menu.find(function(m){return Number(m.id)===Number(pid);});
    if(!p)return;
    var precioUnidad=Math.round(precioBalde/tam);
    detalle.push({prodId:p.id,nombre:p.nombre,emoji:p.emoji,cantidad:q,precioUnidad:precioUnidad});
  });
  var newItem={
    pid:'cubmix_'+Date.now(),
    uidItem:'it'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36),
    cubeta:false,qty:1,isCubetazoMix:true,
    cubMixDetalle:detalle,cubMixPrecio:precioBalde,cubMixTam:tam,cubMixNombre:etiqueta
  };
  pedidos[id].push(newItem);
  var r=ref('pedidos/'+id);if(r)r.set(pedidos[id]);
  // Descontar stock de cada cerveza (atómico + kardex)
  detalle.forEach(function(dd){
    cambiarStock('p',dd.prodId,-dd.cantidad,'Mesa: '+etiqueta);
  });
  var resumen=detalle.map(function(dd){return dd.cantidad+'× '+dd.nombre;}).join(', ');
  logPedido(id,'🪣 '+etiqueta+' ('+resumen+')',1);
  showToast('🪣 '+esc(etiqueta)+'<br><span style="font-size:12px;opacity:.85">'+esc(resumen)+' · '+fmt(precioBalde)+'</span>','#22c55e');
  renderSoloPedido();updateHeader();actualizarColorMesas();
}

function renderDistribModal(){

  var filas=d.productos.map(function(p){
    var q=d.cantidades[p.id]||0;
    var maxStock=parseInt(p.stock);if(isNaN(maxStock))maxStock=0;
    var puedeMas=(restante>0)&&(q<maxStock);
    return'<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">'

      +'<button data-act="distrib-minus" data-pid="'+p.id+'" '+(q<=0?'disabled':'')+' style="background:#ef444418;color:#ef4444;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1;opacity:'+(q<=0?'.3':'1')+'">−</button>'
      +'<span style="color:#fff;font-weight:800;min-width:24px;text-align:center;font-size:16px">'+q+'</span>'
      +'<button data-act="distrib-plus" data-pid="'+p.id+'" '+(puedeMas?'':'disabled')+' style="background:#22c55e18;color:#22c55e;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1;opacity:'+(puedeMas?'1':'.3')+'">+</button>'
    +'</div>';
  }).join('');

  modal2('<div style="text-align:center;margin-bottom:12px">'
    +'<div style="font-size:28px">'+d.emoji+'</div>'
    +'<div style="font-weight:800;font-size:16px">'+esc(d.titulo)+'</div>'
    +'<div style="color:'+(completo?'#22c55e':'var(--accent)')+';font-weight:700;font-size:14px;margin-top:4px">'+sumaActual+' / '+d.total+(completo?' ✓':' · faltan '+restante)+'</div>'

    +'<div style="max-height:300px;overflow-y:auto">'+filas+'</div>'
    +'<button onclick="confirmarDistribucion()" '+(completo?'':'disabled')+' style="width:100%;margin-top:14px;background:'+(completo?'#22c55e':'var(--card)')+';color:'+(completo?'#fff':'var(--muted)')+';border:none;border-radius:10px;padding:12px;font-weight:800;font-size:14px;cursor:'+(completo?'pointer':'not-allowed')+'">'+(completo?'✓ Confirmar':'Selecciona '+d.total+' en total')+'</button>');

function confirmarDistribucion(){
  var d=window._distrib;if(!d)return;

function abrirCobro(){

  // Pre-cargar abonos ya recibidos por forma de pago
  var _absMesa=(abonosMesa[mesaActiva.id]||[]);
  _absMesa.forEach(function(ab){window._pagosParciales[ab.fp]=(window._pagosParciales[ab.fp]||0)+ab.monto;});
  window._totalCobro=total;

  function renderCobroModal(){
    var pagado=Object.values(window._pagosParciales).reduce(function(a,v){return a+(v||0);},0);
    var pendiente=total-pagado;
    var completo=Math.round(pendiente)<=0;

    var resumen=ped.map(function(it){
      var nombre,pr;
      if(it.isCustom){nombre='✏️ '+esc(it.customNombre);pr=it.customPrecio||0;}
      else if(it.isCombo){nombre='🎁 '+esc(it.comboNombre);pr=it.comboPrecio||0;}
      else{var p=menu.find(function(m){return m.id===it.pid;});nombre=(it.cubeta?'🪣 ':'')+esc((p&&p.nombre)||'?');pr=it.cubeta?(p&&p.cubeta||((p&&p.precio||0)*5)):((p&&p.precio)||0);}
      return'<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0">'
        +'<span>'+nombre+' ×'+it.qty+'</span>'
        +'<span style="color:var(--gold)">'+fmt(pr*it.qty)+'</span></div>';
    }).join('');

    var fpRows=FPAGO.map(function(f){
      var val=window._pagosParciales[f.id]||0;
      var fid=f.id;
      return'<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)" data-fpid="'+fid+'">'
        +'<span style="font-size:20px;width:28px">'+f.emoji+'</span>'
        +'<span style="color:'+f.color+';font-weight:700;font-size:13px;flex:1">'+f.label+'</span>'
        +'<div style="display:flex;align-items:center;gap:5px">'
        +'<button data-act="minus" data-fpid="'+fid+'" style="background:var(--dim);color:var(--muted);border:none;border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:13px;font-weight:700">−</button>'
        +'<input type="text" inputmode="numeric" id="fp-inp-'+fid+'" class="money" value="'+moneyFmt(val||'')+'" placeholder="0"'
        +' data-fpid="'+fid+'" data-act="input"'
        +' style="width:90px;background:var(--bg);border:1px solid '+(val>0?f.color:'var(--border)')+';border-radius:7px;padding:5px 8px;color:var(--text);font-size:13px;font-weight:700;text-align:right;outline:none"/>'
        +'<button data-act="plus" data-fpid="'+fid+'" style="background:var(--dim);color:var(--muted);border:none;border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:13px;font-weight:700">+</button>'
        +'<button data-act="todo" data-fpid="'+fid+'" style="background:'+f.color+'22;color:'+f.color+';border:1px solid '+f.color+'44;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:11px;font-weight:700">Todo</button>'
        +'</div></div>';
    }).join('');

    var pagosResumen=Object.entries(window._pagosParciales).filter(function(kv){return kv[1]>0;}).map(function(kv){
      var f=FPAGO.find(function(x){return x.id===kv[0];});
      return'<span style="background:'+(f?f.color:'#fff')+'22;color:'+(f?f.color:'#fff')+';border:1px solid '+(f?f.color:'#fff')+'33;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700">'+(f?f.emoji+' ':'')+fmt(kv[1])+'</span>';
    }).join(' ');

    return'<div style="text-align:center;margin-bottom:14px">'
      +'<div style="font-size:22px">🛸</div>'
      +'<div style="color:var(--muted);font-size:12px;margin-top:3px">'+(zona?zona.label:'')+' · '+esc(mesaActiva.nombre||'Mesa '+mesaActiva.num)+'</div>'
      +'<div style="font-size:26px;font-weight:900;margin-top:4px">'+fmt(total)+'</div>'
      +'<div style="color:var(--muted);font-size:12px">Total a cobrar</div></div>'

        +'<span style="color:'+(completo?'#22c55e':'#f5a623')+';font-weight:700">'+(completo?'✓ Completo':'Pendiente: '+fmt(pendiente))+'</span>'
      +'</div>'
      +(pagosResumen?'<div style="margin-bottom:10px;display:flex;gap:5px;flex-wrap:wrap">'+pagosResumen+'</div>':'')

      if(act==='plus') ajustarPago(fid,1000);
      if(act==='todo') llenarConPendiente(fid);
    });

      if(e.target.getAttribute('data-act')==='input'){
        setPago(e.target.getAttribute('data-fpid'),e.target.value);
      }
    });

}

function setPago(fpId, rawVal){
  var val=parseInt(String(rawVal).replace(/[^0-9]/g,''))||0;
  if(val<0)val=0;
  window._pagosParciales[fpId]=val;
  var el=document.getElementById('fp-inp-'+fpId);
  var f=FPAGO.find(function(x){return x.id===fpId;});
  if(el&&f)el.style.borderColor=val>0?f.color:'var(--border)';
  actualizarBarraCobro();
}

function ajustarPago(fpId, delta){
  var cur=window._pagosParciales[fpId]||0;
  var nuevo=Math.max(0,cur+delta);
  window._pagosParciales[fpId]=nuevo;
  var el=document.getElementById('fp-inp-'+fpId);
  if(el){el.value=nuevo?moneyFmt(nuevo):'';var f=FPAGO.find(function(x){return x.id===fpId;});if(f)el.style.borderColor=nuevo>0?f.color:'var(--border)';}
  actualizarBarraCobro();
}

function llenarConPendiente(fpId){
  var pagado=Object.entries(window._pagosParciales).filter(function(kv){return kv[0]!==fpId;}).reduce(function(a,kv){return a+(kv[1]||0);},0);
  var pendiente=Math.max(0,window._totalCobro-pagado);
  window._pagosParciales[fpId]=pendiente;
  var el=document.getElementById('fp-inp-'+fpId);

function actualizarBarraCobro(){
  var pagado=Object.values(window._pagosParciales).reduce(function(a,v){return a+(v||0);},0);

  var pendiente=total-pagado;
  var completo=Math.round(pendiente)<=0;
  var pct=Math.min(100,Math.round(pagado/total*100));

  // Update progress bar
  var bar=document.querySelector('#modal1 .btn-full[onclick="confirmarCobro()"]');
  if(bar)bar.disabled=!completo;

  var barra=document.querySelector('#modal1 div[style*="height:6px"]>div');
  if(barra){barra.style.width=pct+'%';barra.style.background=completo?'#22c55e':'#f5a623';}

  // Update pagado/pendiente text
  var spans=document.querySelectorAll('#modal1 span[style*="font-weight:700"]');
  if(spans.length>=2){
    spans[0].textContent='Pagado: '+fmt(pagado);
    spans[1].style.color=completo?'#22c55e':'#f5a623';

}

function confirmarDividir(){
  if(!mesaActiva)return;
  var ped=pedidos[mesaActiva.id]||[];
  var sel=window._divSel||{};
  var fp=(document.getElementById('div-fp')||{}).value||'efectivo';
  // Construir items a cobrar
  var itemsPagar=[];var total=0;
  Object.keys(sel).forEach(function(idx){
    var q=sel[idx];if(!q)return;
    var it=ped[idx];if(!it)return;
    var copia=JSON.parse(JSON.stringify(it));copia.qty=q;
    itemsPagar.push(copia);
    total+=precioItem(it)*q;
  });
  if(!itemsPagar.length||total<=0){alert('Selecciona al menos un producto.');return;}
  var f=FPAGO.find(function(x){return x.id===fp;});
  // ── COMPROBANTE para pago digital en cuenta dividida ──
  if(fp!=='efectivo'&&fotoCompCfg.on&&total>=(fotoCompCfg.min||0)&&!window._compTemp){
    abrirCapturaComprobante((f?f.emoji+' '+f.label:fp)+' '+fmt(total),total,function(){confirmarDividir();});
    return;
  }
  // Registrar la venta de esta parte
  var venta={
    mesa:(mesaActiva.nombre||('Mesa '+mesaActiva.num))+' (dividida)',zona:mesaActiva.zona,
    ts:Date.now(),total:total,
    items:itemsPagar,
    fp:fp,fpLabel:(f?f.emoji+' '+f.label:fp),
    pagos:[{fp:fp,label:(f?f.label:fp),monto:total}],
    esDividida:true,
    uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre
  };
  if(window._compTemp){
    var compIdD='comp_'+Date.now();
    venta.compId=compIdD;
    venta.refPago=window._compTemp.ref4||'';
    fbSet('comprobantes/'+compIdD,{ts:Date.now(),img:window._compTemp.img,mesa:venta.mesa,monto:total,fp:(f?f.emoji+' '+f.label:fp),ref4:window._compTemp.ref4||'',uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre});
    window._compTemp=null;
  }
  fbPush('ventas',venta);
  // Restar las cantidades pagadas del pedido
  Object.keys(sel).sort(function(a,b){return b-a;}).forEach(function(idx){
    var q=sel[idx];if(!q)return;
    var it=ped[idx];if(!it)return;
    it.qty-=q;
    if(it.qty<=0)ped.splice(idx,1);
  });
  var quedan=ped.length;
  var r=ref('pedidos/'+mesaActiva.id);if(r)r.set(quedan?ped:null);
  closeModal1();
  showToast('🧾 Parte cobrada<br><span style="font-size:12px;opacity:.85">'+fmt(total)+(f?' · '+f.label:'')+(quedan?' · quedan items en la mesa':' · mesa saldada')+'</span>','#38bdf8');
  if(!quedan){
    // mesa quedó vacía
    if(abonosMesa[mesaActiva.id]){delete abonosMesa[mesaActiva.id];fbSet('abonosMesa',abonosMesa);}
    if(pedidoLog[mesaActiva.id]){delete pedidoLog[mesaActiva.id];fbSet('pedidoLog/'+mesaActiva.id,null);}
    limpiarCocinaMesa(mesaActiva.id);
    mesaActiva=null;
  }
  render();
}

function procesarFotoComprobante(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      // Comprimir: máx 900px de lado, JPEG calidad 0.55 (~60-150 KB)
      var maxDim=900;var w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){var esc2=maxDim/Math.max(w,h);w=Math.round(w*esc2);h=Math.round(h*esc2);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      window._compTempImg=cv.toDataURL('image/jpeg',0.55);
      var prev=document.getElementById('comp-preview');
      if(prev)prev.innerHTML='<div style="position:relative">'
        +'<img src="'+window._compTempImg+'" style="width:100%;max-height:38vh;object-fit:contain;border-radius:12px;border:2px solid #22c55e66;background:#000"/>'
        +'<button onclick="document.getElementById(\'comp-file\').click()" style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;border:1px solid #fff3;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer">🔄 Repetir</button>'
        +'</div>';
      var ok=document.getElementById('comp-ok');
      if(ok){ok.disabled=false;ok.style.opacity='1';}
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function cancelarCapturaComprobante(){
  window._compTempImg=null;window._compTemp=null;window._compCont=null;
  closeModal2();
}
function confirmarCapturaComprobante(){
  if(!window._compTempImg){alert('Toma la foto del comprobante primero.');return;}

// Purga comprobantes con más de 45 días (se ejecuta en el cierre del día)
function purgarComprobantes(){
  var d=getDb();if(!d)return;
  var limite=Date.now()-45*24*3600*1000;
  d.ref('comprobantes').once('value',function(s){
    var v=s.val();if(!v)return;
    Object.keys(v).forEach(function(k){
      if((v[k].ts||0)<limite)d.ref('comprobantes/'+k).remove();
    });
  });
}

function confirmarCobro(){
  if(!mesaActiva)return;
  var pagos=window._pagosParciales||{};
  var pagado=Object.values(pagos).reduce(function(a,v){return a+(v||0);},0);
  var total=totalPedido(mesaActiva.id);
  // Apply discount if exists
  var descMesa=descuentos[mesaActiva.id];
  if(descMesa&&descMesa.pct) total=Math.round(total*(1-descMesa.pct/100));
  if(Math.round(pagado)<Math.round(total)){alert('El total pagado ($'+total.toLocaleString('es-CO')+') no cubre el valor. Verifica los montos.');return;}

  // ── COMPROBANTE: si hay pagos digitales, exigir foto antes de registrar ──
  var totalDig=0;var fpDigLabels=[];
  Object.keys(pagos).forEach(function(fp){
    if(fp!=='efectivo'&&pagos[fp]>0){
      totalDig+=pagos[fp];
      var fD=FPAGO.find(function(x){return x.id===fp;});
      fpDigLabels.push((fD?fD.emoji+' '+fD.label:fp)+' '+fmt(pagos[fp]));
    }
  });
  if(fotoCompCfg.on&&totalDig>0&&totalDig>=(fotoCompCfg.min||0)&&!window._compTemp){
    abrirCapturaComprobante(fpDigLabels.join(' + '),totalDig,function(){confirmarCobro();});
    return;
  }

  var mesa=mesaActiva;
  var ped=pedidos[mesa.id]||[];

  // Build venta with multiple payments
  var pagosList=Object.entries(pagos).filter(function(kv){return kv[1]>0;}).map(function(kv){
    var f=FPAGO.find(function(x){return x.id===kv[0];});
    return{fp:kv[0],label:(f?f.label:''),monto:kv[1]};
  });
  var fpPrincipal=pagosList.length===1?pagosList[0].fp:'mixto';
  var fpLabel=pagosList.length===1?pagosList[0].label:pagosList.map(function(p){return p.label+' '+fmt(p.monto);}).join(' + ');

  // Detectar si algún producto se vendió sin stock (quedó en negativo)
  var sinStock=ped.some(function(it){
    if(it.isCustom||it.isCombo||it.isCubetazoMix)return false;
    var p=menu.find(function(m){return m.id===it.pid;});
    return p&&(parseInt(p.stock)||0)<0;
  });
  var venta={
    mesa:mesa.nombre||('Mesa '+mesa.num),zona:mesa.zona,
    ts:Date.now(),total:total,
    items:JSON.parse(JSON.stringify(ped)),
    fp:fpPrincipal,fpLabel:fpLabel,
    pagos:pagosList,
    sinStock:sinStock,
    uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre
  };
  // Amarrar el comprobante fotográfico si se capturó
  if(window._compTemp){
    var compId='comp_'+Date.now();
    venta.compId=compId;
    venta.refPago=window._compTemp.ref4||'';
    fbSet('comprobantes/'+compId,{ts:Date.now(),img:window._compTemp.img,mesa:venta.mesa,monto:totalDig,fp:fpDigLabels.join(' + '),ref4:window._compTemp.ref4||'',uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre});
    window._compTemp=null;
  }
  fbPush('ventas',venta);
  // Stock ya fue descontado al agregar a la mesa (con escritura atómica) — no se toca aquí
  // Guardar el último ticket por si el cliente quiere imprimirlo
  window._ultimoTicket={mesa:mesa,ped:JSON.parse(JSON.stringify(ped)),total:total,pagos:pagosList,ts:Date.now()};

  var r=ref('pedidos/'+mesa.id);if(r)r.set(null);
  // Limpiar abonos de la mesa
  if(abonosMesa[mesa.id]){delete abonosMesa[mesa.id];fbSet('abonosMesa',abonosMesa);}
  // Limpiar historial de pedido de la mesa (arranca limpio para el próximo cliente)
  if(pedidoLog[mesa.id]){delete pedidoLog[mesa.id];fbSet('pedidoLog/'+mesa.id,null);}
  // Limpiar marcas de cocina de esta mesa
  limpiarCocinaMesa(mesa.id);
  mesaActiva=null;closeModal1();render();
  // Aviso con opción de imprimir recibo
  var nombreMesa=mesa.nombre||('Mesa '+mesa.num);
  showToast('✅ Cobro registrado · '+fmt(total)+'<br><button onclick="reimprimirUltimoTicket()" style="margin-top:6px;background:#fff;color:#1a1a22;border:none;border-radius:7px;padding:6px 14px;font-weight:800;font-size:12px;cursor:pointer">🖨️ Imprimir recibo</button>','#22c55e',5000);
}

function enviarAImpresora(mesa,ped,total,pagosList){
  // Construir items en formato simple para la estación
  var items=(ped||[]).map(function(it){
    var nombre,pr;
    if(it.isCustom){nombre=it.customNombre||'Personalizado';pr=it.customPrecio||0;}
    else if(it.isCombo){nombre=(it.comboNombre||'Combo');pr=it.comboPrecio||0;}
    else if(it.isCubetazoMix){nombre=(it.cubMixNombre||'Cubetazo mixto');pr=it.cubMixPrecio||0;}
    else{
      var p=menu.find(function(m){return m.id==it.pid;});
      nombre=(it.cubeta?'[Cubetazo] ':'')+((p&&p.nombre)||it.nombre||'?')+(it.varianteNombre?' ('+it.varianteNombre+')':'')+(it.cubeta?' x5':'');
      pr=precioItem(it);
    }
    return {nombre:nombre,qty:it.qty||1,total:pr*(it.qty||1)};
  });
  var pagos=Array.isArray(pagosList)?pagosList:(function(){
    var f=FPAGO.find(function(x){return x.id===pagosList;});
    return [{label:(f?f.label:pagosList),monto:total}];
  })();
  var trabajo={
    mesa:(mesa.nombre||('Mesa '+(mesa.num||''))),
    items:items,total:total,pagos:pagos,ts:Date.now()
  };
  var r=ref('impresion');
  if(r){r.push(trabajo);showToast('🖨️ Recibo enviado a la impresora','#38bdf8');}
  else{alert('No hay conexión para enviar a la impresora.');}
}

function imprimirRecibo(mesa,ped,total,pagosList){
  // Punto único: según el modo, manda a la estación o abre ventana local
  if(MODO_IMPRESION==='estacion'){enviarAImpresora(mesa,ped,total,pagosList);}
  else{imprimirTicket(mesa,ped,total,pagosList);}

function abrirProveedores(){
  function gastosProv(pv){
    return gastos.filter(function(g){return g.provId===pv.id||(g.provNombre&&g.provNombre===pv.nombre);});
  }
  function ingresosProv(pv){
    return ingresosInv.filter(function(r){return r.proveedor===pv.nombre;});
  }
  var rows=proveedores.length?proveedores.map(function(pv){
    var gs=gastosProv(pv);
    var totalPagado=gs.reduce(function(s,g){return s+(g.valor||0);},0);
    var ents=ingresosProv(pv);
    var totalFacturado=ents.reduce(function(s,r){return s+(parseInt(r.valorFactura)||0);},0);
    var saldo=totalFacturado-totalPagado;

function confirmarPagoProveedor(provId){
  var pv=proveedores.find(function(p){return p.id===provId;});
  if(!pv)return;
  var concepto=((document.getElementById('pp-concepto')||{}).value||'').trim();
  var valor=moneyVal('pp-valor')||0;
  var cat=(document.getElementById('pp-cat')||{}).value||'Mercancía';
  var fp=(document.getElementById('pp-fp')||{}).value||'efectivo';
  if(!concepto){alert('Escribe el concepto.');return;}
  if(valor<=0){alert('Escribe el valor.');return;}
  var g={id:'g'+Date.now(),ts:Date.now(),concepto:concepto,categoria:cat,valor:valor,notas:'Pago a proveedor',fp:fp,provId:provId,provNombre:pv.nombre,uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre};
  fbPush('gastos',g);
  // Calcular saldo restante después de este pago
  var pagadoPrev=gastos.filter(function(x){return x.provId===pv.id||(x.provNombre&&x.provNombre===pv.nombre);}).reduce(function(s,x){return s+(x.valor||0);},0);
  var facturado=ingresosInv.filter(function(r){return r.proveedor===pv.nombre;}).reduce(function(s,r){return s+(parseInt(r.valorFactura)||0);},0);
  var saldoRest=facturado-(pagadoPrev+valor);

  abrirProveedores();

function guardarIngresoInventario(){
  var prodVal=(document.getElementById('ing-prod')||{}).value||'';
  var cant=parseInt((document.getElementById('ing-cant')||{}).value)||0;
  var provId=(document.getElementById('ing-prov')||{}).value||'';
  var factura=((document.getElementById('ing-factura')||{}).value||'').trim();
  var valorFactura=moneyVal('ing-valor')||0;
  var fecha=(document.getElementById('ing-fecha')||{}).value||new Date().toISOString().slice(0,10);
  if(!prodVal){alert('Selecciona el producto.');return;}
  if(cant<=0){alert('La cantidad debe ser mayor a 0.');return;}
  if(!provId){alert('Selecciona el proveedor.');return;}
  var prov=proveedores.find(function(p){return p.id===provId;});
  var tipo=prodVal.charAt(0); var pid=prodVal.slice(2);
  var prodNombre='';
  var motivoIng='Ingreso inventario · '+(prov?prov.nombre:'')+(factura?' · Fact '+factura:'');
  if(tipo==='p'){
    var p=menu.find(function(m){return String(m.id)===String(pid);});
    if(p){prodNombre=p.nombre;cambiarStock('p',p.id,cant,motivoIng);}
  } else {
    var ing=ingredientes.find(function(m){return String(m.id)===String(pid);});
    if(ing){prodNombre=ing.nombre;cambiarStock('i',ing.id,cant,motivoIng);}
  }
  // Registrar el ingreso
  var registro={id:'ing_'+Date.now(),ts:Date.now(),fecha:fecha,prodTipo:tipo,prodId:pid,prodNombre:prodNombre,cantidad:cant,proveedor:prov?prov.nombre:'',factura:factura,valorFactura:valorFactura,uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre};
  fbPush('ingresosInv',registro);
  closeModal1();
  showToast('➕ Ingreso registrado<br><span style="font-size:12px;opacity:.85">'+cant+'× '+esc(prodNombre)+' · '+esc(prov?prov.nombre:'')+(valorFactura>0?' · '+fmt(valorFactura):'')+'</span>','#22c55e');
  render();
}

    +(esAdmin?'<button onclick="exportarInventarioExcel()" style="margin-left:auto;background:#22c55e18;color:#22c55e;border:1px solid #22c55e33;border-radius:8px;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer">📥 Exportar Excel</button>':'')

    +['carta','ingredientes'].map(function(t){
      var sel=invTab===t;
      var label=t==='carta'?'🍺 Productos carta':'🧂 Ingredientes cocina';

    }).join('')+'</div>';

  if(invTab==='ingredientes'){
    // ── INGREDIENTES section ──────────────────────────────────────────────────
    var ingRows=ingredientes.map(function(ing){
      return'<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">'
        +'<span style="font-size:22px">🧂</span>'
