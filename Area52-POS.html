          +'<div style="font-weight:700;font-size:13px">'+esc(ing.nombre)+'</div>'
          +'<div style="color:var(--muted);font-size:11px">'+ing.und+'</div>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:6px">'
          +(esCajero
            ?'<button data-act="ing-minus" data-iid="'+ing.id+'" style="background:#ef444418;color:#ef4444;border:none;border-radius:6px;width:28px;height:28px;font-size:16px;cursor:pointer">−</button>'
            :'')
          +'<button data-act="ing-edit-stock" data-iid="'+ing.id+'" style="font-weight:800;font-size:15px;min-width:36px;text-align:center;color:'+(ing.stock<=5?'#ef4444':ing.stock<=20?'#f5a623':'var(--text)')+';background:none;border:none;cursor:'+(esCajero?'pointer':'default')+';padding:0">'+ing.stock+'</button>'
          +(esCajero
            ?'<button data-act="ing-plus" data-iid="'+ing.id+'" style="background:#22c55e18;color:#22c55e;border:none;border-radius:6px;width:28px;height:28px;font-size:16px;cursor:pointer">+</button>'
            :'')
          +(esCajero
            ?'<button data-act="ing-merc" data-iid="'+ing.id+'" style="background:#38bdf818;color:#38bdf8;border:1px solid #38bdf833;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer">📦 Llegó</button>'
            :'')
          +(esCajero
            ?'<button data-act="ing-edit" data-iid="'+ing.id+'" style="background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer">✏️</button>'
            :'')
        +'</div>'
        +'</div>';
    }).join('')||'<div style="color:var(--muted);text-align:center;padding:20px">Sin ingredientes registrados</div>';

    var addIngBtn=esCajero
      ?'<button class="btn btn-green btn-full mb12" onclick="abrirNuevoIngrediente()">+ Nuevo ingrediente</button>'
      :'';

    return alertHtml+tabPills+addIngBtn
      +'<div class="card">'+ingRows+'</div>';
  }

  // ── CARTA section - grouped by category ───────────────────────────────────
  var cats=menu.reduce(function(a,m){if(a.indexOf(m.cat)<0)a.push(m.cat);return a;},[]).sort();
  function _invRow(p){
    var canEdit=esAdmin;
    return'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'
      +'<span style="font-size:20px">'+p.emoji+'</span>'
      +'<div style="flex:1">'
        +'<div style="font-weight:700;font-size:13px">'+esc(p.nombre)+'</div>'
        +'<div style="color:var(--accent);font-size:11px">'+fmt(p.precio)+(p.esCerveza&&p.cubeta?' · Cubetazo: '+fmt(p.cubeta):'')+(p.esComida?' · 👨‍🍳':'')+'</div>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px">'
        +(canEdit
          ?'<button data-act="inv-minus" data-pid="'+p.id+'" style="background:#ef444418;color:#ef4444;border:none;border-radius:6px;width:28px;height:28px;font-size:16px;cursor:pointer">−</button>'
          :'')
        +'<button data-act="inv-edit-stock" data-pid="'+p.id+'" style="font-weight:800;font-size:15px;min-width:36px;text-align:center;color:'+(p.stock<0?'#ef4444':p.stock===0?'#ef4444':p.stock<=5?'#f5a623':'var(--text)')+';font-weight:'+(p.stock<0?'900':'800')+';background:'+(p.stock<0?'#ef444415':'none')+';border:none;cursor:'+(canEdit?'pointer':'default')+';padding:2px 6px;border-radius:4px">'+(canEdit?'<u>':'')+p.stock+(canEdit?'</u>':'')+'</button>'
        +(canEdit
          ?'<button data-act="inv-plus" data-pid="'+p.id+'" style="background:#22c55e18;color:#22c55e;border:none;border-radius:6px;width:28px;height:28px;font-size:16px;cursor:pointer">+</button>'
          :'')
        +(canEdit?'<button data-act="inv-merc" data-pid="'+p.id+'" style="background:#38bdf818;color:#38bdf8;border:1px solid #38bdf833;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer">📦 Llegó</button>':'')
      +'</div>'
      +'</div>';
  }
  var catSections=cats.map(function(cat){
    var prods=menu.filter(function(m){return m.cat===cat;});
    // Agrupar por subcategoría
    var subs=prods.reduce(function(a,m){var s=m.subcat||'';if(a.indexOf(s)<0)a.push(s);return a;},[]).sort();
    var rows;
    if(subs.length<=1){
      rows=prods.map(_invRow).join('');
    } else {
      rows=subs.map(function(s){
        var lista=prods.filter(function(m){return (m.subcat||'')===s;});
        var tot=lista.reduce(function(a,p){return a+(parseInt(p.stock)||0);},0);
        return (s?'<div style="display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:8px 0 2px;padding-top:6px;border-top:1px solid var(--border)"><span>'+esc(s)+'</span><span>'+lista.length+' · '+tot+' und</span></div>':'')
          +lista.map(_invRow).join('');
      }).join('');
    }
    var catKey='inv_'+cat;
    var abierto=(catKey in _mesesOpen)?_mesesOpen[catKey]:false;  // cerradas por defecto
    var totalCat=prods.reduce(function(a,p){return a+(parseInt(p.stock)||0);},0);
    return'<div class="card mb8">'
      +'<button data-act="toggle-mes" data-mes="'+catKey+'" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;cursor:pointer;padding:0">'
        +'<span style="color:var(--accent);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase">'+(abierto?'▼':'▶')+' '+cat+'</span>'
        +'<span style="color:var(--muted);font-size:11px">'+prods.length+' prod · '+totalCat+' und</span>'
      +'</button>'
      +(abierto?'<div style="margin-top:8px">'+rows+'</div>':'')
      +'</div>';
  }).join('');

  return alertHtml+tabPills+catSections;
}

function toggleCorr(id){
  var p=document.getElementById('corr-'+id),b=document.getElementById('btn-corr-'+id);if(!p)return;
  var vis=p.style.display!=='none';
  p.style.display=vis?'none':'block';
  if(b){b.style.borderColor=vis?'var(--border)':'#ef4444';b.style.color=vis?'var(--muted)':'#ef4444';}
}
function sumarStock(id){
  var el=document.getElementById('ent-'+id);if(!el)return;
  var cant=parseInt(el.value);
  if(isNaN(cant)||cant<=0){alert('Ingresa una cantidad mayor a cero.');return;}
  var p=menu.find(function(m){return m.id===id;});
  if(p){p.stock+=cant;el.value='';var mo={};menu.forEach(function(m){mo[m.id]=m;});fbSet('menu',mo);render();}
}
function sumarStockRapido(id,cant){
  var p=menu.find(function(m){return m.id===id;});
  if(p){p.stock+=cant;var mo={};menu.forEach(function(m){mo[m.id]=m;});fbSet('menu',mo);render();}
}
function guardarStock(id){
  var el=document.getElementById('inv-'+id);if(!el)return;
  var v=parseInt(el.value);
  if(isNaN(v)||v<0){alert('Número inválido.');return;}
  if(!confirm('¿Fijar el stock en '+v+' unidades? Úsalo solo para corregir errores.'))return;
  var p=menu.find(function(m){return m.id===id;});
  if(p){p.stock=v;var mo={};menu.forEach(function(m){mo[m.id]=m;});fbSet('menu',mo);render();}
}

/* ═══════════════ CARTA ═══════════════ */
function _clasificarProducto(nombre,catActual){
  var n=(nombre||'').toLowerCase();
  var ca=(catActual||'').toLowerCase();
  function has(){for(var i=0;i<arguments.length;i++){if(n.indexOf(arguments[i])>=0)return true;}return false;}
  function word(){for(var i=0;i<arguments.length;i++){if(new RegExp('(^|[^a-zñáéíóú])'+arguments[i]+'([^a-zñáéíóú]|$)').test(n))return true;}return false;}
  function tamLicor(){if(has('media','1/2','mitad','375','355'))return'Media';return'Litro';}

  // ── COMIDA (va a cocina) ──
  if(has('hamburgues','burger'))         return{cat:'🍽️ Cocina',subcat:'Hamburguesas',comida:true};
  if(has('perro','hot dog','hotdog'))    return{cat:'🍽️ Cocina',subcat:'Perros',comida:true};
  if(has('alita','alas','wings','bbq'))  return{cat:'🍽️ Cocina',subcat:'Alitas',comida:true};
  if(has('salchipapa'))                  return{cat:'🍽️ Cocina',subcat:'Salchipapas',comida:true};
  if(has('papa','french','francesa'))    return{cat:'🍽️ Cocina',subcat:'Papas',comida:true};
  if(has('picada'))                      return{cat:'🍽️ Cocina',subcat:'Picadas',comida:true};
  if(has('nacho'))                       return{cat:'🍽️ Cocina',subcat:'Nachos',comida:true};
  if(has('choripan','chorizo'))          return{cat:'🍽️ Cocina',subcat:'Choripán',comida:true};
  if(has('sandwich','sánduche','sanduche'))return{cat:'🍽️ Cocina',subcat:'Sándwiches',comida:true};
  if(has('empanada','dedito','pastel'))  return{cat:'🍽️ Cocina',subcat:'Pasabocas',comida:true};
  if(has('carne','churrasco','pincho','costilla','lomo','pechuga','pollo'))return{cat:'🍽️ Cocina',subcat:'Carnes',comida:true};
  if(has('taco','burrito','quesadilla')) return{cat:'🍽️ Cocina',subcat:'Mexicana',comida:true};
  if(has('pizza'))                       return{cat:'🍽️ Cocina',subcat:'Pizza',comida:true};
  if(has('lasagna','lasaña','lasana'))   return{cat:'🍽️ Cocina',subcat:'Lasaña',comida:true};
  if(has('pasta','spaghetti','espagueti','ravioli'))return{cat:'🍽️ Cocina',subcat:'Pastas',comida:true};
  if(has('ensalada'))                    return{cat:'🍽️ Cocina',subcat:'Ensaladas',comida:true};
  if(has('postre','helado','torta','brownie'))return{cat:'🍽️ Cocina',subcat:'Postres',comida:true};

  // ── CERVEZAS ── (por tipo y por precio en importadas)
  if(has('cordillera'))                  return{cat:'🍺 Cervezas',subcat:'Cordillera',comida:false};
  if(has('club colombia'))               return{cat:'🍺 Cervezas',subcat:'Club Colombia',comida:false};
  if(has('aguila','águila','poker','costeña','costena','pilsen','andina','bbc'))return{cat:'🍺 Cervezas',subcat:'Cerveza Nacional',comida:false};
  if(has('coronita','corona','heineken','stella','budweiser','miller','coors','peroni','modelo','importada','importado')||word('sol'))return{cat:'🍺 Cervezas',subcat:'__IMPORTADA_PRECIO__',comida:false};
  if(has('cerveza'))                     return{cat:'🍺 Cervezas',subcat:'Cerveza Nacional',comida:false};

  // ── LICORES / DESTILADOS ──
  if(has('aguardiente','antioqueño','antioqueno','nectar','néctar','cristal','amarillo','tapa roja'))return{cat:'🥃 Licores',subcat:tamLicor(),comida:false};
  if(word('ron')||has('medellin','medellín','viejo de caldas','bacardi','havana'))return{cat:'🥃 Licores',subcat:tamLicor(),comida:false};
  if(has('whisky','whiskey','buchanan','old parr','johnnie','johnny','chivas','sello','something','grants','ballantine'))return{cat:'🥃 Licores',subcat:'Whisky',comida:false};
  if(has('vodka','absolut','smirnoff','stolichnaya'))return{cat:'🥃 Licores',subcat:'Vodka',comida:false};
  if(has('tequila','cuervo','patron','patrón'))return{cat:'🥃 Licores',subcat:'Tequila',comida:false};
  if(word('gin')||has('ginebra','tanqueray','bombay','beefeater'))return{cat:'🥃 Licores',subcat:'Ginebra',comida:false};
  if(has('vino','champa','champán','champagne','prosecco','espumante','sangria','sangría','moscato'))return{cat:'🥃 Licores',subcat:'Vinos y espumantes',comida:false};
  if(has('baileys','crema','amarula','licor','sambuca','jagermeister','jager'))return{cat:'🥃 Licores',subcat:'Cremas y aperitivos',comida:false};

  // ── CÓCTELES / SHOTS ──
  if(has('coctel','cóctel','mojito','margarita','cuba libre','piña colada','pina colada','daiquiri','gin tonic','michelada','caipiri','tequila sunrise','sex on','blue'))return{cat:'🍸 Cócteles',subcat:'Cócteles',comida:false};
  if(has('shot','chupito','trago corto'))return{cat:'🍸 Cócteles',subcat:'Shots',comida:false};

  // ── BEBIDAS SIN ALCOHOL ──
  if(has('gaseosa','coca','pepsi','sprite','quatro','colombiana','manzana','postobon','postobón','uva','naranja'))return{cat:'🥤 Bebidas',subcat:'Gaseosas',comida:false};
  if(has('red bull','vive100','vive 100','speed','energiz','monster'))return{cat:'🥤 Bebidas',subcat:'Energizantes',comida:false};
  if(has('agua','soda','tónica','tonica'))return{cat:'🥤 Bebidas',subcat:'Aguas',comida:false};
  if(has('jugo','hit','néctar de fruta','limonada'))return{cat:'🥤 Bebidas',subcat:'Jugos',comida:false};
  if(has('gatorade','hidratante','powerade','suero'))return{cat:'🥤 Bebidas',subcat:'Hidratantes',comida:false};

  // ── CIGARRILLOS ──
  if(has('cigarrillo','marlboro','lucky','malboro','rothmans','cigarr','tabaco','l&m','belmont','kool')||ca.indexOf('cigarr')>=0)return{cat:'🚬 Cigarrillos',subcat:'',comida:false};

  return null; // sin clasificar
}

function organizarCartaAuto(){
  if(!(usuarioActivo&&usuarioActivo.rol==='admin')){alert('Solo el administrador.');return;}
  var sinClasificar=[];
  var cambios=0;
  menu.forEach(function(p){
    var r=_clasificarProducto(p.nombre,p.cat);
    if(r){
      p.cat=r.cat;
      // Importadas: subcategoría por precio (7.000 vs 9.000+)
      if(r.subcat==='__IMPORTADA_PRECIO__'){
        var pr=parseInt(p.precio)||0;
        p.subcat=(pr>=9000)?'Importadas 9.000+':'Importadas 7.000';
      } else {
        p.subcat=r.subcat;
      }
      if(r.comida)p.esComida=true;
      cambios++;
    } else {
      sinClasificar.push(p.nombre);
    }
  });
  var msg='Se organizarán '+cambios+' productos en categorías y subcategorías';
  if(sinClasificar.length)msg+='.\n\n'+sinClasificar.length+' no se pudieron clasificar (los organizas manual):\n- '+sinClasificar.slice(0,15).join('\n- ')+(sinClasificar.length>15?'\n...':'');
  msg+='\n\n¿Aplicar?';
  if(!confirm(msg))return;
  var mo={};menu.forEach(function(m){mo[m.id]=m;});fbSet('menu',mo);
  showToast('🗂️ Carta organizada<br><span style="font-size:12px;opacity:.85">'+cambios+' productos · '+sinClasificar.length+' sin clasificar</span>','#22c55e');
  render();
}

  function _cardProd(p){
    return'<div class="prod-card" style="border-color:'+(editandoProd===p.id?'var(--accent)':'var(--border)')+'">'

  var secs=cats.map(function(cat){

    var subs=enCat.reduce(function(a,m){var s=m.subcat||'';if(a.indexOf(s)<0)a.push(s);return a;},[]).sort();
    var prods;
    if(subs.length===1&&subs[0]===''){
      prods=enCat.map(_cardProd).join('');
    } else {
      prods=subs.map(function(s){
        var lista=enCat.filter(function(m){return (m.subcat||'')===s;});
        return (s?'<div style="color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:8px 0 4px;padding-left:2px">'+esc(s)+' ('+lista.length+')</div>':'<div style="color:#666;font-size:10px;margin:8px 0 4px">Sin subcategoría</div>')
          +'<div class="prod-grid">'+lista.map(_cardProd).join('')+'</div>';
      }).join('');
    }
    var catKey='carta_'+cat;
    var abierto=(catKey in _mesesOpen)?_mesesOpen[catKey]:false;
    var nProds=menu.filter(function(m){return m.cat===cat;}).length;
    return'<div style="margin-bottom:8px">'
      +'<button data-act="toggle-mes" data-mes="'+catKey+'" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 14px;cursor:pointer;color:var(--text)">'

        +'<span style="color:var(--muted);font-size:11px">'+nProds+' productos</span>'
      +'</button>'
      +(abierto?'<div style="margin-top:6px">'+prods+'</div>':'')
      +'</div>';
  }).join('');
  return formHtml+secs;
}

// Event delegation for admin config buttons
function bindAdminEvents(){
  var c=document.getElementById('content');
  if(!c||c._adminBound)return;
  c._adminBound=true;
  c.addEventListener('click',function(e){
    var btn=e.target.closest('[data-act]');if(!btn)return;
    var act=btn.getAttribute('data-act');
    var uid=btn.getAttribute('data-uid');
    if(act==='edituser'&&uid){editarUsuario(uid);return;}
    if(act==='deluser'&&uid){borrarUsuario(uid);return;}
    if(act==='toggleturno'&&uid){toggleTurnoUsuario(uid);return;}
    if(act==='del-rec'){
      var rIdx=parseInt(btn.getAttribute('data-ridx'));
      var prod=editandoProd&&editandoProd!=='nuevo'?menu.find(function(m){return m.id===editandoProd;}):null;
      if(prod&&prod.receta){
        prod.receta.splice(rIdx,1);
        var mo={};menu.forEach(function(m){mo[m.id]=m;});fbSet('menu',mo);
        render();
      }
      return;
    }
    var iid2=btn.getAttribute('data-iid');
    if(act==='rename-cat'){
      abrirRenombrarCategoria(btn.getAttribute('data-cat'));return;
    }
    if(act==='set-cat-emoji'){
      abrirEmojiCategoria(btn.getAttribute('data-cat'));return;
    }
    if(act==='del-ing'&&iid2){
      if(!confirm('¿Eliminar este ingrediente?'))return;
      ingredientes=ingredientes.filter(function(x){return x.id!==iid2;});
      guardarIngredientes();
      closeModal2();render();return;
    }
    var sid=btn.getAttribute('data-sid');
    if(act==='delsocio'&&sid){
      if(!confirm('¿Eliminar este consumo? El stock se devolverá al inventario.'))return;
      eliminarConsumoSocio(sid);
      return;
    }
    if(act==='setfont'){
      ticketConfig.fontSize=parseInt(btn.getAttribute('data-fs'));
      render();
    }
    if(act==='setpaper'){
      ticketConfig.paperWidth=parseInt(btn.getAttribute('data-pw'));
      render();
    }
  });
}

var CAT_EMOJI_MAP={"Agua": "💧", "Alitas": "🍗", "Burritos": "🌯", "COCTELES": "🍹", "Cafe": "☕", "Carnes": "🥩", "Cerveza 3 cordilleras": "🍺", "Cerveza Importada": "🍻", "Cerveza Nacional": "🍺", "Comida": "🍽️", "Energizantes": "⚡", "Entradas": "🍟", "Gaseosas": "🥤", "JUGOS": "🧃", "Lasagna": "🍝", "Licores 1/2": "🥃", "Licores Litro": "🍾", "PIZZA": "🍕", "Smirnoff": "🍸", "Whisky": "🥃", "cigarrillo": "🚬", "otros": "🍹", "tequila": "🥃"};

function getCatEmoji(cat){
  if(CAT_EMOJI_MAP[cat]) return CAT_EMOJI_MAP[cat];
  // case-insensitive fallback
  var cl=cat.toLowerCase();
  for(var k in CAT_EMOJI_MAP){if(k.toLowerCase()===cl)return CAT_EMOJI_MAP[k];}
  return '';
}

function autoAsignarEmojis(){
  // Show what categories exist vs what we have mapped
  var cats=menu.reduce(function(a,p){if(a.indexOf(p.cat)<0)a.push(p.cat);return a;},[]).sort();
  var mapped=cats.filter(function(c){return getCatEmoji(c);});
  var unmapped=cats.filter(function(c){return !getCatEmoji(c);});
  var msg='Categorías encontradas: '+cats.length;
  msg+='\nCon emoji asignado: '+mapped.length;
  if(unmapped.length) msg+='\nSin mapear: '+unmapped.join(', ');
  msg+='\n\n¿Continuar y actualizar TODOS los productos?';
  if(!confirm(msg))return;
  var count=0;
  menu.forEach(function(p){
    var ce=getCatEmoji(p.cat);
    if(ce){p.emoji=ce;count++;}
  });
  Object.keys(CAT_EMOJI_MAP).forEach(function(cat){catEmojis[cat]=CAT_EMOJI_MAP[cat];});
  var mo={};menu.forEach(function(m){mo[m.id]=m;});
  fbSet('menu',mo);
  fbSet('catEmojis',catEmojis);
  render();
  alert('✅ '+count+' productos actualizados de '+cats.length+' categorías.');
}

function exportarInventarioExcel(){
  // Build CSV with BOM for Excel UTF-8 compatibility
  var rows = [['Categoría','Nombre','Emoji','Precio','Stock','Unidad','Es Cerveza','Cubetazo','Descripción']];
  
  // Sort by category then name
  var sorted = menu.slice().sort(function(a,b){
    return (a.cat||'').localeCompare(b.cat||'') || (a.nombre||'').localeCompare(b.nombre||'');
  });
  
  sorted.forEach(function(p){
    rows.push([
      p.cat||'',
      p.nombre||'',
      p.emoji||'',
      p.precio||0,
      p.stock||0,
      p.und||'und',
      p.esCerveza?'Sí':'No',
      p.cubeta||0,
      p.descripcion||''
    ]);
  });

  // Ingredientes section
  if(ingredientes.length){
    rows.push([]);
    rows.push(['── INGREDIENTES DE COCINA ──','','','','','','','','']);
    rows.push(['Nombre','','','','Stock','Unidad','','','']);
    ingredientes.forEach(function(i){
      rows.push([i.nombre||'','','','',i.stock||0,i.und||'und','','','']);
    });
  }

  var csv = '﻿'; // BOM
  rows.forEach(function(r){
    csv += r.map(function(v){
      var s = String(v).replace(/"/g,'""');
      return (s.indexOf(',')>=0||s.indexOf('"')>=0)?'"'+s+'"':s;
    }).join(',') + '\r\n';
  });

  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Area52-Inventario-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function agregarComboAPedido(cbId){
  if(!mesaActiva)return;
  var cb=combos.find(function(c){return c.id===cbId;});
  if(!cb)return;

  // Check if any ingredient is "categoria" type - need to ask customer choice
  var catIngs=cb.ingredientes.filter(function(i){return i.tipo==='categoria';});
  if(catIngs.length>0){
    abrirSelectorCombo(cb, catIngs, 0, []);
    return;
  }

  // All specific products - check stock and add directly
  var ok=cb.ingredientes.every(function(ing){
    var p=menu.find(function(m){return m.id===ing.prodId;});
    return p&&p.stock>=ing.cantidad;
  });
  if(!ok){alert('Stock insuficiente para este combo.');return;}
  confirmarComboEnPedido(cb, []);
}

// Opens a modal to select specific products for each "categoria" ingredient
function abrirSelectorCombo(cb, catIngs, step, selecciones){
  if(step>=catIngs.length){
    confirmarComboEnPedido(cb, selecciones);
    return;
  }
  var ing=catIngs[step];
  var disponibles=menu.filter(function(p){return (p.cat===ing.cat||p.subcat===ing.cat)&&(ventaSinStock||p.stock>0);});
  if(disponibles.length===0){
    closeModal2();
    alert('No hay stock de '+ing.cat+' para este combo.');
    return;
  }
  // Selector de distribución: reparte la cantidad entre los productos de la categoría
  abrirDistribucion({
    titulo:cb.nombre+' · elige '+ing.cantidad+' '+ing.cat,
    emoji:cb.emoji||'🎁',
    total:ing.cantidad,
    productos:disponibles.map(function(p){return {id:p.id,nombre:p.nombre,emoji:p.emoji,precio:p.precio,stock:p.stock};}),
    onConfirm:function(cantidades){
      selecciones.push({catIng:ing, distribucion:cantidades});
      abrirSelectorCombo(cb, catIngs, step+1, selecciones);
    }
  });
}

function confirmarComboEnPedido(cb, selecciones){
  // Build final ingredient list (expandiendo distribución de categorías)
  var finalIngs=[];
  var selIdx=0;
  cb.ingredientes.forEach(function(ing){
    if(ing.tipo==='categoria'){
      var sel=selecciones[selIdx++];
      if(sel&&sel.distribucion){
        // Expandir cada producto elegido en su propio ingrediente
        Object.keys(sel.distribucion).forEach(function(pid){
          var q=sel.distribucion[pid];if(!q)return;
          var p=menu.find(function(m){return Number(m.id)===Number(pid);});
          finalIngs.push({tipo:'producto',prodId:Number(pid),cantidad:q,
            nombre:p?p.nombre:'?',emoji:p?p.emoji:'?',und:p?p.und:'und'});
        });
      } else if(sel&&sel.prodId){
        var p2=menu.find(function(m){return m.id===sel.prodId;});
        finalIngs.push({tipo:'producto',prodId:sel.prodId,cantidad:ing.cantidad,
          nombre:p2?p2.nombre:'?',emoji:p2?p2.emoji:'?',und:p2?p2.und:'und'});
      }
    } else {
      finalIngs.push(ing);
    }
  });

  // Check stock
  var ok=finalIngs.every(function(ing){
    if(ing.prodId==null)return true;
    var p=menu.find(function(m){return Number(m.id)===Number(ing.prodId);});
    return p&&(ventaSinStock||(parseInt(p.stock)||0)>=ing.cantidad);
  });
  if(!ok){alert('Stock insuficiente para alguno de los productos elegidos.');return;}

  var id=mesaActiva.id;
  if(!pedidos[id])pedidos[id]=[];
  // Each combo addition is unique (different product choices) — always push new
  var newItem={
    pid:'combo_'+cb.id+'_'+Date.now(),
    uidItem:'it'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36),
    cubeta:false,qty:1,isCombo:true,
    comboId:cb.id,comboNombre:cb.nombre,comboEmoji:cb.emoji,
    comboPrecio:cb.precio,comboIngredientes:finalIngs
  };
  pedidos[id].push(newItem);
  var r=ref('pedidos/'+id);if(r)r.set(pedidos[id]);
  logPedido(id,(cb.emoji||'🎁')+' '+cb.nombre+' · '+fmt(cb.precio),1);
  // Descontar stock de los ingredientes (atómico + kardex)
  finalIngs.forEach(function(ing){
    var cant=ing.cantidad||1;
    if(ing.prodId!=null)cambiarStock('p',ing.prodId,-cant,'Mesa: combo '+cb.nombre);
    if(ing.ingId!=null)cambiarStock('i',ing.ingId,-cant,'Mesa: combo '+cb.nombre);
  });
  renderSoloPedido();updateHeader();actualizarColorMesas();
}

function agregarIngReceta(){
  var sel=document.getElementById('rec-ing-sel');
  var cant=parseFloat((document.getElementById('rec-ing-cant')||{}).value)||1;
  if(!sel||!sel.value){alert('Selecciona un ingrediente.');return;}
  var selVal=sel.value;
  var pid=selVal.startsWith('ing:')?selVal:parseInt(selVal.replace('menu:',''));
  // Get current product receta
  var prod=editandoProd&&editandoProd!=='nuevo'?menu.find(function(m){return m.id===editandoProd;}):null;
  if(!prod&&editandoProd!=='nuevo'){alert('Guarda el producto primero.');return;}
  var receta=prod?((prod.receta||[]).slice()):[_recetaTemp.slice()][0]||[];
  var exist=receta.findIndex(function(r){return r.pid===pid;});
  if(exist>=0) receta[exist].cantidad+=cant;
  else receta.push({pid:pid,cantidad:cant});
  if(prod){
    prod.receta=receta;
    var mo={};menu.forEach(function(m){mo[m.id]=m;});fbSet('menu',mo);
  } else {
    _recetaTemp=receta;
  }
  sel.value='';
  document.getElementById('rec-ing-cant').value=1;
  render();
}

function guardarProd(){
  var nombre=(document.getElementById('f-nombre')||{}).value;nombre=nombre?nombre.trim():'';
  var precio=moneyVal('f-precio')||0;
  var _catSel=(document.getElementById('f-cat-sel')||{}).value||'';
  var cat=(_catSel==='__new__')?(((document.getElementById('f-cat-new')||{}).value||'').trim()):_catSel;
  var _subSel=(document.getElementById('f-subcat-sel')||{}).value||'';
  var subcat=(_subSel==='__new__')?(((document.getElementById('f-subcat-new')||{}).value||'').trim()):_subSel;
  var stock=parseInt((document.getElementById('f-stock')||{}).value)||0;
  var und=(document.getElementById('f-und')||{}).value||'und';
  var cerv=!!((document.getElementById('f-cerveza')||{}).checked);
  var esComida=!!((document.getElementById('f-comida')||{}).checked);
  var descripcion=((document.getElementById('f-desc')||{}).value||'').trim();
  // Read variantes from dynamic rows
  var variantes=[];
  document.querySelectorAll('[data-vnom]').forEach(function(el){
    var vi=el.getAttribute('data-vnom');
    var nom=el.value.trim();
    var preEl=document.querySelector('[data-vpre="'+vi+'"]');
    var pre=preEl?parseInt(String(preEl.value).replace(/[^0-9]/g,''))||0:0;
    if(nom&&pre>0) variantes.push({nombre:nom,precio:pre});
  });
  var cubeta=cerv?(moneyVal('f-cubeta')||null):null;
  var emoji=(document.getElementById('f-emoji')||{}).value||'🍺';
  if(!nombre){alert('Escribe el nombre.');return;}
  if(!precio){alert('Escribe el precio.');return;}
  if(!cat){alert('Escribe la categoría.');return;}
  if(editandoProd==='nuevo'){
    var maxId=0;menu.forEach(function(m){if(m.id>maxId)maxId=m.id;});
    menu.push({id:maxId+1,nombre:nombre,precio:precio,cubeta:cubeta,esCerveza:cerv,esComida:esComida,descripcion:descripcion,variantes:variantes,cat:cat,subcat:subcat,emoji:emoji,stock:stock,und:und,receta:_recetaTemp||[]});
    _recetaTemp=[];
  } else {
    for(var i=0;i<menu.length;i++){if(menu[i].id===editandoProd){menu[i]=Object.assign({},menu[i],{nombre:nombre,precio:precio,cubeta:cubeta,esCerveza:cerv,esComida:esComida,descripcion:descripcion,variantes:variantes,cat:cat,subcat:subcat,emoji:emoji,stock:stock,und:und});break;}}
  }
  editandoProd=null;var mo={};menu.forEach(function(m){mo[m.id]=m;});fbSet('menu',mo);render();
}

var _comboTemp={ingredientes:[]};

function nuevoCombo(){

}
function cancelarCombo(){editandoCombo=null;render();}
function editarCombo(id){
  editandoCombo=id;

function bindComboEmojiPicker(){
  var picker=document.getElementById('combo-emoji-picker');
  if(!picker||picker._bound)return;
  picker._bound=true;
  picker.addEventListener('click',function(e){
    var btn=e.target.closest('[data-cei]');if(!btn)return;
    var COMBO_EMOJIS=['🎁','🎉','🍻','🥃','🍺','🍷','🍹','🎊','⭐','🔥','💫','🎯'];
    var e2=COMBO_EMOJIS[parseInt(btn.getAttribute('data-cei'))];
    if(!e2)return;
    var hid=document.getElementById('cb-emoji');if(hid)hid.value=e2;
    picker.querySelectorAll('[data-cei]').forEach(function(b){
      var sel=b===btn;
      b.style.background=sel?'#a855f722':'transparent';
      b.style.border=sel?'2px solid #a855f7':'2px solid transparent';
    });

function limpiarCatSel(){var s=document.getElementById('cb-cat-sel');if(s)s.value='';}
function limpiarProdSel(){var s=document.getElementById('cb-prod-sel');if(s)s.value='';}

function _capturarCombo(){
  var n=document.getElementById('cb-nombre');if(n)_comboTemp.nombre=n.value;
  var p=document.getElementById('cb-precio');if(p)_comboTemp.precio=p.value;
  var e=document.getElementById('cb-emoji');if(e)_comboTemp.emoji=e.value;
}

function agregarIngCombo(){
  _capturarCombo();
  var prodSel=document.getElementById('cb-prod-sel');
  var catSel=document.getElementById('cb-cat-sel');
  var cantEl=document.getElementById('cb-prod-cant');
  if(!cantEl)return;
  var cant=parseInt(cantEl.value)||1;
  if(cant<1){alert('La cantidad debe ser al menos 1.');return;}

  var prodVal=prodSel?prodSel.value:'';
  var catVal=catSel?catSel.value:'';

  if(!prodVal&&!catVal){alert('Selecciona un producto específico o una categoría.');return;}

  if(prodVal){
    if(prodVal.startsWith('ing:')){
      // Ingrediente cocina
      var ingId=prodVal.replace('ing:','');
      var ingItem=ingredientes.find(function(i){return i.id===ingId;});
      if(!ingItem){alert('Ingrediente no encontrado.');return;}
      var existeI=_comboTemp.ingredientes.findIndex(function(i){return i.tipo==='ingrediente'&&i.ingId===ingId;});
      if(existeI>=0){_comboTemp.ingredientes[existeI].cantidad+=cant;}
      else{_comboTemp.ingredientes.push({tipo:'ingrediente',ingId:ingId,cantidad:cant,
        nombre:ingItem.nombre,emoji:'🧂',und:ingItem.und});}
    } else {
      // Specific product: value = "prod:ID"
      var prodId=parseInt(prodVal.replace('prod:',''));
      if(!prodId){alert('Selecciona un producto válido.');return;}
      var existe=_comboTemp.ingredientes.findIndex(function(i){return i.tipo==='producto'&&i.prodId===prodId;});
      if(existe>=0){_comboTemp.ingredientes[existe].cantidad+=cant;}
      else{
        var p=menu.find(function(m){return m.id===prodId;});
        _comboTemp.ingredientes.push({tipo:'producto',prodId:prodId,cantidad:cant,
          nombre:p?p.nombre:'?',emoji:p?p.emoji:'?',und:p?p.und:'und'});
      }
    }
  } else {
    // Category: value = "cat:Cervezas"
    var cat=catVal.replace('cat:','');
    var existe2=_comboTemp.ingredientes.findIndex(function(i){return i.tipo==='categoria'&&i.cat===cat;});
    if(existe2>=0){_comboTemp.ingredientes[existe2].cantidad+=cant;}
    else{_comboTemp.ingredientes.push({tipo:'categoria',cat:cat,cantidad:cant});}
  }

  if(prodSel)prodSel.value='';
  if(catSel)catSel.value='';
  cantEl.value=1;
  showToast('✓ Ingrediente agregado al combo','#22c55e');
  render();setTimeout(bindComboEmojiPicker,50);
}

function quitarIngCombo(idx){
  _capturarCombo();
  _comboTemp.ingredientes.splice(idx,1);
  render();setTimeout(bindComboEmojiPicker,50);
}

function cambiarCantIngCombo(idx,val){
  var cant=parseInt(val)||1;
  if(cant<1)cant=1;
  _comboTemp.ingredientes[idx].cantidad=cant;
}

function actualizarInfoCombo(){
  var precio=moneyVal('cb-precio')||0;
  var costoEl=document.getElementById('cb-costo');
  var ahorroEl=document.getElementById('cb-ahorro');
  if(costoEl){
    var costoAprox=_comboTemp.ingredientes.reduce(function(a,ing){
      var p=menu.find(function(m){return m.id===ing.prodId;});
      return a+(p?p.precio*ing.cantidad:0);
    },0);
    costoEl.textContent=fmt(costoAprox);
    if(ahorroEl)ahorroEl.textContent=fmt(Math.max(0,costoAprox-precio));
  }
}

function guardarCombo(){
  var nombre=((document.getElementById('cb-nombre')||{}).value||'').trim();
  var precio=moneyVal('cb-precio')||0;
  var emoji=(document.getElementById('cb-emoji')||{}).value||'🎁';
  if(!nombre){alert('Escribe el nombre del combo.');return;}
  if(!precio||precio<=0){alert('Escribe el precio de venta.');return;}
  if(!_comboTemp.ingredientes.length){alert('Agrega al menos un ingrediente al combo.');return;}
  var obj={
    id:editandoCombo==='nuevo'?'cb'+Date.now():editandoCombo,
    nombre:nombre,precio:precio,emoji:emoji,
    ingredientes:JSON.parse(JSON.stringify(_comboTemp.ingredientes))
  };
  if(editandoCombo==='nuevo'){combos.push(obj);}
  else{var idx=combos.findIndex(function(c){return c.id===editandoCombo;});if(idx>=0)combos[idx]=obj;}
  var co={};combos.forEach(function(c){co[c.id]=c;});fbSet('combos',co);
  editandoCombo=null;render();
}

function fmtFecha(ts){
  var d=new Date(ts);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
}
function fmtFechaCorta(ts){
  var d=new Date(ts);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+String(d.getFullYear()).slice(-2)+' '+fmtTime(ts);
}

function exportarGastosExcel(){
  var rows=[['Fecha','Hora','Concepto','Categoría','Forma de pago','Valor','Usuario','Notas']];
  var sorted=gastos.slice().sort(function(a,b){return b.ts-a.ts;});
  sorted.forEach(function(g){
    var f=FPAGO.find(function(x){return x.id===g.fp;});
    var d=new Date(g.ts);
    rows.push([
      ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(),
      ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2),
      g.concepto||'',
      g.categoria||'',
      f?f.label:(g.fp||''),
      g.valor||0,
      g.uidNombre||g.uid||'',
      g.notas||''
    ]);
  });
  // Total row
  var total=sorted.reduce(function(a,g){return a+g.valor;},0);
  rows.push([]);
  rows.push(['','','','','TOTAL',total,'','']);

  var csv='﻿';
  rows.forEach(function(r){
    csv+=r.map(function(v){
      var s=String(v).replace(/"/g,'""');
      return (s.indexOf(',')>=0||s.indexOf('"')>=0)?'"'+s+'"':s;
    }).join(',')+'\r\n';
  });
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='Area52-Gastos-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Efectivo que DEBERÍA haber en caja en este momento del turno
function efectivoEsperadoTurno(){
  var ini=cajaHoy.ini_efectivo||0;
  var vEf=ventasTurno().reduce(function(a,v){
    var pl=(v.pagos&&v.pagos.length)?v.pagos:[{fp:v.fp,monto:v.total}];
    return a+pl.filter(function(p){return p.fp==='efectivo';}).reduce(function(s,p){return s+(p.monto||0);},0);
  },0);
  var gEf=gastosTurno().filter(function(g){return (g.fp||'efectivo')==='efectivo';}).reduce(function(a,g){return a+(g.valor||0);},0);
  // Abonos en efectivo de mesas AÚN abiertas (plata que ya está en la caja pero sin venta registrada)
  var abEf=0;
  Object.keys(abonosMesa).forEach(function(mid){
    (abonosMesa[mid]||[]).forEach(function(ab){if((ab.fp||'efectivo')==='efectivo')abEf+=(ab.monto||0);});
  });
  return {esperado:ini+vEf+abEf-gEf,ini:ini,ventas:vEf,abonos:abEf,gastos:gEf};
}

function calcArqueo(){
  var total=0;
  DENOMS.forEach(function(d){
    var q=parseInt((document.getElementById('arq-'+d.k)||{}).value)||0;
    var sub=q*d.v;total+=sub;
    var el=document.getElementById('arqs-'+d.k);
    if(el)el.textContent=sub?fmt(sub):'$0';
  });
  var t=document.getElementById('arq-total');
  if(t)t.textContent=fmt(total);
  return total;
}
function confirmarArqueo(){
  var denoms={};var total=0;var alguno=false;
  DENOMS.forEach(function(d){
    var q=parseInt((document.getElementById('arq-'+d.k)||{}).value)||0;
    denoms[d.k]=q;total+=q*d.v;if(q>0)alguno=true;
  });
  if(!alguno&&!confirm('No registraste ningún billete ni moneda (caja en $0). ¿Guardar así?'))return;
  var esp=efectivoEsperadoTurno();
  var dif=total-esp.esperado;
  var arq={id:'arq_'+Date.now(),ts:Date.now(),uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre,
    denoms:denoms,total:total,esperado:esp.esperado,dif:dif,
    detalleEsperado:{ini:esp.ini,ventas:esp.ventas,abonos:esp.abonos,gastos:esp.gastos},
    turnoTs:turnoInicio||0};
  fbPush('arqueos',arq);
  closeModal1();
  // El cajero solo ve su total (conteo ciego); el admin ve la diferencia
  if(usuarioActivo.rol==='admin'){

    showToast('🧮 Arqueo guardado · contado '+fmt(total)+'<br><span style="font-size:12px;opacity:.9">Esperado '+fmt(esp.esperado)+' · '+difTxt+'</span>',dif===0?'#22c55e':(dif<0?'#ef4444':'#f5a623'),6000);
  } else {
    showToast('🧮 Arqueo guardado<br><span style="font-size:12px;opacity:.85">Total contado: '+fmt(total)+' · quedó registrado con tu nombre</span>','#22c55e',5000);
  }

}

/* ═══════════ CONCILIACIÓN BANCARIA (subir extracto y cruzar) ═══════════ */
function abrirConcilBanco(){
  if(typeof XLSX==='undefined'||!window._xlsxReady){alert('La librería de Excel aún no carga. Verifica la conexión e intenta de nuevo.');return;}
  var fpChecks=FPAGO.filter(function(f){return f.id!=='efectivo';}).map(function(f){
    return'<label style="display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:700;color:'+f.color+'"><input type="checkbox" class="cb-fp" value="'+f.id+'" checked style="accent-color:'+f.color+'"/>'+f.emoji+' '+f.label+'</label>';
  }).join('');
  modal1('<div style="font-weight:800;font-size:16px;margin-bottom:2px">🏦 Conciliación bancaria</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-bottom:12px">Sube el extracto de movimientos del banco (Excel). El sistema cruza cada pago digital del POS y cada gasto contra el extracto, y te muestra lo que no cuadra.</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-bottom:5px">Formas de pago que entran a ESTA cuenta:</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'+fpChecks+'</div>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
      +'<span style="color:var(--muted);font-size:11px">Tolerancia de fecha:</span>'
      +'<select class="inp" id="concil-tol" style="flex:1;padding:7px"><option value="1" selected>±1 día (recomendado: el banco registra al día siguiente)</option><option value="0">Mismo día exacto</option><option value="2">±2 días</option></select>'
    +'</div>'
    +'<input type="file" id="concil-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="procesarArchivoBanco(this)"/>'
    +'<button onclick="document.getElementById(\'concil-file\').click()" style="width:100%;background:#38bdf818;color:#38bdf8;border:2px dashed #38bdf855;border-radius:12px;padding:22px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:12px">📄 Elegir archivo del extracto</button>'
    +'<div id="concil-result"></div>'
    +'<button class="btn btn-full" onclick="closeModal1()" style="background:var(--card2);border:1px solid var(--border);color:var(--text)">Cerrar</button>');
}
function _concilDia(d){
  // Normaliza cualquier formato de fecha a 'YYYY-MM-DD'
  if(d instanceof Date&&!isNaN(d))return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  if(typeof d==='number'&&d>20000){var dd=new Date(Math.round((d-25569)*86400*1000));return _concilDia(dd);}
  if(typeof d==='string'){
    var m=d.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(m){var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);}
    var m2=d.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m2)return m2[1]+'-'+('0'+m2[2]).slice(-2)+'-'+('0'+m2[3]).slice(-2);
  }
  return null;
}
function _diasEntre(d1,d2){
  return Math.abs((new Date(d1+'T12:00:00')-new Date(d2+'T12:00:00'))/86400000);
}
function procesarArchivoBanco(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  var res=document.getElementById('concil-result');
  if(res)res.innerHTML='<div style="color:var(--muted);font-size:12px;text-align:center;padding:14px">⏳ Leyendo y cruzando movimientos...</div>';
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      // Encontrar la fila de encabezados (contiene Fecha y Valor)
      var hIdx=-1,cFecha=-1,cDesc=-1,cValor=-1;
      for(var i=0;i<Math.min(rows.length,15);i++){
        var r=(rows[i]||[]).map(function(c){return String(c||'').toLowerCase();});
        var fi=r.findIndex(function(c){return c.indexOf('fecha')>=0;});
        var vi=r.findIndex(function(c){return c.indexOf('valor')>=0||c.indexOf('monto')>=0||c.indexOf('importe')>=0;});
        if(fi>=0&&vi>=0){hIdx=i;cFecha=fi;cValor=vi;cDesc=r.findIndex(function(c){return c.indexOf('desc')>=0||c.indexOf('concepto')>=0||c.indexOf('transac')>=0;});break;}
      }
      if(hIdx<0)throw new Error('No encontré columnas de Fecha y Valor en el archivo. ¿Es el extracto de movimientos?');
      var movs=[];
      for(var j=hIdx+1;j<rows.length;j++){
        var row=rows[j];if(!row)continue;
        var dia=_concilDia(row[cFecha]);
        var val=row[cValor];
        if(typeof val==='string')val=parseFloat(val.replace(/[^0-9.,-]/g,'').replace(/\./g,'').replace(',','.'))||parseFloat(val.replace(/[^0-9.-]/g,''));
        val=Math.round(Number(val)||0);
        if(!dia||!val)continue;
        movs.push({dia:dia,desc:String((cDesc>=0?row[cDesc]:'')||'').trim(),valor:val,usado:false});
      }
      if(!movs.length)throw new Error('El archivo no tiene movimientos legibles.');
      ejecutarConciliacion(movs);
    }catch(err){
      if(res)res.innerHTML='<div style="background:#ef444414;border:1px solid #ef444433;border-radius:9px;padding:10px;color:#ef4444;font-size:12px">❌ '+esc(err.message||'No pude leer el archivo.')+'</div>';
    }
  };
  reader.readAsArrayBuffer(file);
}
function ejecutarConciliacion(movs){
  var fps=[];document.querySelectorAll('.cb-fp').forEach(function(cb){if(cb.checked)fps.push(cb.value);});
  if(!fps.length)fps=FPAGO.filter(function(f){return f.id!=='efectivo';}).map(function(f){return f.id;});
  var tol=parseInt((document.getElementById('concil-tol')||{}).value);if(isNaN(tol))tol=1;
  // Rango de fechas del extracto
  var dias=movs.map(function(m){return m.dia;}).sort();
  var dMin=dias[0],dMax=dias[dias.length-1];
  function enRango(ts){var d=_concilDia(new Date(ts));return d>=dMin&&d<=dMax;}
  // ── Lado POS: pagos digitales (de ventas) ──
  var pagosPOS=[];
  ventas.forEach(function(v){
    if(!enRango(v.ts))return;
    var pl=(v.pagos&&v.pagos.length)?v.pagos:[{fp:v.fp,monto:v.total}];
    pl.forEach(function(p){
      if(fps.indexOf(p.fp)<0||!(p.monto>0))return;
      pagosPOS.push({ts:v.ts,dia:_concilDia(new Date(v.ts)),mesa:v.mesa||'',fp:p.fp,monto:Math.round(p.monto),uidNombre:v.uidNombre||'',compId:v.compId||null,refPago:v.refPago||'',ok:false});
    });
  });
  // ── Lado POS: gastos digitales ──
  var gastosPOS=gastos.filter(function(g){return enRango(g.ts)&&fps.indexOf(g.fp||'')>=0;}).map(function(g){
    return {ts:g.ts,dia:_concilDia(new Date(g.ts)),concepto:g.concepto||'',monto:Math.round(g.valor||0),fp:g.fp,uidNombre:g.uidNombre||'',ok:false};
  });
  // ── Lado banco ──
  var bIngresos=movs.filter(function(m){return m.valor>0;});
  var bEgresos=movs.filter(function(m){return m.valor<0;}).map(function(m){return {dia:m.dia,desc:m.desc,valor:Math.abs(m.valor),usado:false};});
  // ── Cruce 1: pagos POS vs ingresos banco (mismo valor, fecha dentro de tolerancia) ──
  pagosPOS.sort(function(a,b){return a.ts-b.ts;});
  pagosPOS.forEach(function(p){
    var mejor=-1,mejorDist=999;
    for(var i=0;i<bIngresos.length;i++){
      var b=bIngresos[i];
      if(b.usado||b.valor!==p.monto)continue;
      var dist=_diasEntre(b.dia,p.dia);
      if(dist<=tol&&dist<mejorDist){mejor=i;mejorDist=dist;}
    }
    if(mejor>=0){bIngresos[mejor].usado=true;p.ok=true;}
  });
  // ── Cruce 2: gastos POS vs egresos banco ──
  gastosPOS.forEach(function(g){
    var mejor=-1,mejorDist=999;
    for(var i=0;i<bEgresos.length;i++){
      var b=bEgresos[i];
      if(b.usado||b.valor!==g.monto)continue;
      var dist=_diasEntre(b.dia,g.dia);
      if(dist<=tol&&dist<mejorDist){mejor=i;mejorDist=dist;}
    }
    if(mejor>=0){bEgresos[mejor].usado=true;g.ok=true;}
  });
  // ── Clasificar restos ──
  var pagosSinBanco=pagosPOS.filter(function(p){return !p.ok;});
  var ingresosSinPOS=bIngresos.filter(function(b){return !b.usado;});
  var esDelBanco=function(d){return /4X1000|INTERES|CUOTA.*MANEJO|C MANEJO|COMISION|IVA COMIS|GMF|RETENCION/i.test(d);};
  var egresosBancoRestantes=bEgresos.filter(function(b){return !b.usado;});
  var egresosDelBanco=egresosBancoRestantes.filter(function(b){return esDelBanco(b.desc);});
  var egresosSinReportar=egresosBancoRestantes.filter(function(b){return !esDelBanco(b.desc);});
  var gastosSinBanco=gastosPOS.filter(function(g){return !g.ok;});
  var fpLbl=function(fp){var f=FPAGO.find(function(x){return x.id===fp;});return f?f.emoji+' '+f.label:fp;};
  var sum=function(arr,k){return arr.reduce(function(a,x){return a+(x[k]||0);},0);};
  function filaPOS(p){
    return'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'
      +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">'+esc(p.mesa)+' · '+fpLbl(p.fp)+'</div>'
      +'<div style="color:var(--muted);font-size:10px">'+fmtFechaCorta(p.ts)+(p.refPago?' · Ref '+esc(p.refPago):'')+(p.uidNombre?' · ✍️ '+esc(p.uidNombre):'')+'</div></div>'
      +'<span style="color:#ef4444;font-weight:900;white-space:nowrap">'+fmt(p.monto)+'</span>'
      +(p.compId?'<button onclick="verComprobante(\''+p.compId+'\')" style="background:#38bdf818;color:#38bdf8;border:1px solid #38bdf833;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:700;cursor:pointer">📷</button>':'')
    +'</div>';
  }
  function filaBanco(b,color){
    return'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'
      +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">'+esc(b.desc||'Movimiento')+'</div>'
      +'<div style="color:var(--muted);font-size:10px">'+b.dia+'</div></div>'
      +'<span style="color:'+color+';font-weight:900;white-space:nowrap">'+fmt(b.valor)+'</span></div>';
  }
  function filaGasto(g){
    return'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'
      +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">'+esc(g.concepto)+' · '+fpLbl(g.fp)+'</div>'
      +'<div style="color:var(--muted);font-size:10px">'+fmtFechaCorta(g.ts)+(g.uidNombre?' · ✍️ '+esc(g.uidNombre):'')+'</div></div>'
      +'<span style="color:#f5a623;font-weight:900;white-space:nowrap">'+fmt(g.monto)+'</span></div>';
  }
  function seccion(titulo,color,desc,filas,total){
    return'<div style="background:'+color+'0d;border:1px solid '+color+'40;border-radius:11px;padding:10px 12px;margin-bottom:10px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center"><span style="color:'+color+';font-weight:800;font-size:13px">'+titulo+'</span>'+(total!=null?'<span style="color:'+color+';font-weight:900;font-size:14px">'+fmt(total)+'</span>':'')+'</div>'
      +'<div style="color:var(--muted);font-size:10px;margin:2px 0 6px">'+desc+'</div>'
      +'<div style="max-height:32vh;overflow-y:auto">'+(filas||'<div style="color:#22c55e;font-size:12px;font-weight:700;padding:4px 0">✅ Nada pendiente aquí</div>')+'</div>'
    +'</div>';
  }
  var conciliados=pagosPOS.length-pagosSinBanco.length;
  var html='<div style="background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:10px">'
    +'<div style="font-weight:800;font-size:13px;margin-bottom:4px">📊 Resumen · extracto del '+dMin+' al '+dMax+'</div>'
    +'<div style="color:var(--muted);font-size:11px;line-height:1.7">'
      +'Movimientos del banco: <b style="color:var(--text)">'+movs.length+'</b> · Pagos digitales del POS en ese rango: <b style="color:var(--text)">'+pagosPOS.length+'</b><br>'
      +'✅ Conciliados: <b style="color:#22c55e">'+conciliados+' ('+fmt(sum(pagosPOS.filter(function(p){return p.ok;}),'monto'))+')</b>'
    +'</div></div>'
    +seccion('🔴 Pagos del POS SIN respaldo en el banco ('+pagosSinBanco.length+')','#ef4444','Se cobraron en el sistema pero NO aparecen consignados. Revisa el comprobante 📷 de cada uno — puede ser un pago falsificado o de otra cuenta.',pagosSinBanco.map(filaPOS).join(''),sum(pagosSinBanco,'monto'))
    +seccion('🟠 Salidas del banco NO reportadas como gasto ('+egresosSinReportar.length+')','#f97316','Plata que salió de la cuenta y nadie registró en Gastos.',egresosSinReportar.map(function(b){return filaBanco(b,'#f97316');}).join(''),sum(egresosSinReportar,'valor'))
    +seccion('🔵 Ingresos al banco sin venta en el POS ('+ingresosSinPOS.length+')','#38bdf8','Consignaciones que no cruzaron con ningún cobro (transferencias personales, ventas sin registrar, o pagos con fecha/valor distinto).',ingresosSinPOS.map(function(b){return filaBanco(b,'#38bdf8');}).join(''),sum(ingresosSinPOS,'valor'))
    +seccion('🟡 Gastos digitales del POS que no salieron del banco ('+gastosSinBanco.length+')','#f5a623','Registrados como gasto pero sin salida en el extracto (pueden ser de Nequi/Daviplata como apps aparte).',gastosSinBanco.map(filaGasto).join(''),sum(gastosSinBanco,'monto'))
    +seccion('⚪ Movimientos propios del banco ('+egresosDelBanco.length+')','#94a3b8','4x1000, comisiones y cuotas de manejo. Normales, pero recuerda registrarlos como gasto para que la utilidad sea real.',egresosDelBanco.map(function(b){return filaBanco(b,'#94a3b8');}).join(''),sum(egresosDelBanco,'valor'));
  var res=document.getElementById('concil-result');
  if(res)res.innerHTML=html;
}

function renderCaja(){
  var esAdmin=usuarioActivo&&usuarioActivo.rol==='admin';
  var hoyV=ventasTurno();
  var hoyG=gastosTurno();
  var totalV=hoyV.reduce(function(a,v){return a+v.total;},0);
  var totalG=hoyG.reduce(function(a,g){return a+g.valor;},0);
  var utilidad=cajaHoy.cajaInicial+totalV-totalG;

  // Ventas por forma de pago
  var porFP={};
  hoyV.forEach(function(v){

function guardarCajaInicial(){
  var total=0;
  document.querySelectorAll('[data-fp-ini]').forEach(function(el){
    var fp=el.getAttribute('data-fp-ini');
    var v=parseInt(String(el.value).replace(/[^0-9]/g,''))||0;
    cajaHoy['ini_'+fp]=v;
    total+=v;
  });
  cajaHoy.cajaInicial=total;
  fbSet('cajaHoy',cajaHoy);
  if(!turnoInicio){turnoInicio=Date.now();fbSet('turnoInicio',turnoInicio);}
  render();
}

function abrirCierre(){
  var hoyV=ventasTurno();
  var hoyG=gastosTurno();
  var totalV=hoyV.reduce(function(a,v){return a+v.total;},0);
  var totalG=hoyG.reduce(function(a,g){return a+g.valor;},0);
  var porFP={};
  hoyV.forEach(function(v){
    if(v.pagos&&v.pagos.length){
      v.pagos.forEach(function(p){porFP[p.fp]=(porFP[p.fp]||0)+p.monto;});
    } else {
      porFP[v.fp]=(porFP[v.fp]||0)+v.total;
    }
  });
  var utilidad=cajaHoy.cajaInicial+totalV-totalG;
  var mesasOcup=mesas.filter(function(m){return pedidos[m.id]&&pedidos[m.id].length>0;}).length;

  // Gastos por forma de pago para mostrar el saldo neto proyectado
  var gastosPorFP={};
  hoyG.forEach(function(g){var gfp=g.fp||'efectivo';gastosPorFP[gfp]=(gastosPorFP[gfp]||0)+g.valor;});
  var sumaProyectada=0;
  var filas=FPAGO.map(function(f){
    var ini=cajaHoy['ini_'+f.id]||0;
    var ventasFP=porFP[f.id]||0;
    var gastosFP=gastosPorFP[f.id]||0;
    var saldoFP=Math.max(0,ini+ventasFP-gastosFP);
    sumaProyectada+=saldoFP;
    return'<div class="cierre-row"><span>'+f.emoji+' '+f.label+'</span>'
      +'<span style="color:'+f.color+';font-weight:700">'+fmt(saldoFP)
      +'<span style="color:var(--muted);font-size:10px;font-weight:400"> ('+fmt(ini)+'+'+fmt(ventasFP)+(gastosFP?'-'+fmt(gastosFP):'')+')</span>'
      +'</span></div>';
  }).join('')
  +'<div class="cierre-row" style="border-top:1px solid var(--gold)33;margin-top:4px;padding-top:6px"><span style="font-weight:700">Total en caja nuevo turno</span><span style="color:var(--gold);font-weight:900">'+fmt(sumaProyectada)+'</span></div>';

  modal1('<div style="text-align:center;margin-bottom:16px">'
    +'<div style="font-size:28px">🔒</div>'
    +'<div style="font-size:18px;font-weight:900;color:var(--gold)">Cierre de turno</div>'
    +'<div style="color:var(--muted);font-size:12px">'+todayStr()+'</div></div>'
    +(mesasOcup>0?'<div class="alert-box alert-red mb12">⚠️ Hay '+mesasOcup+' mesa(s) con pedidos abiertos. Se recomienda cobrarlas antes del cierre.</div>':'')
    +'<div class="cierre-card">'
    +'<div class="cierre-row"><span>Caja inicial</span><span style="color:var(--gold);font-weight:700">'+fmt(cajaHoy.cajaInicial)+'</span></div>'
    +'<div class="cierre-row"><span>Total ventas</span><span style="color:#22c55e;font-weight:700">'+fmt(totalV)+'</span></div>'
    +'<div class="cierre-row"><span>Total gastos</span><span style="color:#ef4444;font-weight:700">'+fmt(totalG)+'</span></div>'
    +'<div style="color:var(--muted);font-size:11px;margin:8px 0 4px;font-weight:700">💰 Saldo que queda en cada casilla:</div>'
    +filas
    +'<div class="cierre-total"><span>Utilidad bruta</span><span style="color:'+(utilidad>=0?'#22c55e':'#ef4444')+'">'+fmt(utilidad)+'</span></div>'
    +'</div>'
    +'<div style="color:var(--muted);font-size:12px;margin-bottom:14px;text-align:center">¿Confirmas el cierre del día? Esta acción guarda el resumen en el historial.</div>'
    +'<div style="display:flex;gap:10px">'
    +'<button class="btn btn-outline btn-full" onclick="closeModal1()">Cancelar</button>'
    +'<button class="btn btn-gold btn-full" onclick="confirmarCierre()">🔒 Confirmar cierre</button>'
    +'</div>');

function confirmarCierre(){
  purgarComprobantes();  // limpieza de fotos de comprobantes con más de 45 días
  var hoyV=ventasTurno();
  var hoyG=gastosTurno();
  var totalV=hoyV.reduce(function(a,v){return a+v.total;},0);
  var totalG=hoyG.reduce(function(a,g){return a+g.valor;},0);
  var porFP={};
  hoyV.forEach(function(v){
    if(v.pagos&&v.pagos.length){
      v.pagos.forEach(function(p){porFP[p.fp]=(porFP[p.fp]||0)+p.monto;});
    } else {
      porFP[v.fp]=(porFP[v.fp]||0)+v.total;
    }
  });
  // Descontar gastos por forma de pago
  var gastosPorFP={};
  hoyG.forEach(function(g){
    var gfp=g.fp||'efectivo';
    gastosPorFP[gfp]=(gastosPorFP[gfp]||0)+g.valor;
    porFP[gfp]=(porFP[gfp]||0)-g.valor; // neto por FP
  });
  var cierre={
    id:'c'+Date.now(),ts:Date.now(),
    turnoInicio:turnoInicio,
    turnoFin:Date.now(),
    cajaInicial:cajaHoy.cajaInicial,
    ventas:totalV,gastos:totalG,
    porFP:porFP,gastosPorFP:gastosPorFP,
    utilidad:cajaHoy.cajaInicial+totalV-totalG,
    numVentas:hoyV.length,numGastos:hoyG.length,
    uid:usuarioActivo.id
  };
  fbPush('cierres',cierre);
  // Nueva caja por forma de pago = inicial anterior del método + neto del método
  var nuevaCaja = {};
  var sumaCasillas = 0;
  FPAGO.forEach(function(f){
    var ini = cajaHoy['ini_'+f.id]||0;
    var neto = (porFP[f.id]||0); // ventas - gastos del método
    var saldoFP = Math.max(0, ini + neto);
    nuevaCaja['ini_'+f.id] = saldoFP;
    sumaCasillas += saldoFP;
  });
  // El total SIEMPRE es la suma exacta de las casillas (así nunca se descuadra)
  nuevaCaja.cajaInicial = sumaCasillas;
  cajaHoy = nuevaCaja;
  turnoInicio=Date.now();
  fbSet('cajaHoy',cajaHoy);
  fbSet('turnoInicio',turnoInicio);
  closeModal1();render();
  var resumen='Cierre guardado ✓\n\nSaldos que pasan al nuevo turno:\n';
  FPAGO.forEach(function(f){resumen+=f.emoji+' '+f.label+': '+fmt(nuevaCaja['ini_'+f.id]||0)+'\n';});
  resumen+='\nTOTAL EN CAJA: '+fmt(sumaCasillas);
  alert(resumen);
}

function verCierre(id){
  var c=cierres.find(function(x){return x.id===id;});if(!c)return;
  var uid=usuarios.find(function(u){return u.id===c.uid;});
  var filas=FPAGO.map(function(f){
    var ventas=(c.porFP&&c.porFP[f.id])||0;
    var gastos2=(c.gastosPorFP&&c.gastosPorFP[f.id])||0;
    var neto=ventas-gastos2;
    return'<div class="cierre-row"><span>'+f.emoji+' '+f.label+'</span>'
      +'<span style="color:'+f.color+';font-weight:700">'+fmt(neto)

function ventasDiariasHTML(){
  if(!ventas.length)return '<div style="color:var(--dim);text-align:center;padding:16px;font-size:13px">Sin ventas registradas</div>';
  // Agrupar por día de negocio
  var dias={};
  ventas.forEach(function(v){
    var k=diaNegocioStr(v.ts);
    if(!dias[k])dias[k]={fecha:k,ts:fechaNegocio(v.ts).getTime(),total:0,n:0,porPago:{}};
    dias[k].total+=v.total;dias[k].n++;
    if(v.pagos&&v.pagos.length){v.pagos.forEach(function(p){dias[k].porPago[p.fp]=(dias[k].porPago[p.fp]||0)+p.monto;});}
    else{dias[k].porPago[v.fp]=(dias[k].porPago[v.fp]||0)+v.total;}
  });
  // Ordenar por fecha desc (más reciente primero)
  var lista=Object.values(dias).sort(function(a,b){return b.ts-a.ts;});
  var hoyNeg=hoyNegocioStr();
  return lista.map(function(d){
    var esHoy=(d.fecha===hoyNeg);
    var pagosTxt=FPAGO.filter(function(f){return d.porPago[f.id];}).map(function(f){
      return '<span style="display:inline-flex;align-items:center;gap:3px;margin-right:10px;font-size:11px;color:var(--muted)">'+f.emoji+' '+fmt(d.porPago[f.id])+'</span>';
    }).join('');
    return '<div style="background:'+(esHoy?'#f5a62312':'var(--bg)')+';border:1px solid '+(esHoy?'#f5a62344':'var(--border)')+';border-radius:11px;padding:12px 14px;margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
        +'<div style="font-weight:800;font-size:14px">'+(esHoy?'🟢 Hoy · ':'📅 ')+d.fecha+'</div>'
        +'<div style="color:var(--gold);font-weight:900;font-size:17px">'+fmt(d.total)+'</div>'
      +'</div>'
      +'<div style="color:var(--muted);font-size:11px;margin-bottom:6px">'+d.n+' cobros</div>'
      +'<div style="display:flex;flex-wrap:wrap">'+pagosTxt+'</div>'
    +'</div>';
  }).join('');
}

function renderVentas(){

  var cubetazos=hoyV.reduce(function(a,v){
    var its=v.items?(Array.isArray(v.items)?v.items:Object.values(v.items)):[];
    return a+its.reduce(function(b,i){return b+((i.cubeta||i.isCubetazoMix)?(i.qty||1):0);},0);
  },0);
  var porPago={};hoyV.forEach(function(v){
    if(v.pagos&&v.pagos.length){v.pagos.forEach(function(p){porPago[p.fp]=(porPago[p.fp]||0)+p.monto;});}
    else{porPago[v.fp]=(porPago[v.fp]||0)+v.total;}

  var porProd={};
  hoyV.forEach(function(v){
    var its=v.items?(Array.isArray(v.items)?v.items:Object.values(v.items)):[];
    its.forEach(function(it){
      if(it.isCustom)return;
      if(it.isCombo){
        var kc='combo_'+(it.comboNombre||'Combo');
        if(!porProd[kc])porProd[kc]={nombre:it.comboNombre||'Combo',emoji:'🎁',qty:0,total:0};
        porProd[kc].qty+=(it.qty||1);porProd[kc].total+=(it.comboPrecio||0)*(it.qty||1);
        return;
      }
      if(it.isCubetazoMix){
        (it.cubMixDetalle||[]).forEach(function(dd){
          var km='p_'+dd.nombre;

          porProd[km].qty+=dd.cantidad*(it.qty||1);
          porProd[km].total+=(dd.precioUnidad||0)*dd.cantidad*(it.qty||1);

        return;

      var p=menu.find(function(m){return Number(m.id)===Number(it.pid);});
      var nombre=(p?p.nombre:(it.nombre||'?'))+(it.varianteNombre?' ('+it.varianteNombre+')':'');
      var emoji=p?p.emoji:'📦';

    var histRows=hoyV.slice().reverse().map(function(v){

function abrirEditarFP(fbkey){
  var v=ventas.find(function(x){return x._fbkey===fbkey;});
  if(!v){alert('Venta no encontrada.');return;}
  var esMixto=v.pagos&&v.pagos.length>1;
  var fpOpts=FPAGO.map(function(f){return'<option value="'+f.id+'"'+(f.id===v.fp?' selected':'')+'>'+f.emoji+' '+f.label+'</option>';}).join('');
  var actual;
  if(esMixto){
    actual=v.pagos.map(function(p){var ff=FPAGO.find(function(x){return x.id===p.fp;});return (ff?ff.emoji+' '+ff.label:p.fp)+': '+fmt(p.monto);}).join('<br>');
  } else {
    var f=FPAGO.find(function(x){return x.id===v.fp;});
    actual=(f?f.emoji+' '+f.label:v.fp);
  }
  modal1('<div style="font-weight:800;font-size:16px;margin-bottom:4px">✏️ Corregir forma de pago</div>'
    +'<div style="color:var(--muted);font-size:13px;margin-bottom:12px">'+esc(v.mesa||'')+' · '+fmt(v.total)+'</div>'
    +'<div style="background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:12px">'
      +'<div style="color:var(--muted);font-size:11px">Forma de pago actual:</div>'
      +'<div style="font-size:13px;font-weight:700;color:var(--accent);margin-top:2px">'+actual+'</div>'
    +'</div>'
    +(esMixto?'<div style="background:#f5a62318;border:1px solid #f5a62333;border-radius:8px;padding:8px 12px;margin-bottom:12px;color:#f5a623;font-size:12px">⚠️ Este cobro fue mixto. Al corregir, se convertirá en un solo método por el total.</div>':'')
    +'<div style="margin-bottom:14px"><div style="color:var(--muted);font-size:11px;margin-bottom:3px">Nueva forma de pago</div>'
    +'<select class="inp" id="editfp-sel">'+fpOpts+'</select></div>'
    +'<button class="btn btn-green btn-full" onclick="guardarEditarFP(\''+fbkey+'\')">Guardar cambio</button>');
}

function guardarEditarFP(fbkey){
  var v=ventas.find(function(x){return x._fbkey===fbkey;});
  if(!v)return;
  var nuevoFp=(document.getElementById('editfp-sel')||{}).value;
  if(!nuevoFp)return;
  var f=FPAGO.find(function(x){return x.id===nuevoFp;});
  // Actualizar la venta: forma de pago única por el total
  v.fp=nuevoFp;
  v.fpLabel=f?f.emoji+' '+f.label:nuevoFp;
  v.pagos=[{fp:nuevoFp,label:(f?f.label:nuevoFp),monto:v.total}];
  v.editadoFP=true;
  v.editadoPor=usuarioActivo.nombre;
  v.editadoTs=Date.now();
  // Guardar en Firebase (sin el _fbkey interno)
  var copia={};Object.keys(v).forEach(function(k){if(k!=='_fbkey')copia[k]=v[k];});
  var r=ref('ventas/'+fbkey);
  if(r)r.set(copia);
  closeModal1();
  showToast('✅ Forma de pago corregida<br><span style="font-size:12px;opacity:.85">'+esc(v.mesa||'')+' → '+(f?f.label:nuevoFp)+'</span>','#22c55e');
  render();
}

function rankingConsumoSocios(){
  if(!consumoSocios.length)return'<div style="color:var(--dim);text-align:center;padding:14px;font-size:13px">Sin consumo de socios registrado</div>';
  // Agrupar por socio y producto
  var porSocio={};
  consumoSocios.forEach(function(c){
    var soc=c.socio||'?';
    if(!porSocio[soc])porSocio[soc]={total:0,prods:{}};
    (c.items||[]).forEach(function(it){
      var nombre=it.nombre||'?';
      var key=nombre+(it.cubeta?'_cub':'');
      var qty=it.cubeta?(it.qty||1)*5:(it.qty||1);
      if(!porSocio[soc].prods[key])porSocio[soc].prods[key]={nombre:nombre+(it.cubeta?' 🪣':''),emoji:it.emoji||'📦',qty:0,total:0};
      porSocio[soc].prods[key].qty+=qty;
      porSocio[soc].prods[key].total+=(it.precioSocio||0)*(it.qty||1);
    });
    porSocio[soc].total+=c.total||0;
  });

  return Object.keys(porSocio).map(function(soc){
    var data=porSocio[soc];
    var color=soc==='CARLOS'?'#38bdf8':(soc==='JAVIER'?'#a855f7':'#f5a623');
    var ranking=Object.values(data.prods).sort(function(a,b){return b.qty-a.qty;});
    var totalUnid=ranking.reduce(function(a,p){return a+p.qty;},0);
    return'<div style="margin-bottom:16px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;background:'+color+'18;border:1px solid '+color+'33;border-radius:8px;padding:8px 12px;margin-bottom:8px">'
        +'<span style="color:'+color+';font-weight:800;font-size:14px">👤 '+esc(soc)+'</span>'
        +'<span style="color:'+color+';font-weight:700;font-size:12px">'+totalUnid+' und · '+fmt(data.total)+'</span>'
      +'</div>'
      +ranking.map(function(p){
        return'<div class="res-row"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">'+p.emoji+'</span>'

function rankingTotalProductos(){
  var porProd={};
  ventas.forEach(function(v){
    var its=v.items?(Array.isArray(v.items)?v.items:Object.values(v.items)):[];
    its.forEach(function(it){
      var nombre,emoji,key,cat,qty=it.qty||1;
      if(it.isCustom){return;}
      if(it.isCombo){nombre=it.comboNombre||'Combo';emoji='🎁';cat='🎁 Combos';key='combo_'+nombre;}
      else if(it.isCubetazoMix){
        (it.cubMixDetalle||[]).forEach(function(dd){
          var pp=menu.find(function(m){return Number(m.id)===Number(dd.prodId);});
          var cat2=pp?pp.cat:'Cerveza';
          var k='p_'+dd.nombre;
          if(!porProd[k])porProd[k]={nombre:dd.nombre,emoji:dd.emoji||'🍺',cat:cat2,qty:0,total:0};
          porProd[k].qty+=dd.cantidad*qty;
        });
        return;
      }
      else{
        var p=menu.find(function(m){return Number(m.id)===Number(it.pid);});
        nombre=(p?p.nombre:(it.nombre||'?'))+(it.varianteNombre?' ('+it.varianteNombre+')':'');
        emoji=p?p.emoji:'📦';
        cat=p?p.cat:'Otros';
        if(it.cubeta){qty=(it.qty||1)*5;}
        key='p_'+nombre;
      }
      if(!porProd[key])porProd[key]={nombre:nombre,emoji:emoji,cat:cat||'Otros',qty:0,total:0};
      porProd[key].qty+=qty;
      porProd[key].total+=precioItem(it)*(it.qty||1);
    });
  });
  var lista=Object.values(porProd);
  if(!lista.length)return'<div style="color:var(--dim);text-align:center;padding:14px;font-size:13px">Sin ventas registradas</div>';
  var totalUnidades=lista.reduce(function(a,p){return a+p.qty;},0);

  lista.forEach(function(p){
    var c=p.cat||'Otros';

    porCat[c].prods.push(p);
    porCat[c].qty+=p.qty;
    porCat[c].total+=p.total;
  });
  // Ordenar categorías por unidades, y productos dentro de cada una
  var cats=Object.values(porCat).sort(function(a,b){return b.qty-a.qty;});
  var emojiCat=(typeof catEmojis!=='undefined')?catEmojis:{};

  return'<input id="busca-prod" oninput="filtrarRankingProd(this.value)" placeholder="🔍 Buscar producto..." class="inp" style="margin-bottom:10px"/>'
    +'<div style="display:flex;justify-content:space-between;padding:6px 10px;background:var(--card2);border-radius:8px;margin-bottom:8px"><span style="color:var(--muted);font-size:11px">'+lista.length+' productos · '+totalUnidades+' unidades vendidas</span></div>'
    +'<div id="ranking-prod-list">'
    +cats.map(function(c){
      var prods=c.prods.sort(function(a,b){return b.qty-a.qty;});
      return'<div class="rank-cat-group" data-cat="'+esc((c.cat||'').toLowerCase())+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;background:var(--accent)18;border-radius:7px;padding:7px 12px;margin:10px 0 6px">'
          +'<span style="color:var(--accent);font-weight:800;font-size:13px">'+(emojiCat[c.cat]?emojiCat[c.cat]+' ':'')+esc(c.cat)+'</span>'
          +'<span style="color:var(--accent);font-weight:700;font-size:12px">'+c.qty+' und</span>'
        +'</div>'
        +prods.map(function(p){
          return'<div class="res-row rank-prod-item" data-nombre="'+esc(p.nombre.toLowerCase())+'" data-cat="'+esc((c.cat||'').toLowerCase())+'">'
            +'<div style="display:flex;align-items:center;gap:8px;padding-left:6px"><span style="font-size:16px">'+p.emoji+'</span>'

            +'<div style="text-align:right"><div style="color:var(--text);font-weight:900;font-size:16px">'+p.qty+'</div><div style="color:var(--muted);font-size:9px">und</div></div>'

function filtrarRankingProd(q){
  q=(q||'').toLowerCase();
  var items=document.querySelectorAll('.rank-prod-item');
  items.forEach(function(el){
    var n=el.getAttribute('data-nombre')||'';
    el.style.display=n.indexOf(q)>=0?'':'none';

function confirmarCredito(total){
  var mesa=mesaActiva;
  if(!mesa)return;
  var ped=pedidos[mesa.id]||[];
  var clienteSel=(document.getElementById('cred-cliente')||{}).value||'';
  var nuevoNombre=((document.getElementById('cred-nuevo')||{}).value||'').trim();
  var clienteId, clienteNombre;

  if(nuevoNombre){
    clienteId='cli'+Date.now();
    clienteNombre=nuevoNombre;
    var nc={id:clienteId,nombre:nuevoNombre,activo:true,ts:Date.now()};
    clientesCredito.push(nc);
    var rc=ref('clientesCredito');if(rc)rc.push(nc);else fbSet('clientesCredito',clientesCredito);
  } else if(clienteSel){
    clienteId=clienteSel;
    var c=clientesCredito.find(function(x){return x.id===clienteSel;});
    clienteNombre=c?c.nombre:'Cliente';
  } else {
    alert('Selecciona o crea un cliente.');return;
  }

  var deuda={
    id:'deu'+Date.now(),ts:Date.now(),
    clienteId:clienteId,clienteNombre:clienteNombre,
    mesa:mesa.nombre||('Mesa '+mesa.num),
    items:JSON.parse(JSON.stringify(ped)),
    total:total,pagado:0,pagos:[],
    uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre
  };
  deudasCredito.push(deuda);
  var rd=ref('deudasCredito');if(rd)rd.push(deuda);else fbSet('deudasCredito',deudasCredito);

  // El inventario YA se descontó al agregar a la mesa, así que NO se toca aquí.
  // NO se registra venta (no afecta caja/cierre) hasta que el cliente pague.

  // Liberar mesa
  var r=ref('pedidos/'+mesa.id);if(r)r.set(null);
  delete pedidos[mesa.id];
  if(descuentos[mesa.id])delete descuentos[mesa.id];
  if(abonosMesa[mesa.id]){delete abonosMesa[mesa.id];fbSet('abonosMesa',abonosMesa);}
  mesaActiva=null;
  closeModal2();closeModal1();
  showToast('📒 Fiado registrado<br><span style="font-size:12px;opacity:.85">'+esc(clienteNombre)+' · '+fmt(total)+'</span>','#f5a623');
  render();
}

function agregarRappiItem(pid){
  var p=menu.find(function(m){return Number(m.id)===Number(pid);});

  if(idx>=0)_rappiPedido[idx].qty++;
  else _rappiPedido.push({pid:pid,qty:1,valor:p.precio||0,nombre:p.nombre});
  render();
}

function quitarRappiItem(idx){

}

function registrarVentaRappi(){

  _rappiPedido.forEach(function(it){

  var venta={id:'rap'+Date.now(),ts:Date.now(),
    items:JSON.parse(JSON.stringify(_rappiPedido)),total:total,

function cerrarRappi(){
  var total=ventasRappi.reduce(function(a,v){return a+(v.total||0);},0);
  var nVentas=ventasRappi.length;
  if(total<=0){alert('No hay ventas Rappi para cerrar.');return;}
  if(!confirm('¿Cerrar la cuenta de Rappi?\n\nTotal: '+fmt(total)+' ('+nVentas+' ventas)\n\nSe guarda en el histórico de cierres y la cuenta vuelve a 0. El inventario no se afecta.'))return;
  // Guardar cierre con resumen de productos
  var porProd={};
  ventasRappi.forEach(function(v){
    var its=v.items?(Array.isArray(v.items)?v.items:Object.values(v.items)):[];
    its.forEach(function(it){
      var p=menu.find(function(m){return Number(m.id)===Number(it.pid);});
      var nombre=p?p.nombre:(it.nombre||'?');
      if(!porProd[nombre])porProd[nombre]={nombre:nombre,qty:0};
      porProd[nombre].qty+=it.qty;
    });
  });
  var cierre={id:'cr'+Date.now(),ts:Date.now(),total:total,nVentas:nVentas,
    productos:Object.values(porProd),
    desde:ventasRappi.length?Math.min.apply(null,ventasRappi.map(function(v){return v.ts;})):Date.now(),
    hasta:Date.now(),
    uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre};
  var r=ref('cierresRappi');if(r)r.push(cierre);else fbSet('cierresRappi',cierresRappi.concat([cierre]));
  // Resetear ventas Rappi
  ventasRappi=[];
  var rv=ref('ventasRappi');if(rv)rv.set(null);else fbSet('ventasRappi',null);
  showToast('🔒 Cuenta Rappi cerrada<br><span style="font-size:12px;opacity:.85">'+fmt(total)+' · guardado en histórico</span>','#FF6B00');
  render();
}

function _sanLunes(offset){
  // Devuelve el lunes de la semana con el offset dado
  var d=new Date();
  d.setDate(d.getDate()+offset*7);
  var day=d.getDay();  // 0=dom
  var diff=(day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}
function _fechaKey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function _semanaKey(lunes){return _fechaKey(lunes);}
// Lunes (Date) a partir de una semanaKey 'YYYY-MM-DD'
function _lunesDeSemKey(semKey){var p=String(semKey).split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
// semanaKey desplazada n semanas
function _semKeyMas(semKey,n){var d=_lunesDeSemKey(semKey);d.setDate(d.getDate()+7*n);return _fechaKey(d);}
// Calcula el saldo de la semana de un empleado (ganado, préstamos, pagos, ajustes traídos)
function calcSaldoSemana(empId,semKey){
  var emp=empleados.find(function(e){return e.id===empId;});
  var diario=emp?(parseInt(emp.pagoDiario)||0):0;
  var lunes=_lunesDeSemKey(semKey);
  var ganado=0;
  for(var i=0;i<7;i++){var d=new Date(lunes);d.setDate(d.getDate()+i);var rec=asistenciaEmp[empId+'_'+_fechaKey(d)];if(rec)ganado+=(typeof rec==='number')?rec:diario;}
  var prest=movEmpleados.filter(function(m){return m.empId===empId&&m.tipo==='prestamo'&&!m.largoPlazo&&m.semanaKey===semKey;}).reduce(function(s,m){return s+(m.valor||0);},0);
  var pagado=movEmpleados.filter(function(m){return m.empId===empId&&m.tipo==='salario'&&m.semanaKey===semKey;}).reduce(function(s,m){return s+(m.valor||0);},0);
  var ajuste=movEmpleados.filter(function(m){return m.empId===empId&&m.tipo==='ajuste'&&m.semanaKey===semKey;}).reduce(function(s,m){return s+(m.valor||0);},0);
  var neto=ganado-prest+ajuste;
  return {ganado:ganado,prest:prest,pagado:pagado,ajuste:ajuste,neto:neto,saldo:neto-pagado};
}

function diligenciarSaneamientoTodo(){
  if(!usuarioActivo||usuarioActivo.rol!=='admin'){alert('Solo el administrador.');return;}
  var lunes=_sanLunes(_sanSemanaOffset);
  var fechas=[];for(var i=0;i<7;i++){var d=new Date(lunes);d.setDate(d.getDate()+i);fechas.push(d);}
  var semKey=_semanaKey(lunes);
  var rango=lunes.getDate()+'/'+(lunes.getMonth()+1)+' al '+fechas[6].getDate()+'/'+(fechas[6].getMonth()+1);
  if(!confirm('¿Marcar como COMPLETO todo el saneamiento de la semana ('+rango+')?\n\nSe marcarán todas las áreas diarias (sin fechas futuras) y todas las tareas semanales. Quedará registrado a tu nombre.'))return;
  var hoy=new Date();
  function horaDe(d){
    // Si el día ya pasó, usar una hora típica de cierre; si es hoy, la hora actual
    var base=new Date(d);
    if(_fechaKey(d)===_fechaKey(hoy)){base=hoy;}
    else{base.setHours(23,0,0,0);}
    return ('0'+base.getHours()).slice(-2)+':'+('0'+base.getMinutes()).slice(-2);
  }
  // Diario: todas las áreas en los días que NO son futuros
  SAN_AREAS.forEach(function(a){
    fechas.forEach(function(d){
      if(d>hoy)return;  // no marcar días futuros
      var key=_fechaKey(d)+'_'+a.id;
      if(!(saneamientoChecks[key]&&saneamientoChecks[key].check)){
        saneamientoChecks[key]={check:true,uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre,hora:horaDe(d),ts:Date.now()};
      }
    });
  });
  // Semanal: todas las tareas
  SAN_SEMANAL.forEach(function(s){
    var key=semKey+'_'+s.id;
    if(!(saneamientoSemanal[key]&&saneamientoSemanal[key].check)){
      saneamientoSemanal[key]={check:true,uid:usuarioActivo.id,uidNombre:usuarioActivo.nombre,hora:horaDe(hoy),ts:Date.now()};
    }
  });
  fbSet('saneamientoChecks',saneamientoChecks);
  fbSet('saneamientoSemanal',saneamientoSemanal);
  showToast('✅ Saneamiento de la semana diligenciado completo','#22c55e');
  render();
}

function renderSaneamiento(){

  var domingo=fechas[6];
  var rangoLabel=lunes.getDate()+'/'+(lunes.getMonth()+1)+' al '+domingo.getDate()+'/'+(domingo.getMonth()+1)+'/'+domingo.getFullYear();
  var semKey=_semanaKey(lunes);

  // Grid diario: filas=áreas, columnas=días
