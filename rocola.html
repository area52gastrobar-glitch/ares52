<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rocola · {nombre}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--verde:var(--t-s2);--morado:var(--t-p3);--cian:var(--t-c3);--rojo:#ff3b5c;--tinta:var(--t-tx)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--t-b0);color:var(--tinta);min-height:100vh;background-image:radial-gradient(ellipse at 15% 5%,rgba(var(--t-p3-rgb),.16) 0%,transparent 50%),radial-gradient(ellipse at 85% 95%,rgba(var(--t-c3-rgb),.10) 0%,transparent 50%),radial-gradient(ellipse at 70% 30%,rgba(var(--t-s2-rgb),.05) 0%,transparent 45%)}
/* Cielo estrellado */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1px 1px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 34% 68%,#9ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 76% 44%,var(--t-l) 50%,transparent 51%),radial-gradient(1px 1px at 89% 78%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 22% 88%,#aef 50%,transparent 51%),radial-gradient(1px 1px at 45% 35%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 66% 92%,#bfffb3 50%,transparent 51%),radial-gradient(1px 1px at 5% 55%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 93% 15%,#fff 50%,transparent 51%);opacity:.7;animation:titilar 4s ease-in-out infinite alternate}
@keyframes titilar{from{opacity:.4}to{opacity:.85}}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px;position:relative;z-index:1}
/* OVNI con rayo tractor sobre el logo */
.ovni{position:relative;text-align:center;height:54px;margin-top:4px}
.ovni .nave{font-size:38px;display:inline-block;animation:flotar 3.5s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(var(--t-c3-rgb),.8))}
@keyframes flotar{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.ovni::after{content:'';position:absolute;left:50%;top:40px;transform:translateX(-50%);width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-top:0;border-bottom:64px solid rgba(var(--t-s2-rgb),.14);filter:blur(1px);animation:rayo 2.2s ease-in-out infinite alternate}
@keyframes rayo{from{opacity:.4}to{opacity:1}}
.logo{display:block;width:90px;height:90px;border-radius:50%;margin:6px auto 8px;object-fit:cover;border:2px solid var(--verde);box-shadow:0 0 22px rgba(var(--t-s2-rgb),.55),0 0 60px rgba(var(--t-p3-rgb),.25);position:relative;z-index:1}
h1{text-align:center;font-family:'Orbitron',sans-serif;font-size:21px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--verde),var(--cian),var(--morado));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(var(--t-s2-rgb),.5))}
.sub{text-align:center;color:#7fe8a0;font-size:11px;letter-spacing:4px;text-transform:uppercase;margin-bottom:20px;text-shadow:0 0 8px rgba(var(--t-s2-rgb),.4)}
.card{background:rgba(var(--t-b2-rgb),.72);border:1px solid rgba(var(--t-p3-rgb),.35);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 0 18px rgba(var(--t-p3-rgb),.12),inset 0 0 30px rgba(var(--t-p3-rgb),.04);backdrop-filter:blur(3px)}
.label{color:var(--t-l);font-size:12px;margin-bottom:6px;font-weight:600}
.inp{width:100%;background:rgba(var(--t-b0-rgb),.6);border:1px solid rgba(var(--t-c3-rgb),.25);border-radius:12px;padding:13px 14px;color:var(--tinta);font-size:16px;margin-bottom:12px}
.inp:focus{outline:none;border-color:var(--verde);box-shadow:0 0 12px rgba(var(--t-s2-rgb),.35)}
.inp::placeholder{color:#5d5480}
select.inp{color:var(--tinta)}select.inp option{background:var(--t-b1);color:#fff}
.btn{width:100%;background:linear-gradient(90deg,var(--verde),var(--cian));color:#02140a;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.5px;box-shadow:0 0 16px rgba(var(--t-s2-rgb),.45)}
.btn:active{transform:scale(.98);box-shadow:0 0 26px rgba(var(--t-s2-rgb),.7)}
.btn:disabled{opacity:.5;box-shadow:none}
.qtitle{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:800;color:var(--verde);margin:22px 0 12px;letter-spacing:2px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;text-shadow:0 0 10px rgba(var(--t-s2-rgb),.5)}
.song{background:rgba(var(--t-b2-rgb),.65);border:1px solid rgba(var(--t-c3-rgb),.18);border-radius:13px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.song .num{width:26px;height:26px;border-radius:50%;background:rgba(var(--t-s2-rgb),.14);color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;border:1px solid rgba(var(--t-s2-rgb),.35)}
.song .info{flex:1;min-width:0}
.song .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .ar{font-size:12px;color:var(--t-mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--t-b1);border:2px solid var(--verde);color:#fff;padding:13px 22px;border-radius:14px;font-weight:700;z-index:999;transition:transform .35s;box-shadow:0 0 30px rgba(var(--t-s2-rgb),.4);text-align:center;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.staff-link{text-align:center;margin-top:24px}
.staff-link button{background:none;border:none;color:#4a3f70;font-size:11px;cursor:pointer;text-decoration:underline}
.played{opacity:.4}.played .nm{text-decoration:line-through}
.badge-g{background:rgba(var(--t-p3-rgb),.18);color:var(--t-l);font-size:10px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid rgba(var(--t-p3-rgb),.4)}
/* resultados búsqueda */
.result{display:flex;gap:10px;align-items:center;background:rgba(var(--t-b2-rgb),.7);border:1px solid rgba(var(--t-c3-rgb),.2);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.result:active{background:rgba(var(--t-s2-rgb),.12);border-color:var(--verde);box-shadow:0 0 12px rgba(var(--t-s2-rgb),.35)}
.result img{width:80px;height:45px;border-radius:7px;object-fit:cover;flex-shrink:0;background:#000}
.result .rt{font-size:13px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result .rc{font-size:11px;color:var(--t-mu);margin-top:2px}
.spin{text-align:center;color:var(--t-mu);padding:18px;font-size:13px}
@media (prefers-reduced-motion:reduce){body::before,.ovni .nave,.ovni::after{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" data-m-src="logo" alt="">
  <div class="ovni"><span class="nave" data-m="emoji"></span></div>
  <h1>ROCOLA <span data-m="nombre"></span></h1>
  <div class="sub"><span data-m="emoji2"></span> Pide tu canción desde tu mesa<span id="mesaTxt"></span></div>

  <div class="card">
    <div class="label">🔍 Busca tu canción</div>
    <input class="inp" id="busqueda" placeholder="Ej: Bad Bunny Tití me preguntó" maxlength="90" onkeydown="if(event.key==='Enter')buscar()">
    <div class="label">🎸 Género <span style="color:#ff3b5c;font-weight:700">(obligatorio)</span></div>
    <select class="inp" id="genero">
      <option value="" selected>🎵 Elige el género…</option>
      <option value="Reggaetón">🔥 Reggaetón / Urbano</option>
      <option value="Salsa">💃 Salsa</option>
      <option value="Vallenato">🪗 Vallenato</option>
      <option value="Crossover">🎉 Crossover / Fiesta</option>
      <option value="Pop">🎤 Pop</option>
      <option value="Rock">🎸 Rock</option>
      <option value="Electrónica">🎧 Electrónica</option>
      <option value="Popular">🎶 Popular / Despecho</option>
      <option value="Otro">🎵 Otro</option>
    </select>
    <div class="label">🙋 ¿Quién la pide? <span style="color:#ff3b5c;font-weight:700">(obligatorio)</span></div>
    <input class="inp" id="nombre" placeholder="Tu nombre o el de tu mesa" maxlength="40">
    <button class="btn" id="btnBuscar" onclick="buscar()">🔍 Buscar en YouTube</button>
    <div id="resultados"></div>
  </div>

  <div class="qtitle"><span>🎧 En la fila</span><span style="display:flex;align-items:center;gap:10px"><button onclick="verHistorial()" style="background:rgba(var(--t-s2-rgb),.14);color:var(--t-s2);border:1px solid rgba(var(--t-s2-rgb),.35);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">🕐 Ya sonó</button><span id="contador" style="color:#888;font-weight:400;font-size:12px"></span></span></div>
  <div id="lista"><div class="empty spin">Cargando...</div></div>

  <div class="staff-link"><button onclick="toggleStaff()">· staff ·</button></div>
</div>
<div id="histPanel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;padding:20px;overflow-y:auto" onclick="if(event.target===this)cerrarHistorial()">
  <div style="max-width:520px;margin:0 auto;background:var(--t-b1);border:1px solid rgba(var(--t-p3-rgb),.45);border-radius:16px;padding:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:18px;font-weight:800;color:var(--t-l)">🕐 Lo que ya sonó</div>
      <button onclick="cerrarHistorial()" style="background:rgba(255,59,92,.12);color:#ff3b5c;border:none;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer">✕</button>
    </div>
    <div style="color:var(--t-l);font-size:12px;margin-bottom:12px">Últimas 24 horas · las de menos de 1 hora y media no se pueden volver a pedir</div>
    <div id="histLista"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="negocio.js?v=2026-10-05k"></script>
<script src="comun.js?v=2026-10-05k"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var firebaseConfig=NEGOCIO.firebase;
firebase.initializeApp(firebaseConfig);
try{firebase.auth();}catch(e){}   // si este navegador es de un equipo autorizado, la base lo reconoce (modo staff)
var db=firebase.database();
// Mesa desde la que piden (viene en el QR de la mesa) y nombre recordado en este celular
var MESA=(function(){var m=(location.search.match(/[?&]mesa=([^&#]+)/)||[])[1];try{if(m)sessionStorage.setItem(LSK('mesa'),decodeURIComponent(m));return sessionStorage.getItem(LSK('mesa'))||'';}catch(e){return m?decodeURIComponent(m):'';}})().replace(/[^0-9A-Za-z -]/g,'').slice(0,6);
document.addEventListener('DOMContentLoaded',function(){
  var t=document.getElementById('mesaTxt');if(t&&MESA)t.textContent=' · Mesa '+MESA;
  try{var n=localStorage.getItem(LSK('nombreCliente'));var i=document.getElementById('nombre');if(n&&i&&!i.value)i.value=n;}catch(e){}
});
var STAFF_PIN=String(NEGOCIO.rocolaPinStaff||"");
var staffMode=false, pedidos=[], historial=[], YT_KEY='';
var YT_KEYS=[], _keyIdx=0;
function setActiveKey(){YT_KEY=YT_KEYS[_keyIdx]||'';}
function rotarKey(){if(_keyIdx<YT_KEYS.length-1){_keyIdx++;setActiveKey();return true;}return false;}

db.ref('config/ytkeys').on('value',function(s){
  var keys=s.val();
  if(keys&&(Array.isArray(keys)?keys.length:Object.keys(keys).length)){
    YT_KEYS=Array.isArray(keys)?keys:Object.values(keys);_keyIdx=0;setActiveKey();
  }
});
db.ref('config/ytkey').on('value',function(s){
  // compatibilidad: si no hay arreglo de llaves, usar la única
  if(!YT_KEYS.length){var k=s.val()||'';YT_KEYS=k?[k]:[];_keyIdx=0;setActiveKey();}
});

function toast(msg,color){var t=document.getElementById('toast');t.style.borderColor=color||'var(--t-s2)';t.innerHTML=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2400);}


// Autodetección de género por palabras clave en título y canal (coincidencia por PALABRA completa)
function detectarGenero(titulo,canal){
  var t=' '+((titulo||'')+' '+(canal||'')).toLowerCase()+' ';
  t=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  t=t.replace(/[^a-z0-9ñ]+/g,' ');  // separar por palabras: evita que "manana" contenga "mana", "banda" contenga "band", etc.
  function hay(k){return t.indexOf(' '+k+' ')>=0;}
  var reglas=[
    {g:'Vallenato',k:['vallenato','vallenatos','vallenata','acordeon','diomedes','diomedes diaz','silvestre dangond','jorge celedon','binomio','binomio de oro','poncho zuleta','los betos','penalozas','ivan villazon','peter manjarres','martin elias','churo diaz','kaleth morales','luifer cuello','felipe pelaez','los diablitos','miguel morales','rafael orozco','jean carlos centeno','omar geles','elder dayan','ana del castillo']},
    {g:'Salsa',k:['salsa','grupo niche','niche','guayacan','marc anthony','willie colon','hector lavoe','frankie ruiz','jerry rivera','la india','oscar de leon','salsa choke','gilberto santa rosa','tito rojas','salsa romantica','fruko','joe arroyo','el gran combo','maelo ruiz','eddie santiago','rey ruiz','tito nieves','sonora poncena','ismael rivera','richie ray','yuri buenaventura']},
    {g:'Reggaetón',k:['reggaeton','regueton','reguetton','perreo','bad bunny','feid','ferxxo','karol g','j balvin','maluma','daddy yankee','ozuna','anuel','anuel aa','myke towers','rauw alejandro','blessd','ryan castro','sech','arcangel','wisin','yandel','jhayco','jhay cortez','nicky jam','farruko','don omar','tego calderon','plan b','zion','lennox','dekko','beele','urbano','dembow']},
    {g:'Popular',k:['popular','despecho','despechada','arelys henao','arelys','jhonny rivera','jhon alex castano','luis alberto posada','dario gomez','el charrito','el charrito negro','pipe bueno','yeison jimenez','jessi uribe','paola jara','musica popular','cantina','ranchera','rancheras','vicente fernandez','alejandro fernandez','christian nodal','alacranes','giovanny ayala','fernando burbano','luisito munoz','antonio aguilar','corridos','banda ms']},
    {g:'Electrónica',k:['electronica','edm','techno','tiesto','david guetta','calvin harris','progressive house','electro house','deep house','martin garrix','avicii','alok','afro house','guaracha','aleteo','zapateo','skrillex','hardwell','armin van buuren','tomorrowland','bass house','big room']},
    {g:'Rock',k:['rock','metal','soda stereo','heroes del silencio','guns n roses','metallica','nirvana','queen','acdc','ac dc','foo fighters','enanitos verdes','cerati','caifanes','mana','la ley','bon jovi','aerosmith','kiss','led zeppelin','pink floyd','hombres g','vilma palma','prisioneros','los prisioneros','molotov','aterciopelados','kraken','la pestilencia']},
    {g:'Crossover',k:['crossover','mix fiesta','cumbia','merengue','la makina','tropical','sonora','sonora dinamita','aventura','romeo santos','bachata','elvis crespo','fiesta mix','rumba','olga tanon','juan luis guerra','oro solido','los hermanos rosario','sergio vargas','pastor lopez','rodolfo aicardi','los graduados','lisandro meza','tono rosario','merengues','cumbias']},
    {g:'Pop',k:['pop','shakira','manu chao','juanes','sebastian yatra','camilo','morat','reik','sin bandera','luis fonsi','carlos vives','fonseca','justin bieber','dua lipa','taylor swift','ed sheeran','bruno mars','coldplay','adele','the weeknd','harry styles','billie eilish','miley cyrus','camila cabello','ricky martin','chayanne','cnco','piso 21','greeicy','mau y ricky']}
  ];
  // Pasada 1: artistas y frases (2+ palabras) — señal fuerte
  for(var i=0;i<reglas.length;i++){for(var j=0;j<reglas[i].k.length;j++){var k=reglas[i].k[j];if(k.indexOf(' ')>=0&&hay(k))return reglas[i].g;}}
  // Pasada 2: palabras sueltas
  for(var i=0;i<reglas.length;i++){for(var j=0;j<reglas[i].k.length;j++){var k=reglas[i].k[j];if(k.indexOf(' ')<0&&hay(k))return reglas[i].g;}}
  return 'Otro';
}

// ── Caché de búsquedas para ahorrar cuota de YouTube ──
function cacheGet(q){
  try{
    var raw=localStorage.getItem('a52_busqcache');
    if(!raw)return null;
    var obj=JSON.parse(raw);
    var e=obj[q.toLowerCase()];
    if(e&&(Date.now()-e.ts)<7*24*3600*1000)return e.items;  // válido 7 días
  }catch(err){}
  return null;
}
function cacheSet(q,items){
  try{
    var raw=localStorage.getItem('a52_busqcache');
    var obj=raw?JSON.parse(raw):{};
    obj[q.toLowerCase()]={items:items,ts:Date.now()};
    // limitar tamaño del caché
    var keys=Object.keys(obj);
    if(keys.length>120){keys.slice(0,keys.length-120).forEach(function(k){delete obj[k];});}
    localStorage.setItem('a52_busqcache',JSON.stringify(obj));
  }catch(err){}
}
function pintarResultados(items){
  var cont=document.getElementById('resultados');
  if(!items||!items.length){cont.innerHTML='<div class="spin">Sin resultados. Prueba con otro nombre.</div>';return;}
  cont.innerHTML='<div class="label" style="margin-top:6px">👇 Toca la correcta para pedirla</div>'+items.map(function(it){
    return'<div class="result" onclick="pedir(\''+it.v+'\',\''+encodeURIComponent(it.titulo)+'\',\''+encodeURIComponent(it.canal)+'\')">'
      +'<img src="'+it.thumb+'">'
      +'<div><div class="rt">'+esc(it.titulo)+'</div><div class="rc">'+esc(it.canal)+'</div></div>'
    +'</div>';
  }).join('');
}

function buscar(){
  var q=document.getElementById('busqueda').value.trim();
  if(!q){toast('✍️ Escribe el nombre de la canción','#ff3b5c');return;}
  if(!YT_KEY){toast('⚠️ La rocola no está configurada. Avisa al staff.','#ff3b5c');return;}
  var cont=document.getElementById('resultados');
  // 1) Si ya se buscó lo mismo, usar caché (no gasta cuota)
  var cached=cacheGet(q);
  if(cached){pintarResultados(cached);return;}
  cont.innerHTML='<div class="spin">🔎 Buscando...</div>';
  var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=moderate&maxResults=6&q='+encodeURIComponent(q+' música')+'&key='+YT_KEY;
  fetch(url).then(function(r){return r.json();}).then(function(data){
    if(data.error){
      var msg=(data.error.errors&&data.error.errors[0]&&data.error.errors[0].reason)||'error';
      if((msg==='rateLimitExceeded'||msg==='quotaExceeded')&&rotarKey()){setTimeout(buscar,300);return;}
      var extra=(msg==='rateLimitExceeded'||msg==='quotaExceeded')?'Se agotaron las búsquedas de hoy. Vuelve más tarde.':'Avisa al staff.';
      cont.innerHTML='<div class="spin" style="color:#ff3b5c">⚠️ '+extra+'</div>';return;
    }
    if(!data.items||!data.items.length){cont.innerHTML='<div class="spin">Sin resultados. Prueba con otro nombre.</div>';return;}
    var items=data.items.map(function(it){
      var sn=it.snippet;
      return {v:it.id.videoId,titulo:sn.title.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'"),canal:sn.channelTitle,thumb:sn.thumbnails.default.url};
    });
    cacheSet(q,items);  // guardar para no volver a gastar cuota
    pintarResultados(items);
  }).catch(function(){cont.innerHTML='<div class="spin">Error de búsqueda. Intenta de nuevo.</div>';});
}

function pedir(videoId,tituloEnc,canalEnc){
  // Género y nombre son OBLIGATORIOS
  var genero=document.getElementById('genero').value;
  if(!genero){toast('🎸 Elige el género antes de pedirla','#ff3b5c');document.getElementById('genero').focus();return;}
  var nombre=document.getElementById('nombre').value.trim();
  if(!nombre){toast('🙋 Escribe quién la pide','#ff3b5c');document.getElementById('nombre').focus();return;}
  var ultimo=parseInt(localStorage.getItem('a52_ultPedido')||'0');
  if(Date.now()-ultimo<20000){toast('⏳ Espera un momento antes de pedir otra','var(--t-p3)');return;}
  // No repetir la misma canción si ya se pidió o sonó en la última hora y media
  var VENTANA_REPETIR=90*60*1000;
  var reciente=pedidos.find(function(p){return p.videoId===videoId && (Date.now()-(p.ts||0))<VENTANA_REPETIR;})
             ||historial.find(function(p){return p.videoId===videoId && (Date.now()-(p.ts||0))<VENTANA_REPETIR;});
  if(reciente){
    var minsRest=Math.ceil((VENTANA_REPETIR-(Date.now()-reciente.ts))/60000);
    var txt=minsRest>60?(Math.floor(minsRest/60)+'h '+(minsRest%60)+'min'):(minsRest+' min');
    toast('🔁 Esa canción ya está en la lista o sonó hace poco.<br>Podrás pedirla de nuevo en '+txt,'var(--t-p3)');
    return;
  }
  var titulo=decodeURIComponent(tituloEnc), canal=decodeURIComponent(canalEnc);
  var pedido={cancion:titulo,artista:canal,genero:genero,nombre:nombre,videoId:videoId,ts:Date.now(),played:false};
  if(MESA)pedido.mesa=MESA;
  try{localStorage.setItem(LSK('nombreCliente'),nombre);}catch(e){}
  db.ref('musica').push(pedido).then(function(){
    localStorage.setItem('a52_ultPedido',Date.now());
    document.getElementById('busqueda').value='';
    document.getElementById('resultados').innerHTML='';
    toast('🎶 ¡Pedida! Pronto sonará');
  }).catch(function(){toast('❌ Error, intenta de nuevo','#ff3b5c');});
  // Guardar en el historial permanente (para el bloqueo de 1.5h aunque limpien la fila)
  db.ref('historialRocola').push({videoId:videoId,cancion:titulo,artista:canal,nombre:nombre,genero:genero,ts:Date.now()});
}

function toggleStaff(){
  if(staffMode){staffMode=false;render();return;}
  var pin=prompt('PIN de staff:');
  if(STAFF_PIN&&pin===STAFF_PIN){staffMode=true;toast('🔓 Modo staff','var(--t-s2)');render();}
  else if(pin!==null){toast('PIN incorrecto','#ff3b5c');}
}
// Marcar y borrar solo funciona en equipos autorizados (los que un administrador aprobó en el POS)
function staffNo(){toast('🔐 Este equipo no está autorizado.<br>Ábralo en el POS para pedir aprobación, o use la consola del DJ','#ff3b5c');}
function marcarSonada(k){db.ref('musica/'+k+'/played').set(true).catch(staffNo);}
function borrar(k){db.ref('musica/'+k).remove().catch(staffNo);}
function limpiarSonadas(){if(!confirm('¿Borrar las ya sonadas?'))return;var avisado=false;pedidos.forEach(function(p){if(p.played)db.ref('musica/'+p.key).remove().catch(function(){if(!avisado){avisado=true;staffNo();}});});}

function render(){
  var cont=document.getElementById('lista');
  var pend=pedidos.filter(function(p){return !p.played;});
  var son=pedidos.filter(function(p){return p.played;});
  document.getElementById('contador').textContent=pend.length+' en espera';
  if(!pedidos.length){cont.innerHTML='<div class="empty spin">🎵 Aún no hay canciones.<br>¡Sé el primero en pedir!</div>';return;}
  var html='';
  pend.forEach(function(p,i){
    html+='<div class="song"><div class="num">'+(i+1)+'</div>'
      +'<div class="info"><div class="nm">'+esc(p.cancion)+'</div>'
      +(p.artista?'<div class="ar">'+esc(p.artista)+'</div>':'')
      +'<div style="margin-top:3px">'+(p.genero?'<span class="badge-g">'+esc(p.genero)+'</span>':'')+((p.nombre||p.mesa)?' <span style="font-size:11px;color:var(--t-s2)">'+(p.mesa?'🪑 Mesa '+esc(String(p.mesa))+' · ':'')+'🙋 '+esc(p.nombre||'')+'</span>':'')+'</div></div>'
      +(staffMode?'<button class="num" style="background:rgba(var(--t-s2-rgb),.12);color:var(--t-s2);border:none;cursor:pointer" onclick="marcarSonada(\''+p.key+'\')">✓</button><button class="num" style="background:rgba(255,59,92,.12);color:#ff3b5c;border:none;cursor:pointer" onclick="borrar(\''+p.key+'\')">✕</button>':'')
    +'</div>';
  });
  if(staffMode&&son.length){
    html+='<div class="qtitle" style="margin-top:18px"><span style="color:#666">Ya sonaron ('+son.length+')</span><button onclick="limpiarSonadas()" style="background:rgba(255,59,92,.12);color:#ff3b5c;border:none;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer">🧹 Limpiar</button></div>';
    son.forEach(function(p){html+='<div class="song played"><div class="num">✓</div><div class="info"><div class="nm">'+esc(p.cancion)+'</div></div><button class="num" style="background:rgba(255,59,92,.12);color:#ff3b5c;border:none;cursor:pointer" onclick="borrar(\''+p.key+'\')">✕</button></div>';});
  }
  cont.innerHTML=html;
}
function verHistorial(){
  var cont=document.getElementById('histLista');
  if(!historial.length){
    cont.innerHTML='<div style="text-align:center;color:var(--t-l);padding:30px">Aún no ha sonado ninguna canción.</div>';
  } else {
    cont.innerHTML=historial.map(function(h){
      var mins=Math.floor((Date.now()-(h.ts||0))/60000);
      var hace=mins<60?(mins+' min'):(Math.floor(mins/60)+'h '+(mins%60)+'min');
      var bloqueada=(Date.now()-(h.ts||0))<2*60*60*1000;
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(var(--t-p3-rgb),.25)">'
        +'<div style="min-width:0"><div style="font-size:13px;color:var(--t-l);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(bloqueada?'🔒 ':'')+esc(h.cancion)+'</div>'
        +'<div style="font-size:11px;color:var(--t-l)">'+(h.artista?esc(h.artista)+' · ':'')+'hace '+hace+(h.nombre?' · 🙋 '+esc(h.nombre):'')+'</div></div>'
      +'</div>';
    }).join('');
  }
  document.getElementById('histPanel').style.display='block';
}
function cerrarHistorial(){document.getElementById('histPanel').style.display='none';}

function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

db.ref('musica').on('value',function(snap){
  var v=snap.val()||{};
  pedidos=Object.keys(v).map(function(k){var o=v[k];o.key=k;return o;}).sort(function(a,b){return a.ts-b.ts;});
  render();
});

// Historial permanente (no se borra al limpiar la fila)
db.ref('historialRocola').on('value',function(snap){
  var v=snap.val()||{};
  historial=Object.keys(v).map(function(k){var o=v[k];o.key=k;return o;}).sort(function(a,b){return b.ts-a.ts;});
  // Limpieza automática: borrar registros de más de 24 horas para no crecer sin límite
  var lim=Date.now()-24*60*60*1000;
  // (solo lo logra un equipo autorizado; en el celular de un cliente la base lo niega y no pasa nada)
  historial.filter(function(h){return (h.ts||0)<lim;}).forEach(function(h){db.ref('historialRocola/'+h.key).remove().catch(function(){});});
  historial=historial.filter(function(h){return (h.ts||0)>=lim;});
});
</script>
</body>
