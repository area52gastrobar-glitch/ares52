<script>
// ═══ Auto-detección de versiones nuevas (por CONTENIDO, no por ETag) ═══
// El ETag de GitHub Pages cambia entre nodos del CDN aunque el archivo sea el
// mismo, lo que causaba avisos falsos en bucle. Ahora se descarga solo el
// encabezado del archivo publicado y se compara el sello APP_BUILD embebido:
// el aviso aparece únicamente cuando el archivo publicado ES otro de verdad.
var APP_BUILD='2026-10-30';
(function(){
  var avisadoBuild=null;
  function leerBuildRemoto(cb){
    var url=location.href.split('#')[0].split('?')[0]+'?chk='+a52Ahora();
    fetch(url,{cache:'no-store',headers:{'Range':'bytes=0-6000'}}).then(function(r){return r.text();}).then(function(t){
      var m=t.match(/APP_BUILD='([^']+)'/);
      cb(m?m[1]:null);
    }).catch(function(){cb(null);});
  }
  function chequear(){
    leerBuildRemoto(function(remoto){
      if(!remoto||remoto===APP_BUILD)return;         // mismo archivo: silencio total
      if(avisadoBuild===remoto)return;               // ya avisado para esa versión
      var destino=location.href.split('#')[0].split('?')[0]+'?v='+encodeURIComponent(remoto);
      var logueado=window._usuarioActivoGlobal;
      if(!logueado){
        // En login: recargar solo, pero UNA vez por versión (evita bucles si el caché insiste)
        var ya='';try{ya=localStorage.getItem('_a52_autoReloadBuild')||'';}catch(e){}
        if(ya===remoto)return;
        try{localStorage.setItem('_a52_autoReloadBuild',remoto);}catch(e){}
        location.href=destino;return;
      }
      avisadoBuild=remoto;
      var viejo=document.getElementById('banner-update');if(viejo)viejo.remove();
      var b=document.createElement('div');
      b.id='banner-update';
      b.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;z-index:99999;background:#8B5CF6;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:inherit';
      b.innerHTML='<span style="font-size:13px;font-weight:700">'+NEGOCIO.emoji+' Hay una versión nueva de la app</span>'
        +'<button onclick="location.href=\''+destino+'\'" style="background:#fff;color:#8B5CF6;border:none;border-radius:9px;padding:9px 16px;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap">🔄 Actualizar</button>';
      document.body.appendChild(b);
    });
  }
  window.addEventListener('load',function(){
    var st=document.getElementById('ver-stamp');
    if(st)st.textContent='v'+APP_BUILD;
    setTimeout(chequear,20000);                 // primer chequeo a los 20s
    setInterval(chequear,10*60*1000);           // luego cada 10 minutos
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible')chequear();
    });
  });
})();
</script>
<script>
// Manifest generado en tiempo real (Android: instala como app con ícono y pantalla completa)
(function(){
  try{
    var base=location.href.split('#')[0].split('?')[0];
    var dir=base.slice(0,base.lastIndexOf('/')+1);
    var manifest={
      name:NEGOCIO.nombreCorto+(NEGOCIO.tipo?' '+NEGOCIO.tipo:''),short_name:NEGOCIO.nombreCorto,
      start_url:base,scope:dir,display:'standalone',
      background_color:'#0d0d16',theme_color:'#0d0d16',
      icons:[{src:dir+'marca-icono.png',sizes:'512x512',type:'image/png',purpose:'any'}]
    };
    var blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    var link=document.createElement('link');
    link.rel='manifest';link.href=URL.createObjectURL(blob);
    document.head.appendChild(link);
    var _mt=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(_mt)_mt.content=NEGOCIO.nombreCorto;
  }catch(e){}
})();
</script>
<script>
// Load external scripts dynamically so app works even if they fail (file:// mode)
function _loadScript(src, cb){
  var s=document.createElement('script');
  s.src=src;
  s.onload=function(){cb(true);};
  s.onerror=function(){console.warn('Could not load: '+src);cb(false);};
  document.head.appendChild(s);
}
window._fbReady=false;
window._xlsxReady=false;
// Load XLSX
_loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',function(ok){window._xlsxReady=ok;});
// Load Firebase (chain: app then database)
_loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',function(ok){
  if(!ok){window._fbReady=false;return;}
  // La identificación del equipo (auth) se carga antes que la base; si no carga, la base sigue como antes
  _loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js',function(){
  _loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js',function(ok2){
    if(!ok2){window._fbReady=false;return;}
    window._fbReady=true;
    // Init firebase now that scripts are loaded
    try{
      var cfg=NEGOCIO.firebase;   // la conexión de cada negocio está en negocio.js
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      // La base queda disponible para el POS solo cuando el equipo está autorizado (o las reglas siguen abiertas)
      var _dbTmp=firebase.database();
      window._a52Pendiente=true;
      A52Candado(_dbTmp,'usuarios',function(){
        window._db=_dbTmp;window._a52Pendiente=false;
        // If user is already logged in, start sync
        if(window._usuarioActivoGlobal) iniciarSync();
      });
    }catch(e){window._a52Pendiente=false;console.warn('Firebase init failed:',e.message);}
  });
  });
});
</script>
