<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{nombre} {tipo}</title>
<meta name="theme-color" content="#05030d"/>
<link rel="icon" type="image/png" href="marca-icono.png"/>
<link rel="apple-touch-icon" href="marca-icono.png"/>
<link rel="stylesheet" href="fuentes.css?v=2026-10-05h"/>
<script src="negocio.js?v=2026-10-05h"></script>
<script src="comun.js?v=2026-10-05h"></script>
<style>
/* Página de inicio: la fachada del negocio de noche. Arriba el letrero, en el centro la puerta
   principal (clientes) y a un lado la puerta de servicio (funcionarios). Los colores salen del tema. */
*{box-sizing:border-box}
html{background:rgb(var(--t-b0-rgb))}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.5;
  color:rgb(var(--t-tx-rgb));
  background:
    radial-gradient(1.2px 1.2px at 12% 9%,rgba(255,255,255,.75),transparent 60%),
    radial-gradient(1px 1px at 81% 6%,rgba(var(--t-s-rgb),.9),transparent 60%),
    radial-gradient(1.4px 1.4px at 63% 15%,rgba(var(--t-c-rgb),.8),transparent 60%),
    radial-gradient(1px 1px at 27% 21%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.3px 1.3px at 93% 24%,rgba(var(--t-p-rgb),.9),transparent 60%),
    radial-gradient(120% 55% at 50% 0%,rgba(var(--t-p-rgb),.20),transparent 62%),
    radial-gradient(90% 40% at 50% 100%,rgba(var(--t-s-rgb),.09),transparent 70%),
    rgb(var(--t-b0-rgb));
  overflow-x:hidden;
}
a{color:inherit}
.cielo{position:absolute;left:0;right:0;top:0;height:min(74vh,660px);overflow:hidden;pointer-events:none}
.muro{position:absolute;left:-30px;right:-30px;top:-30px;bottom:0;background-size:cover;background-position:center;opacity:.2;filter:blur(14px) saturate(.8);
  -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent);mask-image:linear-gradient(180deg,#000 30%,transparent);pointer-events:none}
.fachada{position:relative;max-width:980px;margin:0 auto;padding:clamp(34px,8vh,84px) 22px 44px;display:flex;flex-direction:column;align-items:center}

/* ── El letrero ── */
.letrero{
  margin:0;text-align:center;font-weight:400;
  font-family:var(--t-fd,'Tilt Neon'),'Tilt Neon','Figtree',sans-serif;
  font-size:clamp(3.3rem,15.5vw,8.2rem);line-height:.96;letter-spacing:.02em;text-wrap:balance;
  color:#fff;
  text-shadow:0 0 5px rgba(255,255,255,.75),0 0 16px rgba(var(--t-p-rgb),.95),0 0 44px rgba(var(--t-p-rgb),.75),0 0 96px rgba(var(--t-p-rgb),.5);
  animation:encender 2.1s linear 1 both;
}
@keyframes encender{
  0%{opacity:.08;text-shadow:none}
  7%{opacity:.9}
  9%{opacity:.15}
  16%{opacity:.95}
  19%{opacity:.3}
  23%{opacity:1}
  52%{opacity:1}
  55%{opacity:.55}
  58%,100%{opacity:1}
}
.que{margin:18px 0 0;font-size:1.22rem;font-weight:600;text-align:center;color:rgb(var(--t-s-rgb))}
.lema{margin:4px 0 0;text-align:center;color:rgba(var(--t-tx-rgb),.72);max-width:34ch}

/* ── Las dos puertas ── */
.puertas{display:grid;grid-template-columns:1fr;justify-items:center;gap:26px;margin-top:clamp(30px,6.5vh,60px);width:100%}
.puerta{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;
  width:min(78vw,300px);aspect-ratio:10/13.2;padding:0 22px 24px;
  border-radius:999px 999px 14px 14px;text-decoration:none;
  border:2px solid rgba(var(--t-p-rgb),.95);
  background:
    radial-gradient(95% 55% at 50% 100%,rgba(var(--t-s-rgb),.20),transparent 72%),
    linear-gradient(180deg,rgba(var(--t-p-rgb),.30),rgba(var(--t-b2-rgb),.92) 68%);
  box-shadow:0 0 0 7px rgb(var(--t-b0-rgb)),0 0 0 8px rgba(var(--t-p-rgb),.35),0 0 46px rgba(var(--t-p-rgb),.42),inset 0 0 54px rgba(var(--t-p-rgb),.24);
  transition:transform .25s ease,box-shadow .25s ease;
}
.puerta::after{content:'';position:absolute;left:6%;right:6%;bottom:-40px;height:40px;pointer-events:none;
  background:radial-gradient(50% 100% at 50% 0,rgba(var(--t-s-rgb),.38),transparent 72%);filter:blur(5px)}
.puerta:hover,.puerta:focus-visible{transform:translateY(-4px);
  box-shadow:0 0 0 7px rgb(var(--t-b0-rgb)),0 0 0 8px rgba(var(--t-p-rgb),.6),0 0 70px rgba(var(--t-p-rgb),.7),inset 0 0 70px rgba(var(--t-s-rgb),.22)}
.insignia{width:46%;aspect-ratio:1;border-radius:50%;object-fit:cover;margin:13% 0 auto;
  box-shadow:0 0 0 2px rgba(var(--t-o-rgb),.85),0 0 34px rgba(var(--t-o-rgb),.32)}
.p-t{font-size:1.55rem;font-weight:800;line-height:1.15}
.p-d{font-size:.93rem;text-align:center;line-height:1.35;color:rgba(var(--t-tx-rgb),.78)}
.p-b{margin-top:10px;padding:11px 34px;border-radius:999px;font-weight:800;background:rgb(var(--t-s-rgb));color:rgb(var(--t-b0-rgb))}

.servicio{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:min(78vw,300px);padding:14px 16px;border-radius:8px;text-decoration:none;
  border:1px solid rgba(var(--t-o-rgb),.45);
  background:linear-gradient(180deg,rgba(var(--t-b2-rgb),.9),rgba(var(--t-b1-rgb),.96));
  transition:border-color .2s ease,transform .2s ease;
}
.servicio:hover,.servicio:focus-visible{border-color:rgb(var(--t-o-rgb));transform:translateY(-2px)}
.placa{flex:none;border:1px solid rgba(var(--t-o-rgb),.75);color:rgb(var(--t-o-rgb));padding:4px 11px;border-radius:3px;font-size:.84rem;font-weight:800;letter-spacing:.03em}
.s-t{display:block;font-weight:800;line-height:1.2}
.s-d{display:block;font-size:.84rem;color:rgba(var(--t-tx-rgb),.66);line-height:1.3}
.s-txt{flex:1;text-align:right}
@media(min-width:660px){
  .puertas{grid-template-columns:1fr auto 1fr;align-items:end;gap:0 40px}
  .puerta{grid-column:2}
  .servicio{grid-column:3;justify-self:start;flex-direction:column;align-items:flex-start;justify-content:flex-end;width:158px;height:214px;padding:14px;border-radius:6px 6px 3px 3px}
  .servicio::before{content:'';position:absolute;right:13px;top:54%;width:9px;height:9px;border-radius:50%;background:rgb(var(--t-o-rgb));box-shadow:0 0 9px rgba(var(--t-o-rgb),.7)}
  .placa{margin-bottom:auto}
  .s-txt{text-align:left;flex:none}
}
a:focus-visible{outline:3px solid rgb(var(--t-s-rgb));outline-offset:5px}

/* ── Datos del negocio ── */
.datos{margin-top:clamp(64px,10vh,96px);width:100%;max-width:720px;display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid rgba(var(--t-tx-rgb),.14)}
.dato{display:grid;grid-template-columns:7.2rem 1fr;gap:10px;padding:14px 2px;border-bottom:1px solid rgba(var(--t-tx-rgb),.14);align-items:baseline}
.dato .et{color:rgba(var(--t-tx-rgb),.55);font-size:.92rem}
.dato a{text-decoration-color:rgba(var(--t-s-rgb),.55);text-underline-offset:4px}
.dato a:hover{color:rgb(var(--t-s-rgb))}
.dato .v a+a{margin-left:16px}
.pie{margin-top:30px;font-size:.86rem;color:rgba(var(--t-tx-rgb),.5);text-align:center}

/* ── Variaciones por tema ── */
html[data-tema="pub"] body{background:
  radial-gradient(110% 50% at 50% 0%,rgba(var(--t-p-rgb),.16),transparent 62%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 84px),
  rgb(var(--t-b0-rgb))}
html[data-tema="pub"] .letrero{
  font-size:clamp(2.9rem,13vw,7rem);letter-spacing:.01em;animation:none;text-shadow:none;
  color:rgb(var(--t-p-rgb));background:linear-gradient(180deg,#f7e6ad 8%,rgb(var(--t-p-rgb)) 48%,#8a5a1c 96%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.65));
  padding:.12em .5em .2em;border-top:2px solid rgba(var(--t-p-rgb),.7);border-bottom:2px solid rgba(var(--t-p-rgb),.7);
}
html[data-tema="pub"] .puerta{border-radius:150px 150px 10px 10px;border-color:rgba(var(--t-p-rgb),.85);
  background:radial-gradient(95% 55% at 50% 100%,rgba(var(--t-p-rgb),.26),transparent 72%),linear-gradient(180deg,rgba(var(--t-p2-rgb),.34),rgba(var(--t-b2-rgb),.95) 66%);
  box-shadow:0 0 0 7px rgb(var(--t-b0-rgb)),0 0 0 8px rgba(var(--t-p-rgb),.4),0 0 40px rgba(var(--t-p-rgb),.22),inset 0 0 60px rgba(var(--t-p-rgb),.18)}
html[data-tema="pub"] .p-b{background:rgb(var(--t-p-rgb))}
html[data-tema="pub"] .que{color:rgb(var(--t-l-rgb))}
html[data-tema="discoteca"] .letrero{
  font-size:clamp(2.2rem,10.5vw,5.8rem);font-weight:900;letter-spacing:-.01em;text-transform:uppercase;
  text-shadow:-3px 0 rgba(var(--t-c-rgb),.85),3px 0 rgba(var(--t-p-rgb),.95),0 0 42px rgba(var(--t-p-rgb),.7),0 0 100px rgba(var(--t-p2-rgb),.55)}
html[data-tema="discoteca"] .puerta{border-radius:18px;
  background:linear-gradient(160deg,rgba(var(--t-p-rgb),.34),rgba(var(--t-b2-rgb),.92) 46%,rgba(var(--t-c-rgb),.22))}
html[data-tema="discoteca"] .insignia{border-radius:18px}

html[data-tema="sobrio"] body,html[data-tema="elegante"] body{background:radial-gradient(120% 50% at 50% 0%,rgba(var(--t-p-rgb),.10),transparent 62%),rgb(var(--t-b0-rgb))}
html[data-tema="sobrio"] .letrero{font-weight:800;font-size:clamp(2.6rem,11.5vw,6rem);letter-spacing:-.025em;animation:none;text-shadow:none;color:rgb(var(--t-tx-rgb));
  padding-bottom:.18em;border-bottom:3px solid rgb(var(--t-p-rgb))}
html[data-tema="elegante"] .letrero{font-weight:700;font-size:clamp(2.7rem,12vw,6.4rem);letter-spacing:.01em;animation:none;text-shadow:none;color:rgb(var(--t-p-rgb));
  padding:.1em .4em .16em;border-top:1px solid rgba(var(--t-p-rgb),.6);border-bottom:1px solid rgba(var(--t-p-rgb),.6)}
html[data-tema="sobrio"] .puerta,html[data-tema="elegante"] .puerta{border-width:1px;border-color:rgba(var(--t-p-rgb),.8);
  background:linear-gradient(180deg,rgba(var(--t-p-rgb),.16),rgba(var(--t-b2-rgb),.96) 62%);
  box-shadow:0 0 0 7px rgb(var(--t-b0-rgb)),0 0 0 8px rgba(var(--t-p-rgb),.28),0 24px 50px rgba(0,0,0,.45)}
html[data-tema="sobrio"] .puerta{border-radius:20px}
html[data-tema="sobrio"] .puerta::after,html[data-tema="elegante"] .puerta::after{display:none}
html[data-tema="sobrio"] .puerta:hover,html[data-tema="sobrio"] .puerta:focus-visible,html[data-tema="elegante"] .puerta:hover,html[data-tema="elegante"] .puerta:focus-visible{
  box-shadow:0 0 0 7px rgb(var(--t-b0-rgb)),0 0 0 8px rgba(var(--t-p-rgb),.6),0 28px 60px rgba(0,0,0,.55)}
html[data-tema="sobrio"] .insignia{border-radius:16px}
html[data-tema="sobrio"] .p-b{background:rgb(var(--t-p-rgb));color:#fff}
html[data-tema="elegante"] .p-b{background:rgb(var(--t-p-rgb))}
html[data-tema="elegante"] .que{color:rgb(var(--t-l-rgb))}
@media(prefers-reduced-motion:reduce){.letrero{animation:none}.puerta,.servicio{transition:none}}
</style>
</head>
<body>
<div class="cielo"><div class="muro" id="muro"></div></div>
<main class="fachada">
  <h1 class="letrero" data-m="nombre"></h1>
  <p class="que" id="i-que"></p>
  <p class="lema" data-m="lema" data-m-si="lema"></p>

  <nav class="puertas" aria-label="Entradas">
    <a class="puerta" id="i-clientes" href="clientes.html">
      <img class="insignia" data-m-src="logoGrande" alt=""/>
      <span class="p-t">Soy cliente</span>
      <span class="p-d">Carta, rocola y llamar a la mesera</span>
      <span class="p-b">Entrar</span>
    </a>
    <a class="servicio" href="personal.html">
      <span class="placa">Funcionarios</span>
      <span class="s-txt"><span class="s-t">Trabajo aquí</span><span class="s-d">Ingreso del equipo</span></span>
    </a>
  </nav>

  <section class="datos" id="i-datos" aria-label="Datos del negocio">
    <div class="dato" id="i-f-donde"><span class="et">Dónde</span><span class="v"><a id="i-mapa" target="_blank" rel="noopener"></a></span></div>
    <div class="dato" id="i-f-horario"><span class="et">Horario</span><span class="v" id="i-horario"></span></div>
    <div class="dato" id="i-f-reservas"><span class="et">Reservas</span><span class="v"><a id="i-wa" target="_blank" rel="noopener"></a></span></div>
    <div class="dato" id="i-f-redes"><span class="et">Síguenos</span><span class="v" id="i-redes"></span></div>
  </section>
  <p class="pie" id="i-pie"></p>
</main>
<script>
(function(){
  var N=NEGOCIO,$=function(i){return document.getElementById(i);},quita=function(i){var e=$(i);if(e)e.remove();};
  var tipo=N.tipo?N.tipo.charAt(0).toUpperCase()+N.tipo.slice(1).toLowerCase():'';
  $('i-que').textContent=tipo&&N.ciudad?tipo+' en '+N.ciudad:(tipo||N.ciudad||'');
  if((N.fondos||[]).length)$('muro').style.backgroundImage='url('+encodeURI(N.fondos[0])+')';else quita('muro');
  if(!N.logoGrande&&N.logo)document.querySelector('.insignia').src=N.logo;
  if(!N.logoGrande&&!N.logo)quita(document.querySelector('.insignia').id='i-sinlogo');
  // si llegan con el QR de una mesa, la mesa sigue hasta la página de clientes
  var q=location.search||'';if(/[?&]mesa=/.test(q))$('i-clientes').href='clientes.html'+q;
  var mod=N.modulos||{},cosas=['Carta'];if(mod.rocola!==false)cosas.push('rocola');if(mod.llamar!==false)cosas.push('llamar a la mesera');
  document.querySelector('.p-d').textContent=cosas.length>1?cosas.slice(0,-1).join(', ')+' y '+cosas[cosas.length-1]:cosas[0];
  if(N.direccion){$('i-mapa').textContent=N.direccionCiudad;$('i-mapa').href=N.mapaUrl;}else quita('i-f-donde');
  if(N.horario)$('i-horario').textContent=N.horario;else quita('i-f-horario');
  if(N.waUrl){$('i-wa').textContent='WhatsApp '+N.telefonoBonito;$('i-wa').href=N.waUrl+'?text='+encodeURIComponent('Hola, quiero hacer una reserva en '+N.nombreCorto);}
  else if(N.telefono){$('i-wa').textContent=N.telefonoBonito;$('i-wa').href='tel:'+String(N.telefono).replace(/[^0-9+]/g,'');}else quita('i-f-reservas');
  var redes=[];if(N.instagram)redes.push(['Instagram','https://instagram.com/'+encodeURIComponent(N.instagram)]);if(N.tiktok)redes.push(['TikTok','https://www.tiktok.com/@'+encodeURIComponent(N.tiktok)]);
  if(redes.length)redes.forEach(function(r){var a=document.createElement('a');a.textContent=r[0];a.href=r[1];a.target='_blank';a.rel='noopener';$('i-redes').appendChild(a);});else quita('i-f-redes');
  if(!$('i-datos').children.length)quita('i-datos');
  $('i-pie').textContent=N.nombreCorto+(N.tipo?' '+N.tipo:'')+(N.desde?', desde '+N.desde:'');
  var tc=document.querySelector('meta[name="theme-color"]');
  window.alCambiarTema=function(){if(tc)tc.content=getComputedStyle(document.documentElement).backgroundColor;};window.alCambiarTema();
})();
</script>
</body>
</html>
