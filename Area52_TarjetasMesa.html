<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área 52 – Generador de Tarjetas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a0d00;--panel:#221508;--border:#5a3010;--accent:#8b1a1a;--accent2:#c0392b;--text:#e8d5a0;--muted:#9a7a50;--green:#1a4010}
body{background:var(--bg);color:var(--text);font-family:'Special Elite',serif;min-height:100vh}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 16px;gap:14px;overflow-y:auto;position:sticky;top:0;height:100vh}
.sidebar h1{font-family:'Bebas Neue',cursive;font-size:24px;color:#f0d080;letter-spacing:2px;text-align:center;border-bottom:1px solid var(--border);padding-bottom:10px}
h2{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;background:#1a0e04}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent2);background:#2a1208}
.drop-zone p{font-size:12px;color:var(--muted);margin-top:6px}
.drop-zone .icon{font-size:28px}
.drop-zone.loaded{border-color:#2ecc71;background:#0a2010}
.drop-zone.loaded p{color:#2ecc71}
#file-input{display:none}
.zone-list{display:flex;flex-direction:column;gap:6px}
.zone-item{background:#2a1808;border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.zone-item input[type=text]{background:transparent;border:none;border-bottom:1px solid #5a3a18;color:var(--text);font-family:'Special Elite',serif;font-size:13px;outline:none;padding:2px 4px;width:100%}
.zone-item input:focus{border-color:var(--accent2)}
.zone-badge{padding:2px 10px;border-radius:20px;font-size:10px;letter-spacing:1px;font-family:sans-serif;font-weight:700;white-space:nowrap}
.btn-del{background:none;border:none;color:#6a3020;cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.btn-del:hover{color:#c03020}
.btn-add-zone{background:transparent;border:2px dashed var(--border);border-radius:8px;color:var(--muted);font-family:'Special Elite',serif;font-size:12px;padding:7px;cursor:pointer;transition:all .15s;width:100%;margin-top:4px}
.btn-add-zone:hover{border-color:var(--accent);color:var(--text)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.field input[type=number]{background:#1a0e04;border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Bebas Neue',cursive;font-size:18px;padding:5px 8px;outline:none;text-align:center;width:100%}
.field input:focus{border-color:var(--accent2)}
.preview-scroll{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto}
.preview-chip{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#1a0e04;border:1px solid #2a1808;border-radius:5px;font-size:11px}
.preview-chip .num{font-family:'Bebas Neue',cursive;font-size:17px;color:#f0d080;min-width:30px}
.zone-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-family:sans-serif;font-weight:700}
.btn{padding:10px 16px;border-radius:8px;border:none;font-family:'Special Elite',serif;font-size:13px;cursor:pointer;transition:all .15s;width:100%}
.btn-gen{background:var(--accent);color:#fff;font-size:14px}
.btn-gen:hover{background:var(--accent2)}
.btn-gen:disabled{opacity:.4;cursor:default}
.btn-dl{background:var(--green);color:#fff}
.btn-dl:hover{background:#2a6018}
.btn-dl:disabled{opacity:.35;cursor:default}
.progress{height:5px;background:#2a1808;border-radius:3px;overflow:hidden;display:none;margin-bottom:2px}
.progress-bar{height:100%;background:var(--accent2);width:0%;transition:width .1s}
.main{padding:24px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.main-header{font-family:'Bebas Neue',cursive;font-size:16px;color:var(--muted);letter-spacing:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.thumb-wrap{display:flex;flex-direction:column;gap:5px;align-items:center}
.btn-dl-single{background:#1a4010;color:#fff;border:none;border-radius:5px;font-size:11px;padding:4px 10px;cursor:pointer;font-family:sans-serif}
.btn-dl-single:hover{background:#2a6018}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px;opacity:.35}
.empty .icon{font-size:48px}
.empty p{font-size:13px;letter-spacing:1px;text-align:center}
@media print{.sidebar{display:none}.main{padding:4px}.grid{grid-template-columns:repeat(3,1fr);gap:6px}.btn-dl-single,.main-header{display:none}}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <h1>👽 Área 52<br><span style="font-size:17px;color:var(--muted)">Generador de Tarjetas</span></h1>
  <div>
    <h2>Imagen base</h2>
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">🖼️</div>
      <p id="drop-label">Haz clic o arrastra aquí<br>la imagen original (PNG)</p>
    </div>
    <input type="file" id="file-input" accept="image/png,image/jpeg">
  </div>
  <div>
    <h2>Mesas</h2>
    <button class="btn-add-zone" style="background:#22c55e22;border-color:#22c55e;color:#22c55e;margin-bottom:8px" onclick="cargarMesasPOS()">🔄 Cargar mesas del POS</button>
    <div id="pos-estado" style="font-size:11px;color:var(--muted);margin-bottom:10px"></div>
    <h2 style="margin-top:6px">Zonas (manual)</h2>
    <div class="zone-list" id="zone-list"></div>
    <button class="btn-add-zone" onclick="addZone()">+ Agregar zona</button>
  </div>
  <div>
    <h2>Rango de mesas por zona</h2>
    <div id="zone-ranges"></div>
  </div>
  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:4px">
    <h2>Mesas a generar (<span id="total-count">0</span>)</h2>
    <div class="preview-scroll" id="preview-list"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <button class="btn btn-gen" id="btn-gen" onclick="generateAll()" disabled>⚡ Generar todas</button>
    <button class="btn btn-dl" id="btn-dl-all" onclick="downloadAll()" disabled>📦 Descargar ZIP</button>
    <button class="btn" style="background:#2a1808;border:1px solid var(--border);color:var(--muted)" onclick="window.print()">🖨️ Imprimir vista</button>
  </div>
</div>
<div class="main">
  <div class="main-header">TARJETAS GENERADAS</div>
  <div class="grid" id="grid">
    <div class="empty"><div class="icon">🛸</div><p>1. Carga la imagen original<br>2. Configura las zonas<br>3. Genera las tarjetas</p></div>
  </div>
</div>
</div>

// ── Coordenadas verificadas píxel a píxel en imagen 1024x1024 ──
// Número "23": cols 724-800, filas 162-226 → borramos con color papel

const PAPER = 'rgb(244,241,221)';  // color promedio del fondo papel

// QR original: módulos negros sobre el PAPEL (sin recuadro blanco).
// Area de módulos del QR original: cols 300-723, filas 302-758
// Borramos SOLO esa área con color papel, sin tapar los textos laterales.

const QR_SIZE=440;  // lado del nuevo QR (fondo papel)
// Centrar el nuevo QR en el centro del área del QR original
const QR_CX=Math.floor((300+723)/2), QR_CY=Math.floor((302+758)/2);
const QR_X=QR_CX-Math.floor(QR_SIZE/2), QR_Y=QR_CY-Math.floor(QR_SIZE/2);

// ── Conexión con el POS (Firebase) ──────────────────────────────────────────
var ZONA_LABELS={'antejardín':'Antejardín','antejardIn':'Antejardín','piso1':'Piso 1','piso2':'Piso 2'};
var ZONA_ORDER=['antejardín','antejardIn','piso1','piso2'];
var mesasPOS=null;  // si se cargan del POS, se usan estas
var _fbTarjetas=null;
function initFB(){
  if(_fbTarjetas)return _fbTarjetas;

  _fbTarjetas=firebase.database();
  return _fbTarjetas;
}
function cargarMesasPOS(){
  var est=document.getElementById('pos-estado');
  est.textContent='🔄 Conectando con el POS...';
  try{
    var db=initFB();
    db.ref('mesas').once('value').then(function(snap){
      var v=snap.val();
      if(!v){est.innerHTML='<span style="color:#ef4444">No se encontraron mesas en el POS.</span>';return;}
      var arr=Array.isArray(v)?v:Object.values(v);
      arr=arr.filter(function(m){return m&&m.num!=null;});
      // Ordenar por zona y número
      arr.sort(function(a,b){
        var za=ZONA_ORDER.indexOf(a.zona),zb=ZONA_ORDER.indexOf(b.zona);
        if(za<0)za=99;if(zb<0)zb=99;
        if(za!==zb)return za-zb;
        return (a.num||0)-(b.num||0);
      });
      mesasPOS=arr.map(function(m){
        var zlabel=ZONA_LABELS[m.zona]||m.zona||'';
        return {num:m.num,nombre:m.nombre,zone:zlabel,zoneIdx:Math.max(0,ZONA_ORDER.indexOf(m.zona))};
      });
      est.innerHTML='<span style="color:#22c55e">✓ '+mesasPOS.length+' mesas cargadas del POS</span>';
      // Ocultar config manual de zonas (ya no se necesita)
      document.getElementById('zone-list').style.opacity='0.4';
      updatePreview();
    }).catch(function(err){
      est.innerHTML='<span style="color:#ef4444">Error: '+err.message+'</span>';
    });
  }catch(e){est.innerHTML='<span style="color:#ef4444">Error de conexión.</span>';}
}


// Cargar QR
qrImg=new Image();
qrImg.src='data:image/png;base64,'+QR_B64;

// Drop zone
const dropZone=document.getElementById('drop-zone');
const fileInput=document.getElementById('file-input');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-over');loadFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));

function loadFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=ev=>{
    origImg=new Image();
    origImg.onload=()=>{
      dropZone.classList.add('loaded');
      document.getElementById('drop-label').textContent='✅ '+file.name;
      document.getElementById('btn-gen').disabled=false;
    };
    origImg.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// Zonas
function zoneColor(i){return ZONE_COLORS[i%ZONE_COLORS.length]}

function renderZones(){
  document.getElementById('zone-list').innerHTML=zones.map((z,i)=>{
    const c=zoneColor(i);
    return `<div class="zone-item">
      <input type="text" value="${z.name}" oninput="zones[${i}].name=this.value;updatePreview()">
      <span class="zone-badge" style="background:${c.bg};color:${c.text}">${i+1}</span>
      <button class="btn-del" onclick="delZone(${z.id})">✕</button>
    </div>`;
  }).join('');

  document.getElementById('zone-ranges').innerHTML='<div style="display:flex;flex-direction:column;gap:8px">'+
    zones.map((z,i)=>{
      const c=zoneColor(i);
      return `<div style="background:#2a1808;border:1px solid #3a2008;border-radius:8px;padding:10px 12px">
        <div style="margin-bottom:8px"><span class="zone-badge" style="background:${c.bg};color:${c.text};font-size:11px">${z.name}</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div class="field"><label>Inicio</label><input type="number" min="1" value="${z.from}" oninput="zones[${i}].from=+this.value;updatePreview()"></div>
          <div class="field"><label>Fin</label><input type="number" min="1" value="${z.to}" oninput="zones[${i}].to=+this.value;updatePreview()"></div>
        </div>
      </div>`;
    }).join('')+'</div>';

  updatePreview();
}

function addZone(){
  const last=zones[zones.length-1];
  zones.push({id:nextId++,name:'Nueva Zona',from:last?last.to+1:1,to:last?last.to+5:5});
  renderZones();
}

function delZone(id){
  if(zones.length<=1)return;
  zones=zones.filter(z=>z.id!==id);
  renderZones();
}

function getMesas(){
  if(mesasPOS&&mesasPOS.length)return mesasPOS;  // usar las mesas reales del POS
  const all=[];
  zones.forEach((z,zi)=>{for(let n=z.from;n<=z.to;n++)all.push({num:n,zone:z.name,zoneIdx:zi})});
  return all;
}

function updatePreview(){
  const mesas=getMesas();
  document.getElementById('total-count').textContent=mesas.length;
  const el=document.getElementById('preview-list');
  if(!mesas.length){el.innerHTML='<div style="color:var(--muted);font-size:12px">Sin mesas</div>';return;}
  el.innerHTML=mesas.map(m=>{
    const c=zoneColor(m.zoneIdx);
    return `<div class="preview-chip"><span class="num">${m.num}</span><span class="zone-tag" style="background:${c.bg};color:${c.text}">${m.zone}</span></div>`;
  }).join('');
}

// Fuente
const fontFace=new FontFace('BebasNeue','url(https://fonts.gstatic.com/s/bebasneue/v14/JTUSjIg69CK48gW7PXoo9WdhyyTh89ZNpQ.woff2)');
fontFace.load().then(f=>document.fonts.add(f)).catch(()=>{});

function drawCard(ctx, mesaNum, zoneName, zoneIdx){
  // 1. Dibujar imagen original completa
  ctx.drawImage(origImg, 0, 0, 1024, 1024);

  // 2. Borrar el número "23" original con el color exacto del papel
  ctx.fillStyle = PAPER;
  ctx.fillRect(NUM_X, NUM_Y, NUM_W, NUM_H);

  // 3. Escribir el nuevo número en la misma posición y estilo
  ctx.fillStyle = '#1a0f05';
  ctx.font = "118px 'BebasNeue','Bebas Neue',Impact,sans-serif";
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(String(mesaNum), NEW_NUM_X, NEW_NUM_Y);

  // 4. Borrar SOLO el área de módulos del QR original con color papel
  //    (el QR original no tiene recuadro blanco, va sobre el papel)
  ctx.fillStyle = PAPER;
  ctx.fillRect(QR_ERASE_L, QR_ERASE_T, QR_ERASE_R-QR_ERASE_L, QR_ERASE_B-QR_ERASE_T);

  // 5. Dibujar el nuevo QR (ya trae fondo papel) centrado en ese espacio
  ctx.drawImage(qrImg, QR_X, QR_Y, QR_SIZE, QR_SIZE);

  // 6. Badge de zona en esquina inferior izquierda
  if(zoneName){
    const c=ZONE_COLORS[zoneIdx%ZONE_COLORS.length];
    ctx.font='bold 30px sans-serif';
    const tw=ctx.measureText(zoneName).width;
    const bw=tw+44, bh=46, bx=28, by=938, br=12;
    ctx.fillStyle=c.bg;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,br);ctx.fill();
    ctx.fillStyle=c.text;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(zoneName,bx+bw/2,by+bh/2);
  }
}

async function generateAll(){
  if(!origImg){alert('Primero carga la imagen original.');return;}
  const mesas=getMesas();
  if(!mesas.length){alert('Configura al menos una zona.');return;}
  generatedBlobs=[];
  document.getElementById('btn-dl-all').disabled=true;
  document.getElementById('grid').innerHTML='';
  const prog=document.getElementById('progress');
  const bar=document.getElementById('progress-bar');
  prog.style.display='block'; bar.style.width='0%';

  for(let i=0;i<mesas.length;i++){
    const m=mesas[i];
    bar.style.width=((i+1)/mesas.length*100)+'%';
    const off=new OffscreenCanvas(1024,1024);
    const oc=off.getContext('2d');
    drawCard(oc,m.num,m.zone,m.zoneIdx);
    const blob=await off.convertToBlob({type:'image/png'});
    const fname=`Area52_${m.zone.replace(/\s+/g,'_')}_Mesa${m.num}.png`;
    generatedBlobs.push({blob,name:fname});
    const bmp=await createImageBitmap(blob);
    const wrap=document.createElement('div');
    wrap.className='thumb-wrap';
    const c=ZONE_COLORS[m.zoneIdx%ZONE_COLORS.length];
    const idx=generatedBlobs.length-1;
    wrap.innerHTML=`<div style="position:relative;width:100%">
      <canvas width="256" height="256" style="width:100%;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.6)"></canvas>
      <span style="position:absolute;bottom:6px;left:6px;background:${c.bg};color:${c.text};font-size:10px;padding:2px 8px;border-radius:10px;font-family:sans-serif;font-weight:600">${m.zone}</span>
    </div>
    <div style="font-size:11px;color:${c.bg};letter-spacing:1px;text-align:center">Mesa ${m.num}</div>
    <button class="btn-dl-single" onclick="dlSingle(${idx})">⬇ Descargar</button>`;
    wrap.querySelector('canvas').getContext('2d').drawImage(bmp,0,0,256,256);
    document.getElementById('grid').appendChild(wrap);
    await new Promise(r=>setTimeout(r,0));
  }

  prog.style.display='none';
  document.getElementById('btn-dl-all').disabled=false;
}

function dlSingle(idx){
  const {blob,name}=generatedBlobs[idx];
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.download=name;a.href=url;a.click();
  URL.revokeObjectURL(url);
}

async function downloadAll(){
  if(!generatedBlobs.length)return;
  const zip=new JSZip();
  generatedBlobs.forEach(item=>{
    const zfolder=item.name.replace('Area52_','').split('_Mesa')[0].replace(/_/g,' ');
    zip.folder(zfolder).file(item.name,item.blob);
  });
  const content=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(content);
  const a=document.createElement('a');a.download='Area52_Tarjetas.zip';a.href=url;a.click();
  URL.revokeObjectURL(url);
}

renderZones();
</script>
